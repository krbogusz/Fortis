[sporadic_u_lowering]
time = 355
name = "SPORADIC: short *u lowers to *o (the lexically-diffused West Germanic lowering)"
description = """The lowering of *u to *o in Old English is notoriously irregular — *kustuz > cost,
*furduz > ford, *fulmô > folm lower, while *fullaz > full, *bukkaz > bucc, *hundą > hund and the
i-stem *kustiz > cyst keep their *u in the very same environments. Because it cannot be predicted
from the phonology it is word-scoped, applied to the words that attest it. Dated with a-mutation,
which is the regular relative of the same change. Only fulmō is lowered here, since OHG folma shares
its *o (Ringe & Taylor PDF 48). cost and ford, whose OHG cognates keep *u, are in
sporadic_u_lowering_oe after the 403 checkpoint."""
