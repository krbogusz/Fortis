name = "SPORADIC (reanalysis): *harjaz 'army' is the ja-stem here, ending -e"
description = """*harjaz gives OE here, with the ja-stem *-e; our cascade leaves the *-j stranded
word-finally (*xerj). The *-e is the ja-stem nominative, levelled in from the oblique. Lexical."""
words = ["harjaz"]
definition = "j → e / _ #"


[sporadic_grindel]
