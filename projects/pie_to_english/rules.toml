name = "Palatal umlaut: *e raises to *i before /x/ + t, s, θ"
description = """*e raises to *i before the *ht cluster: niht, riht, miht, liht, the ancestors of night,
right, might, light. Ringe & Taylor give the clusters as ht, hþ and hs (PDF 351), and six takes the
same raising before *hs. Ringe & Taylor (§6.9.7, PDF 351–352) call this West Saxon and Kentish palatal
umlaut; Anglian keeps *æ smoothed but unraised (æhta 'eight', §6.9.2, PDF 327). So only *e raises:
the old *æ clause turned eahta into **ihta. night gets its *e from the i-umlauted oblique stem
(`sporadic_night_oblique_i`). The rule id is kept for continuity. t = 426, after
oe_anglian_smoothing_liquid, which turns the i-mutated *æe into the *e this rule raises."""
