then contracts it to tēn. Cause: the Anglian form, which ME tēn > ten continues. Word-scoped because
oe_anglian_smoothing is pinned to *h + consonant: the 900 targets feoh and eoh keep their West
Saxon diphthong before a final *h."""
words = ["ten"]
definition = "e o → e ∅ / _ x [+syll]"

[oe_anglian_raising]
