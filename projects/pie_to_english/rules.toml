regular: *berȝaz keeps its stop (beorg), *talȝaz keeps its (tealg), both in the same environment.
Word-scoped to mearh; dated 404, before wg_g_hardening (405) turns the *ȝ into a stop. Old English
spells the final consonant both ways, mearg ~ mearh 'marrow' (Minkova, PDF 81). So the cause is
variation, and each target records one variant."""
