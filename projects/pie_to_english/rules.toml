# Laryngeal colouring, in one rule per direction via conditionals. The context is the
# laryngeal natural class — a guttural [+cons, advancement: rtr] (= *h₁ χ, *h₂ ħ, *h₃ ʁʷ here).
# Two conditional labels then pick the colour from the laryngeal's own quality:
# label 1 fires next to an [aperture: low] guttural (*h₂ ħ) and lowers *e to *a; label 2 fires
# next to a [+rounded] guttural (*h₃ ʁʷ) and backs/rounds *e to *o. *h₁ (χ) is neither
# [aperture: low] nor [+rounded], so neither label fires and *e is left alone — its neutrality
# falls out. A merge result keeps a stressed /e/'s stress; the target *e is the mid
# front vowel [+syll, -cons, +front, aperture: mid]: -cons excludes syllabic consonants
# (r̩, l̩, …) and aperture: mid picks out mid *e (not high *i or low *a).
# Two rules, not one: the notation can't put the laryngeal on "either" side at once.
[laryngeal_colouring_after]
time = -2000
name = "Laryngeal colouring after a laryngeal"
description = "*h₂e > *h₂a, *h₃e > *h₃o (h₁ leaves e)"
definition = "[+syll, -cons, +front, aperture: mid] → [<1: aperture: low>, <1: advancement: rtr>, <2: back: 1>, <2: rounded: 1>, <2: labial: 1>, <2: front: none>] / [+cons, advancement: rtr, <1: aperture: low>, <2: +rounded>] _"

[laryngeal_colouring_before]
time = -2000
name = "Laryngeal colouring before a laryngeal"
description = "*eh₂ > *ah₂, *eh₃ > *oh₃"
definition = "[+syll, -cons, +front, aperture: mid] → [<1: aperture: low>, <1: advancement: rtr>, <2: back: 1>, <2: rounded: 1>, <2: labial: 1>, <2: front: none>] / _ [+cons, advancement: rtr, <1: aperture: low>, <2: +rounded>]"

[centumization]
time = -2000
name = "Centumization"
description = "Merging of PIE 'palatovelar' and 'velar' plosives"
definition = "[+cons, -sonorant, +back, +front] → [front: none]"

[pie_stop_loss_before_sk]
time = -2000
name = "A stop is lost before *s + velar"
description = """Ringe (PDF 197, 268): the PIE present *pr̥sḱé/ó- 'to ask' (Skt pr̥ccháti, Lat. poscere) is
built to the root *preḱ-, whose final velar is lost before the *-sḱé/ó- suffix. So *frug-ska-,
Kroonen's source of *fruska- 'frog' (PDF 160), gives *fruskaz."""
definition = "[-son, -cont, -syll] → ∅ / [+syll] _ s [-son, -cont, -syll, +back]"

[sr_to_str]
time = -2000
name = "Word-initial */sr/ > */str/"
description = """Ringe §5.2.2 (iii): PIE "*sr-, which became PGmc *str-". A *t is epenthesised
between the *s and the *r — *srówmos > *straumaz 'stream', *sr̥- > *sturkaz 'stork'.

Dated at -2000 and placed BEFORE `u_epenthesis`, which is the whole trick: *sturkaz comes from
*sr̥- with a SYLLABIC rhotic, and u_epenthesis turns that *r̥ into *ur at this same time. Run the
epenthesis first and there is no *sr- left for this rule to see — the form is already *sur-.

Grimm then leaves the new *t alone: it stands after *s, where Grimm's first clause is blocked, and
the attested *str- has a plain *t."""
# Two clauses because the rhotic comes in two segments: the consonant *r and the SYLLABIC *r̥,
# which is a nucleus and a different letter. *sr̥- is exactly the shape of *sturkaz.
definition = [
    "∅ → t / # s _ r",
    "∅ → t / # s _ [+trill, +syll]",
]

# Word-initial *ps- metathesises to *sp-, and *pst- simplifies to *sp-: *psórwos > *sparwaz
# 'sparrow', *psten-on- > *spenô 'teat'. Kroonen calls the metathesis regular (s.v. *sparwa(n)-,
# PDF 506, "cf. *stelan- < *tsel-e-"; s.v. *spenan-, PDF 506). Ringe is silent.
[kroonen_initial_ps]
time = -2000
name = "Word-initial *ps- becomes *sp-, *pst- becomes *sp-"
description = "Kroonen s.v. *sparwa(n)-, *spenan-, PDF 506 — *psórwos > *sparwaz, *psten- > *spen-"
definition = ["p s t → s p ∅ / # _", "p s → s p / # _"]

# A dental is regularly lost between *n and *j: *h₁s-n̥t-yós > *sunjaz 'truth' (Kroonen s.v.
# *sunja-, PDF 532).
[kroonen_dental_loss_nj]
time = -2000
name = "A dental is lost between *n and *j"
description = "Kroonen s.v. *sunja-, PDF 532 — *h₁sn̥tyós > *sunjaz"
definition = "[+cons, -continuant, +anterior, -sonorant] → ∅ / [+cons, nasal: 1] _ j"

[u_epenthesis]
time = -2000
name = "'u' epenthesis"
description = "Epenthesis of /u/ before the syllabic sonorants"
# `+son`: the epenthesis is for the syllabic SONORANTS (*l̥ r̥ m̥ n̥ > ul ur um un). A syllabic
# LARYNGEAL is also [+cons, +syll] and was being caught by it — but a laryngeal does not take an
# epenthetic *u, it vocalises to *ə (`laryngeal_vocalization`). Written without the restriction,
# Kroonen's *n̥h₂-s-eh₂- came out **unsō.
definition = "∅ [+cons, +syll, +son] → u [-syll]"

# A laryngeal between a voiceless stop and another stop, after a vowel, is lost, as it is between a
# resonant and an obstruent (laryngeal_vocalization, first clause): the syllable already has its
# nucleus. Before dental_cluster, which then turns the new *tt into *ss.
[laryngeal_loss_between_stops]
time = -2000
name = "A laryngeal is lost between a voiceless stop and a stop"
description = """*mith₂-tós > *mittós > *missaz 'wrong' (dental_cluster). Without this, laryngeal_aspiration
gave the *t a breathy aspiration that no letter spells, and missaz ended in an unspellable segment.
Voiced stops keep the aspiration that daughter needs (*dʰugh₂tér > *duhtēr). Inferred from the
lexicon (DECISIONS.md, 2026-10-07): missaz is the only word with the sequence."""
definition = "[+cons, advancement: rtr] → ∅ / [+syll] [-son, -cont, -voice] _ [-son, -cont]"

# A dental stop + epenthetic s + dental stop collapses to ss (*TsT > ss): the dental
# stops ([+cons,-continuant,+anterior,-sonorant], i.e. t/d) become s, the span
# shrinking 3→2. The result is letters (replacement path) so the lengths may differ.
# The bare *TT cluster does the same thing and needs its own clause: Wiktionary writes the
# epenthetic *s only sometimes, so *widtós, *sedtós and *kʷχdtos arrive with the two dentals
# simply adjacent, and the 3→2 clause above cannot see them. Without it Grimm's third clause
# turns the *d into a *t and the words end in **wettaz, **settaz, **hwattaz for the attested
# *wissaz, *sessaz, *hwassaz. This is the dental half of Primärberührung; the velar half (a
# stop before *t going to a fricative) is the clause added to Grimm's law below.
[pgmc_dtl_simplification]
time = -2000
name = "*dtl simplifies to *tl"
description = """Kroonen s.v. *maþla- (PDF 398): "*mad-tlo- developed into PGm. *maþla- through a
simplified form *matlo-". So *sed-tlo- 'seat' (Kroonen s.v. *setla-, PDF 474) gives *setlo-, and
Grimm's law then gives the *seþlą that Ringe & Taylor's PWGmc *seþl continues (PDF 344). It comes
before dental_cluster in the file, which would otherwise make the *-dt- into *-ss-."""
definition = "d → ∅ / _ t l"

[dental_cluster]
time = -2000
name = "Dental cluster simplification"
description = "*TsT, *TT > ss — *wid-tós > *wissós 'certain', *sedtós > *sessaz"
definition = [
    "[+cons, -continuant, +anterior, -sonorant] s [+cons, -continuant, +anterior, -sonorant] → s s",
    "[+cons, -continuant, +anterior, -sonorant] [+cons, -continuant, +anterior, -sonorant] → s s",
]

# A geminate is one consonant doubled, so match it as `1=[+cons] @1` (capture, then
# the same consonant again) — not `[+cons]{2}`, which is any two consonants AND whose
# single quantified element can't pair with the two-element result. The first copy
# stays ([+cons] is a no-op merge), the second is deleted (∅); counts match, 2:2.
#
# Dated AFTER the laryngeals resolve (-1900, not -2000), because the rule asks whether a
# CONSONANT precedes the geminate and a laryngeal is not yet the thing it will be. In *kʷχdtos
# the *χ still looks like a consonant, so the *ss the dental cluster has just made was being
# shortened away — **xʷɑzɑz for the attested *xʷɑssɑz. But that *χ vocalises to a VOWEL, and a
# short vowel is exactly the environment where a geminate is kept. Let the laryngeals settle
# first and the question answers itself.
[geminate_shortening]
time = -1900
name = "Geminate shortening"
description = "A geminate shortens after a consonant or a long vowel"
definition = "1=[+cons] @1 → [+cons] ∅ / ([+cons]|[length: long]) _"

[sporadic_masc_nstem_nominative]
time = -2000
name = "SPORADIC: the masculine n-stem nominative *-ōn loses its *n"
description = """The masculine n-stems have an oral overlong *-ô in Proto-Germanic (*hazô, *bullô), the
feminine ōn-stems a nasal *-ǭ (*kwenǭ, *widuwǭ), and both are cited with *-ōn. Ringe: PIE n-stem
nominatives had come to end in *-ō by Szemerényi's Law and loss of the *n (PDF 62). Kroonen: nom.
*hazō < *kas-ōn (PDF 263), nom. *bulō (PDF 121). Cause: the old nominative of the masculine type.
Word-scoped, because the engine does not know gender; the list names the masculine nouns. Before
overlong_vowels, which then makes the final *ō overlong."""
words = ["bull", "hare", "tehswô", "moth"]
definition = "n → ∅ / oː _ #"

[overlong_vowels]
time = -2000
name = "Overlong vowels creation"
description = "Word-final long vowels are lengthened to 'overlong' vowels"
definition = "[length: long]# → [length: overlong]"

# The *ts > *s rule is `ts_simplification`, at the END of this file. It was long thought to be
# unstateable — *fōts and *wrōts keep the cluster that *wīsaz and *swēsaz lose — and the answer is
# that the environment is completed by what FOLLOWS: word-final in the first pair, before a vowel
# in the second.

[loss_of_initial_laryngeals]
time = -2000
name = "Loss of initial laryngeals"
description = "Word-initial laryngeals are lost before a consonant"
definition = "#[+cons, advancement: rtr][+cons] → ∅[+cons]"

# *-aiH- before *u or *w gives *-aikw-: *dayh₂uros > *taikuraz 'brother-in-law', *aiHw- >
# *aikwernan- 'squirrel' (Kroonen s.v. *taikwer-, PDF 546, and *aikwernan-, PDF 48–49). Ringe
# reaches the same *k through Cowgill's law on a preform with *h₂w (PDF 98, 181); see DECISIONS.md.
[kroonen_laryngeal_velarization]
time = -2000
name = "A laryngeal after *j becomes *g before *u or *w"
description = "Kroonen s.v. *taikwer-, PDF 546; *aikwernan-, PDF 48–49 — *dayh₂uros > *taikuraz"
definition = "[+cons, advancement: rtr] → g / j _ [+syll, +back, aperture: high]"

[cowgills_law]
time = -2000
name = "Cowgill's law"
description = "*/h₃/ (and possibly */h₂/) is strengthened to */g/ between a sonorant and */w/"
# `[+syll]`, not `[+son]`. Ringe states the environment as "between a sonorant and *w (in that
# order)" — but BOTH of his examples have that sonorant as a NUCLEUS: *n̥h₃wé (a syllabic *n̥) and
# *gʷih₃wós 'alive' (a vowel *i) > *kwikwós > PGmc *kwikwaz. Read as any sonorant, the law also
# fires after a consonantal *l — and *gʰelh₃wos then comes out **gelkwaz against an attested
# *gelwaz with a plain *w. Kroonen keeps the laryngeal in the root (*gʰelh₃- 'yellow'), so the
# preform is not the problem; the environment is. Post-vocalic, as the examples have it.
definition = "ʁʷ → g / [+syll] _ w"

# Post-vocalic loss runs *before* pre-vocalic loss so that an intervocalic laryngeal
# lengthens its preceding vowel (VHV > VːV) instead of being deleted pre-vocalically.
# Only a laryngeal with no preceding vowel (#HV, CHV) then falls through to the
# pre-vocalic rule.
# Laryngeal loss WITHOUT lengthening comes first — before the post-vocalic loss below, which
# lengthens the vowel it follows. Order matters and the gold settles it:
#   * between two vowels the laryngeal simply drops, leaving a diphthong: *kéh₂ilos > *hailaz,
#     not the long vowel **hālaz that the lengthening rule would give;
#   * before a resonant it drops too, and the vowel stays SHORT: *suHnús > *sunuz, *h₂yuHn̥ḱós
#     > *jungaz — both attested with a short /u/.
# Run the other way round (the file's original order), the lengthening rule takes these first
# and the loss never sees them.
[w_gemination_before_laryngeal]
time = -2000
name = "A laryngeal after */w/ geminates it before the accent"
description = """*dʰowh₂óm > PGmc *dawwą 'dew', *lowHéh₂ > *lawwō. The laryngeal does not vocalise
and does not simply drop — it is absorbed into the *w, which comes out long. The Germanic *ww of
these words has no other source.

Only before the accent. Kroonen states Holtzmann's law as pretonic gemination (§2.2.5.7, PDF 36–37)
and says of *lawwō that "the geminate *-ww- points to original oxytony" (PDF 370). The root-accented
*trówh₂eh₂ and *h₂éwh₂ōn keep a single *w in *þrawō and *awô. The condition holds for every *wH
word in the set (DECISIONS.md, 2026-10-07).

t = -2000, and placed ahead of the laryngeal-loss rules at the same time: they run first and there
is nothing left for this one to absorb."""
definition = "[+cons, advancement: rtr] → w / w _ [+syll, stress: primary]"

[sporadic_stora_glide_loss]
time = -2000
name = "SPORADIC: *steh₂u-ro- gives *stōraz 'big'"
description = """Kroonen §2.1.5 (PDF 22–23) lists "*stōra- adj. 'big': ON stórr, OE, OFri. stōr < *steh₂u-ro-"
among the words whose laryngeal lengthened the vowel before *u and whose long diphthong then lost
its glide in an open syllable. Word-scoped: the cascade does not adopt that glide loss as a regular
rule, since roo keeps its *w (DECISIONS.md, 2026-10-07). Cause: Kroonen's derivation. Ringe derives
the oxytone *stauraz 'post' from the same root without it (PDF 107), and stauraz-stake keeps *au.
After the colouring of *e to *a, before loss_of_laryngeals_before_vowels."""
words = ["stōraz"]
definition = "a ħ u → aː ∅ ∅"

[loss_of_laryngeals_before_vowels]
time = -2000
name = "Loss of laryngeals before a vowel or a resonant, without lengthening"
description = "*h₁ésti > *ésti > *isti; *kéh₂ilos > *hailaz; *suHnús > *sunuz"
definition = [
    "[+cons, advancement: rtr] [+syll, -cons] → ∅ [+syll, -cons]",
    # Before a resonant the laryngeal drops WITHOUT lengthening — but only after an UNSTRESSED
    # vowel. Stress is what separates the two outcomes: barytone *dʰóh₁mos lengthens its stressed
    # root vowel (> *dōmaz), while oxytone *suHnús and *h₂yuHn̥ḱós have the laryngeal in a pretonic
    # syllable and stay short (> *sunuz, *jungaz). Without the stress condition, doom comes out
    # **damaz. The second clause repeats it for a SYLLABIC resonant (*n̥ is [+syll, +cons], so it
    # matches neither the vowel clause above nor the consonant clause here).
    "[+cons, advancement: rtr] → ∅ / [+syll, stress: none] _ [+syll, +cons]",
]

# SPORADIC. Ringe §5.3.1 is explicit that losing the laryngeal WITHOUT lengthening is the
# exception, not the rule:
#
#   "Usually the laryngeal was lost with compensatory lengthening of the preceding vowel:
#    PIE *priHtós > PGmc *frīdaz ... PIE *túh₂ > PGmc *þū ...
#    Occasionally, however, the laryngeal is simply lost WITHOUT lengthening of the vowel:
#    PIE *wih₁rós >! PGmc *wiraz;  PIE *suh₃nús >! PGmc *sunuz;  PIE *luH- in PGmc *lunaz"
#
# The `!` is his own mark for a step that is not regular sound change, and he says why it is
# LEXICAL rather than phonological: "the short vowels of 'son' and 'ransom' reappear in other
# derivatives of the same roots in various languages". It is a property of these words.
#
# So the cascade lengthens, and this rule is scoped to the handful that do not — which is exactly
# what `words` is for. What stood here before was a STRESS condition on the general rule, fitted
# to make *sunuz and *weraz land; it cost *glēmaz, *hūnaz, *mēraz and *dūnaz, all four of which
# have a real (specified) laryngeal and lengthen precisely as Ringe says they should. It even
# drove a note in PREFORM_FIXES calling *hūnaz an honest miss "whose long *ū the corpus flatly
# contradicts" — reasoning from the exceptions to condemn the rule.
#
# delō joins the list on 2026-10-07. Kroonen derives its short *e from *dʰeh₁l-éh₂ by Dybo's law,
# pretonic shortening before a resonant (§2.1.2, PDF 17). As a regular rule that law shortened the
# same four words and sīmô, so the cascade does not adopt it (DECISIONS.md, 2026-10-07).
#
# t = -2000, NOT earlier: `syllable_parts` is time-keyed, and a rule dated before the first
# nucleus definition is syllabified against nothing — which strands the stress autoseg and
# silently unstresses every word in the lexicon.
[lex_laryngeal_lost_without_lengthening]
time = -2000
name = "SPORADIC: the laryngeal is lost without lengthening (a lexical handful — Ringe)"
words = ["son", "weraz", "lunaz", "ell", "young", "youth", "delō"]
definition = "[+cons, advancement: rtr] → ∅ / [+syll] _ [+son, +cons]"

[loss_of_laryngeals_after_vowels]
time = -2000
name = "Loss of laryngeals after vowels"
description = "Laryngeals are lost after vowels but lengthen the preceding vowel"
definition = "[+syll, -cons] [+cons, advancement: rtr] → [+syll, -cons, length: long] ∅"

# The long vowel left by post-vocalic laryngeal loss then absorbs a following short
# vowel in hiatus: Vː V > V̂. The overlong takes the long first vowel's quality (the
# merge keeps it, and any stress); the short second vowel is deleted. The first must
# be [length: long], so only laryngeal-lengthened hiatus contracts — *-oHom (> *oːom)
# > *-ôm; *-eh₂es (> *aːas) > *-âs.
[vowel_contraction]
time = -2000
name = "Vowel contraction in hiatus"
description = "A long vowel absorbs a following short vowel into an overlong — *-oHom > *-ôm"
definition = "[+syll, -cons, length: long] [+syll, -cons] → [length: overlong] ∅"

# A laryngeal after a STOP that already has a vowel before it does not vocalise either — it
# ASPIRATES the stop and disappears: *dʱugħteːr > *dʱugʱteːr. The vowel is what makes the
# difference. In *dʱugħteːr the /u/ is the nucleus, so the laryngeal cannot be one; in *kħponeħ
# the word-initial /k/ has no vowel to lean on and the laryngeal must vocalise (> *xɑβɑnɔː), so
# the context demands the preceding vowel rather than firing on any stop.
# Sanskrit spells the aspirate out: *dʱugħteːr is duhitā́, with the -h- straight from the *gʱ.
# Without this, the laryngeal became a schwa, the schwa fed Verner's Law, and the *t voiced —
# **dukðeːr for the attested *duxtɛːr. The same hole as the sonorant clause below, one manner up.
[laryngeal_aspiration]
time = -2000
name = "A laryngeal aspirates a preceding stop"
description = "*dʱugħteːr > *dʱugʱteːr > *duxtɛːr 'daughter' — the *gʱ is Sanskrit duhitā́'s -h-"
# `tension: slack` as well as `glottal_aperture: spread`, because the aspirate PIE actually has is
# the BREATHY one. The two diacritics are not the same segment: `ʰ` is `1 glap` (plain aspiration)
# and `ʱ` is `+vc, 1 glap, -1 tns` (breathy voice — spread glottis AND slack tension). Setting only
# the glottal aperture made a *g* that was spread but not slack, which spells `gʰ`, not the `gʱ`
# the lexicon writes. It worked only by luck: Grimm's first clause matches on FEATURES
# ([+voice, glottal_aperture: spread]) and caught it anyway — but any rule written against the
# letter+diacritic `gʱ` would have looked straight through it, exactly as with the `ɑ` that was
# still labial. Make the segment the thing it is supposed to be.
definition = "[-son, -cont] [+cons, advancement: rtr] → [glottal_aperture: spread, tension: slack] ∅ / [+syll] _"

# A laryngeal between a sonorant CONSONANT and an obstruent is LOST, not vocalised. If it
# vocalised, its schwa would be an unaccented vowel standing before the obstruent — which feeds
# Verner's Law and voices it. *ǵénh₁tis would then give **kinðiz, but the attested Proto-Germanic
# is *kinþiz, with a voiceless þ: the /t/ is still protected by the root accent, which means no
# vowel ever intervened. The loss is written as the first clause of the same rule so that it is
# ordered before the general vocalisation.
[laryngeal_vocalization]
time = -2000
name = "Vocalisation of remaining laryngeals (with loss between a resonant and an obstruent)"
description = "*ǵénh₁tis > *kenþis (no schwa, so Verner cannot fire) > *kinþiz"
definition = [
    # The `[+syll]` at the front is what keeps the loss out of a word-initial cluster, and it is
    # the same condition the aspiration rule above turns on: a laryngeal only declines to be a
    # nucleus when the syllable already HAS one. *ǵénh₁tis has its *e, so the laryngeal goes.
    # *mh₂ḱrós does not — the *m is word-initial — and dropping the laryngeal there left **mxrɑz,
    # a word with no vowel in it at all, for the attested *mɑɣrɑz. With no vowel to lean on the
    # laryngeal must vocalise, which is what the last clause then does.
    "[+cons, advancement: rtr] → ∅ / [+syll] [+son, -syll, +cons] _ [-son]",
    # ...and after a SYLLABIC resonant too: *ǵn̥h₃tós has its laryngeal between *n̥ and *t. If it
    # vocalises there, the schwa feeds Verner and the *t voices — but the attested *kunþaz has a
    # voiceless *þ. Same hole that gave **kinðiz for kind.
    "[+cons, advancement: rtr] → ∅ / [+syll, +cons] _ [-son]",
    "[+cons, advancement: rtr] → ə",
]

# A laryngeal before a resonant is lost WITHOUT lengthening the vowel: *suHnús > *sunuz and
# *h₂yuHn̥ḱós > *jungaz both have a SHORT /u/ in the attested Proto-Germanic, so the general
# "loss after a vowel", which lengthens, must not reach them.

# Osthoff's law: a long vowel shortens before a sonorant + consonant, but not before a word-final
# sonorant (Ringe §3.2.1 (iii), PDF 105–107; Kroonen §2.1.5, PDF 21–22). It comes after
# tautosyllabic *VH has become long, which feeds it: *pḗrsneh₂ > *fersnō 'heel', post-PIE *wēntós >
# *wentós > *windaz 'wind', *yūnkós > *yunkós. Ringe says it "probably applied"; Kroonen also
# explains *mimza- < *mēms-o- by it. The two books agree, so it is regular here.
[sporadic_cow_nominative]
time = -1950
name = "SPORADIC: *gʷōws gives the nominative *kōz"
description = """Kroonen s.v. *kō- ~ *kū- 'cow' (PDF 339): "both of which belonged to an originally ablauting
paradigm nom. *kōz, obl. *kū-, continuing a PIE u-stem *gʷeh₃-u-s, obl. *gʷh₃-u-". The long
diphthong of the nominative loses its glide, as Kroonen says such diphthongs did before Osthoff's
law (§2.1.5, PDF 22–23), and *kō- has a plain *k beside the round vowel. Word-scoped: the cascade
does not adopt Kroonen's glide loss as a regular rule (DECISIONS.md, 2026-10-07). Cause: Kroonen's
derivation of the nominative. Before pgmc_osthoffs_law, which would shorten the *ō."""
words = ["cow"]
definition = ["w → ∅ / oː _ s #", "gʷ → g / # _ oː", "s → z / oː _ #"]

[sporadic_ajja_kroonen]
time = -1950
name = "SPORADIC: *h₂ōwyóm loses its glide and shortens its vowel before the accent"
description = """Kroonen derives *ajja- 'egg' as "*ajja- < *ojó- < *ōjó- < *h₂ōu-yó-" (§2.1.2, PDF 18): the long
diphthong loses its glide (§2.1.5), Dybo's law shortens the pretonic vowel, and Holtzmann's law
then geminates the *j (PDF 37; kroonen_holtzmann_j). The cascade adopts neither the glide loss nor
Dybo's law as a regular rule (DECISIONS.md, 2026-10-07), so this rule applies them to this word.
Word-scoped. Cause: Kroonen's derivation. Before pgmc_osthoffs_law."""
words = ["ajją"]
definition = "oː w → o ∅ / _ j [+syll, stress: primary]"

[pgmc_osthoffs_law]
time = -1900
name = "Osthoff's law: a long vowel shortens before a sonorant + consonant"
description = "Ringe §3.2.1 (iii), PDF 105–107; Kroonen §2.1.5, PDF 21–22 — *pḗrsneh₂ > *fersnō"
definition = "[+syll, -cons, length: long] → [length: short] / _ [+son, -syll] [-syll]"

# Word-initial *CuV- becomes *CwV- (*su(H)īnom > *swīną, *suignós > *swiknaz), and *w is then lost
# between a labial and a round vowel: *ph₂uṓr > *puwōr > *pwōr > *fōr 'fire' (Ringe §3.2.5 (ii),
# PDF 158, and §3.2.6 (i), PDF 173). Figure 3.1 puts both before *o > *a.
[pgmc_initial_cuv]
time = -1900
name = "Word-initial *CuV- becomes *CwV-"
description = "Ringe §3.2.5 (ii), PDF 158 — *su(H)īnom > *swīną, *ph₂uṓr > *pwōr"
definition = "[+syll, aperture: high, +back] → w / # [-syll, -son] _ [+syll]"

[pgmc_w_loss_labial_round]
time = -1900
name = "*w is lost between a labial and a round vowel"
description = "Ringe §3.2.6 (i), PDF 173 — *pwōr > *fōr"
definition = "w → ∅ / [+labial, -syll, lingual: none] _ [+syll, +rounded]"

[velar_labialization]
time = -2000
name = "Velar labialization"
description = "Velars are labialised by following */w/, which is deleted. The rule asks for an obstruent: a *w is back and high too, and the rule used to merge the *ww of w_gemination_before_laryngeal into one *w."
definition = "[-son, +bk, aperture: high] w → [+rounded] ∅ "

[sporadic_fifth_cardinal_p]
time = -2000
name = "SPORADIC: the ordinal *fimftô takes the *p of the cardinal *fimf"
description = """Kroonen s.v. *fimftan-, PDF 180–181: the ordinal was rebuilt on the full-grade root of the
cardinal, whose *p for *kʷ is itself sporadic (*penkʷe > *fimf). Before the labiovelars are
delabialised."""
words = ["fifth"]
definition = "kʷ → p / _ t"

[labiovelar_delabialization]
time = -2000
name = "Labiovelar delabialization"
description = """Labiovelars are delabialised next to */u/ (or after */un/) or before */t/. Ringe PDF 122–123:
"Labiovelars were delabialized next to *u", and also "when preceded by the sequence *un", as in
*lungraz and *tungōn. The second line states the left side, which the rule used to lack: dunkalaz
kept its *kʷ."""
definition = [
    "[+bk, aperture: high, +rnd, -son] → [labial: none] / _ (u|t)",
    "[+bk, aperture: high, +rnd, -son] → [labial: none] / [+syll, +bk, +rnd, aperture: high] n? _",
]

[final_non_high_short_vowel_loss]
time = -1000
name = "Word-final non-high short vowel loss"
description = "Word-final non-high short vowels are lost, along with preceding /j/ or /w/ (single syllables not affected)"
definition = [
    "[+syll] → [stress: primary] / _ [-syll]* [+syll, stress: primary, -cons, aperture: !high, length: short] #",
    "j?w?[+syll, -cons, aperture: !high, length: short] → ∅ / [+syll] []* _ #"
]

# KLUGE'S LAW. Kroonen §2.2.5.2: "voiced *b, *d and *g were geminated to *bb, *dd and *gg by the
# assimilation of a following *n IN A STRESSED SYLLABLE. These geminates were then devoiced to
# *pp, *tt and *kk together with old Proto-Indo-European *b, *d, *g during STAGE 2 of Grimm's
# law." His worked example is one of ours: "*budmo, gen. *buttaz m. 'bottom' < *bʰudʰ-men, gen.
# *bʰudʰ-n-ós".
#
# Two things fix its date, and both point here — immediately BEFORE Grimm:
#   * it must precede Grimm's FIRST clause, or the *dʰ of *bʰudʰnós is already a fricative *ð and
#     there is no stop left to geminate;
#   * it must precede Grimm's THIRD clause, which is what devoices the *dd it makes to the *tt the
#     attested *buttaz shows. Kroonen says so outright ("during stage 2 of Grimm's law").
#
# The geminate is a PLAIN voiced stop, which is why the aspirates are written out to plain b/d/g
# here rather than recalled with @1: recalled, they would keep their breathiness, Grimm's first
# clause would turn both halves into fricatives, and the word would come out **buððaz.
#
# "In a stressed syllable" is the accent condition, and it is what the `/ _ [+syll, stress:
# primary]` context says: the *n must belong to the stressed syllable, i.e. stand before its vowel.
[kluges_law]
time = -1100
name = "Kluge's law: a voiced stop geminates before a stressed *n"
description = """Kroonen §2.2.5.2 — *bʰudʰnós > *buddos > (Grimm) *buttaz 'bottom'.

The stop must be preceded by a VOWEL, and that is not decoration. Kluge's law assimilates a
SUFFIXAL *n to a ROOT-FINAL stop (*bʰudʰ-nós), and a root-final stop always has the root's vowel
before it. Without that condition the rule also fires on a word-initial onset cluster, where the
*n is part of the root and no suffix is in sight: *ǵnéwom came out as **kkewą, geminating a *ǵ
that begins the word, against an attested *knewą 'knee' whose *kn is intact."""
definition = [
    "bʱ n → b b / [+syll] _ [+syll, stress: primary]",
    "dʱ n → d d / [+syll] _ [+syll, stress: primary]",
    "gʱ n → g g / [+syll] _ [+syll, stress: primary]",
    "b n → b b / [+syll] _ [+syll, stress: primary]",
    "d n → d d / [+syll] _ [+syll, stress: primary]",
    "g n → g g / [+syll] _ [+syll, stress: primary]",
]

[deaspiration_before_s]
time = -1010
name = "A voiced aspirate deaspirates before */s/"
description = """A PIE obstruent cluster agrees in voicing and aspiration with its LAST member, so
*bʰ before *s is simply *b: *wóbʰseh₂ 'wasp' has *bs, not *bʰs.

The pay-off is in Grimm's ordering. Deaspirated, the *b is no longer input to clause 1 (aspirates →
fricatives) and falls to clause 3 (plain voiced stops → voiceless stops), which runs LAST precisely
so that its output is not fricativised in turn — the same protection that gives *h₂éyǵs > *aiks and
not **aixs. Result: *wapsō, with the attested STOP.

Without it the *bʰ becomes *β, West Germanic devoices it, and the word comes out **wafsō."""
definition = "[-son, -cont, +voice, glottal_aperture: spread] → [glottal_aperture: neutral, tension: neutral] / _ s"

[s_to_m_before_m]
time = -1010
name = "*/sm/ > */mm/"
description = """*h₁ésmi 'I am' > PGmc *immi (Goth. im, OE eom) — Ringe cites the pair. The *s
assimilates completely to the following nasal.

AFTER A VOWEL only. Word-initial *sm- is a perfectly good onset and stays: without the condition
*sméldoh₂ came out **mmeltō."""
definition = "s → m / [+syll] _ m"

[dl_simplification]
time = -1100
name = "Word-initial */dl/ loses its stop"
description = """*dlóngʰos > PGmc *langaz. A word-initial stop + *l is not a licit onset in
Germanic and the stop simply goes; the cascade otherwise carried it through Grimm and produced
**tlangaz, with an onset no attested Germanic word has."""
definition = "d → ∅ / # _ l"

[sporadic_hluda_long_u]
time = -1000
name = "SPORADIC: *hlūdaz 'loud' has a secondary long *ū"
description = """Kroonen s.v. *hlūda-, PDF 271–272: the root *ḱlu- has no laryngeal, so the long *ū "arose
secondarily within Germanic". Kroonen (PDF 272) tentatively suggests a vrddhi derivative. No other
cause is known."""
words = ["loud"]
definition = "u → uː / l _"

[sporadic_juz_z]
time = -1000
name = "SPORADIC: *jūz 'you' takes the *-z of *wīz 'we'"
description = """Ringe (PDF 164, 244): the *-z of *jūz is analogical, from *wīz. The preform is Kroonen's *iuH-s
(s.v. *jūz, PDF 315)."""
words = ["jūz"]
definition = "s → z / _ #"

[grimms_law]
time = -1000
name = "Grimm's law"
description = "The chain shift of the three plosive series. The order of the clauses is not free, and the gold settles it: the ASPIRATES must go to fricatives first, so that *mógʰtis has an obstruent /ɣ/ standing before its *t (which therefore does not fricativise) and devoices to the attested *mɑxtiz. The PLAIN voiced stops must go last, so that the /k/ *h₂éyǵs makes out of *ǵ is not fricativised in its turn — the attested form is *aiks, not **aixs. Run the other way round, each order breaks the other's word."
definition = [
    # 1. bʱ dʱ gʱ → β ð ɣ. The third series lands on voiced FRICATIVES, not stops: Proto-Germanic
    #    has *beβruz, *lɑɣuz, *ɣarðaz, and [b d g] are its allophones word-initially and after a
    #    nasal (pgmc_voiced_fricative_hardening). Deriving stops here makes every medial one wrong.
    "[-son, -cont, +voice, glottal_aperture: spread] → [glottal_aperture: neutral, tension: neutral, +cont]",
    # 2. p t k → ɸ θ x, except after an obstruent — ANY obstruent, including the voiced fricatives
    #    clause 1 has just made, which is what protects the *t of *mógʰtis.
    "[-son, -cont, -voice] → [+cont] // [-son] _",
    # 2b. …but a plain voiced stop standing BEFORE *t fricativises instead of hardening — the
    #     velar half of Primärberührung. *jugtós is *juxtɑz and *regʲtós is *rextɑz, with an /x/,
    #     where clause 3 alone would harden the *g to /k/ and give **juktɑz, **rektɑz. It sits
    #     before clause 3 precisely to get there first; the /t/ itself is already protected by
    #     clause 2, which will not fricativise a stop standing after an obstruent. The aspirates
    #     need no clause here — clause 1 has already made them fricatives, so [-cont] misses them.
    "[-son, -cont, +voice] → [+cont, -voice] / _ t",
    # 3. b d g → p t k. Last, so the new stops are not caught by clause 2.
    "[-son, -cont, +voice, glottal_aperture: neutral] → [-voice]",
]

[verners_law]
time = -1000
name = "Verner's law"
description = "Voiceless fricatives are voiced when preceded by an unaccented vowel, including cases where the vowel and fricative are separated by a sonorant (n, m, r, l, j, w)"
definition = "[-son, +cont, -voice] → [+vc] / [+syll, stress: none] [+son, -syll]? _ "

[grimm_dentalisation]
time = -1000
name = "The Germanic fricative *þ is DENTAL"
description = """Grimm fricativises the coronal stop *t — which is ALVEOLAR (+lingual, +front,
+anterior, no dental), the place PIE *t has — and Verner voices some of the results, so on the
feature geometry alone the fricatives would come out alveolar. But the Proto-Germanic dental
fricative *þ [θ] and its Verner variant *ð are DENTAL, and stay dental all the way to Modern
English /θ ð/. Stated here as a place shift concurrent with the fricativisation, so the fricative
is dental FROM THE START rather than moved there by a late rule. Written on FEATURES — the coronal
continuant that is NOT the sibilant *s (which is +strident) — so it catches *þ from Grimm, *ð from
Grimm's aspirate clause, and *ð from Verner alike, whatever letter renders them."""
definition = "[-son, +cont, +lingual, +front, +anterior, strident: none, dental: none] → [+dental]"

# Kroonen's order puts Kluge's law AFTER Verner's law (Grimm 1 > Verner > Kluge > Grimm 2; §2.2.5.2
# and the flowchart, §2.2.6, PDF 31, 38): a Verner-voiced *ð before *n and the accent geminates to
# *tt. *ḱueit-nó- > *hwītta- > *hwīta- 'white' (s.v. *hwīta-, PDF 307). Before the stress is fixed,
# because the accent conditions it. See DECISIONS.md for the choice against Ringe.
[kroonen_kluge_after_verner]
time = -1000
name = "Kluge's law after Verner: *ðn before the accent becomes *tt"
description = "Kroonen §2.2.5.2, §2.2.6; s.v. *hwīta-, PDF 307 — *ḱweytnós > *hwītta- > *hwīta-"
definition = "ð n → t t / ([+syll] | j) _ [+syll, stress: primary]"

[kroonen_holtzmann_j]
time = -1000
name = "Holtzmann's law: *j geminates before the accent"
description = """Kroonen states Holtzmann's law as pretonic gemination (§2.2.5.7, PDF 36–37), with *twajjan
'of two' < *dwoi-óm and *wajju- 'wall' < *wh₁̥i-u-, whose laryngeal vocalises "between consonantic
resonants" first (PDF 608). Here the *j geminates only after a vowel that survives: *e, *o, *a, or
the schwa of a first syllable, which becomes *a (Ringe PDF 109). It does not geminate after *i
(free, frijō, sijǭ) or after a schwa that is later lost (kin, kunją). Tested on its own, Kroonen's
unrestricted law broke those five (DECISIONS.md, 2026-10-07). Before stress_change, because the
condition is the PIE accent."""
definition = [
    "j → j j / (e | o | a) _ [+syll, stress: primary]",
    "j → j j / # [-syll]* ə _ [+syll, stress: primary]",
]

[stress_change]
time = -1000
name = "Stress change to first syllable"
description = "All words become stressed on their first syllable. The PIE contrastive accent is lost, phonemicising the voicing distinction created by Verner's law"
definition = [
    "[+syll] → [stress: primary] / # [-syll]* _ []* [+syll, stress: primary]",
    "[+syll] → [stress: none] / [+syll] []* _",
]

[sporadic_mean_root_stress]
time = -1000
name = "SPORADIC: the stress of *gamainiz falls on the root, after the prefix"
description = """OE ġemǣne is stressed on the root: the prefix ġe- < *ga- is unstressed in Old English
nouns and adjectives as well as verbs. The general rule puts the Germanic stress on the first
syllable, which here is the prefix. Word-scoped, since mean is the only prefixed word in the set.
Cause: the prefix *ga- did not take the stress. The *g of *ga- itself has no source here: Kroonen
derives *gam- from *ḱom- (PDF 206), and Grimm's law gives *h, so mean still misses."""
words = ["mean"]
definition = [
    "[+syll, stress: primary] → [stress: none] / # [-syll]* _ [-syll]+ [+syll]",
    "[+syll] → [stress: primary] / # [-syll]* [+syll, stress: none] [-syll]+ _",
]

[word_initial_gw_to_b]
time = -1000
name = "Word-initial */gʷ/ > */b/"
description = "Word-initial */gʷ/ > */b/"
definition = "gʷ → b / # _"

[unstressed_owo_to_long_o]
time = -1000
name = "Unstressed */owo/ > */oː/"
description = "Unstressed */owo/ > */oː/"
definition = "[+syll, +bk, length: short, stress: none] w [+syll, +bk, length: short, stress: none] → oː"

[unstressed_ew_to_ow_before_consonant_or_finally]
time = -1000
name = "Unstressed */ew/ > */ow/ before a consonant or word-finally"
description = "Unstressed */ew/ > */ow/ before a consonant or word-finally"
definition = "[+syll, aperture: !high, +fr, length: short, stress: none] w → ow / _ ([-syll]|#)"

# The complementary environment of the rule above: the same rounding of an unstressed *e by a
# following *w, but PREVOCALICALLY, where it goes all the way to *u rather than stopping at *o.
[unstressed_ew_to_uw]
time = -1000
name = "Unstressed */ew/ > */uw/ before a vowel"
description = """*h₁widʰewṓn > PGmc *widuwō 'widow' (Kroonen), OE widuwe. Before a vowel the
unstressed *e of an *-ew- sequence is rounded and raised by the glide to *u, giving *-uw-; the
sister rule above catches the same *e before a consonant or word-finally and stops at *o.

Placed immediately BEFORE unstressed_e_to_i_except_before_r, which carries the same date (-1000):
at equal dates file order decides, and the general *e > *i raising would otherwise get there first
and give **widiwō for the attested *widuwō. The restriction to a following VOWEL is what keeps the
two apart — the *ew of *ew > *ow is preconsonantal or final, and never prevocalic."""
definition = "[+syll, aperture: !high, +fr, length: short, stress: none] w → uw / _ [+syll]"

[unstressed_e_to_i_except_before_r]
time = -1000
name = "Unstressed */e/ > */i/ except before */r/"
description = "Unstressed */e/ > */i/ except before */r/. Unstressed */ej/ contracts to */iː/"
# `aperture: mid`, not `aperture: !high`. The change is unstressed *e > *i — a MID vowel raising
# one step. "Not high" also takes in the LOW front *a, which laryngeal colouring makes out of *e
# (*h₂e > *a, a FRONT low vowel until `Low a backs to ɑ` later on). So *h₂enh₂ets was raising its
# second *a straight past *e to *i and coming out **anidz for the attested *anadz. An unstressed
# *a stays *a.
definition = [
    "[+syll, aperture: mid, +fr, length: short, stress: none] → i // _ r",
    "[+syll, aperture: mid, +fr, length: short, stress: none]j → iː // _ r"
]

[unstressed_e_to_a_before_r]
time = -950
name = "Unstressed */e/ > */a/ before */r/"
description = """Ringe §5.3.2 (iii). The raising of unstressed *e to *i is blocked before *r — but
the *e does not simply stay. It LOWERS:

  "It is reasonable to infer from this pattern of evidence that unstressed *e was lowered to *a
   before *r already in PGmc."

His evidence is the daughters: Gothic and Old Norse have *a regularly, Old Saxon and Old High
German vary with *a common, and only Anglo-Frisian shows *e — which is precisely the area where
PGmc *a was fronted and appears as *e when unstressed. So the *e is the innovation and the *a the
inheritance, not the other way round.

Dated after `unstressed_e_to_i_except_before_r`, whose exception is what leaves the *e standing
for this rule to find: *ánteros > *anþeraz > *anþaraz, *upér > *uber > *ubar, *n̥tér > *under >
*undar. Ringe cites *anþaraz and *undar himself, and flags the alternative (*-eraz?, *under?) as
the thing this inference resolves."""
definition = "[+syll, aperture: mid, +fr, length: short, stress: none] → ɑ / _ r"

[sievers_law]
time = -900
name = "Sievers' law: the *j suffix is *-ij- after a heavy syllable, *-j- after a light one"
description = """The weight of the preceding syllable decides whether the suffixal *j is preceded
by an *i, and Germanic redistributes the two REGARDLESS of which the PIE suffix had.

The 1sg of the weak verbs states it as a minimal pair, and the cascade had it exactly INVERTED —
it was faithfully passing through whichever suffix PIE happened to write:

    *sodéyoh₂  (light stem *sat-)  ->  we derived *satijō   attested *satjō
    *séh₂gyoh₂ (heavy stem *sōk-)  ->  we derived *sōkjō    attested *sōkijō

HEAVY is a long vowel plus a consonant (*sōk-), or any vowel plus TWO (*wurk-, *hauz-); LIGHT is a
short vowel plus exactly one (*sat-, *lag-, *straw-). Note the diphthong stems fall out of that
without a special case: *hauz- is *a + *w + *z, two consonants before the *j, and so heavy — while
*straw- is *a + *w, one consonant, and so light, exactly as attested.

Dated after `unstressed_e_to_i`, which is what makes the *i of the *-éye- suffix in the first
place; Sievers then takes it away again where the stem is light."""
definition = [
    # HEAVY, and so an *i appears: a long vowel + one consonant, or any vowel + two.
    "∅ → i / [+syll, length: !short] [-syll] _ j",
    "∅ → i / [+syll] [-syll] [-syll] _ j",
    # LIGHT, and so the *i goes: a short vowel + exactly one consonant.
    "i → ∅ / [+syll, length: short] [-syll] _ j",
]

[unstressed_ji_to_i]
time = -1000
name = "Unstressed */ji/ > */i/"
description = "Unstressed */ji/ > */i/"
definition = [
    "[+syll, aperture: high, +fr, length: short, stress: none]j[+syll, aperture: high, +fr, length: short, stress: none]  → iː",
    "j[+syll, aperture: high, +fr, length: short, stress: none] → i",

]

# `labial: none` matters as much as `rnd: none`, and leaving it off was the source of a whole
# class of silent bugs. A merge keeps every feature it does not mention. PIE *o is [+rounded,
# +labial]; this rule un-rounds it but said nothing about labial, so the *a it produced was the
# letter ɑ's bundle PLUS a stray `labial: 1`.
#
# That segment RENDERS as ɑ — the renderer falls back to the nearest letter and quietly drops the
# feature it cannot spell — but it is not the LETTER ɑ, and letter patterns match by identity. So
# every rule written `ɑ → …` looked straight through it. Anglo-Frisian brightening, OE breaking
# and the diphthong shift all fired on words whose ɑ came from the segmenter and silently skipped
# the ones whose ɑ came from *o, which print identically. Un-round the vowel completely and the
# two are the same segment again.
[mr_epenthesis]
time = -900
name = "SPORADIC: a *p is epenthesised between */m/ and */r/ in *ampraz"
description = """*amrós > PGmc *ampraz (Kroonen s.v. *ampra-, < *Hom-ro-). Word-scoped, because the stop is
not regular in Proto-Germanic: Ringe (PDF 261) has *timrijaną 'to build' with no stop (Goth.
timrjan), and the 200 and 403 targets of timber, *timrą and *timr, have none either. The b of OE
timber is an Old English epenthesis (oe_mr_epenthesis).

t = -900, AFTER Grimm and Verner. The epenthetic *p is a NEW stop and must not be swept into the
chain shift: run it before, and Grimm makes it *ɸ, Verner voices that to *β, and the *β hardens to
*b after the nasal — *ampraz came out **ambraz."""
words = ["ampraz"]
definition = "∅ → p / m _ r"

[pgmc_s_voicing_before_voiced]
time = -990
name = "*s is voiced to *z before a voiced obstruent"
description = """Ringe (PDF 32): PIE *s "was voiced to *[z] before voiced stops (e.g. in *nisdós …); it
probably also had a breathy-voiced allophone before breathy-voiced stops (e.g. in *misdʰó-)".
Grimm's law makes the plain *d of *nisdós voiceless, so its *s stays *s (*nistaz). After *dʰ the
*s stays voiced: *bʰr̥sdʰom > *burzdą 'board' and *bʰorsdʰos > *barzdaz 'beard' (Kroonen s.v.
*burzda-, *barzda-). Kroonen adds that this *z "was assimilated by the preceding r" after
rhotacism, hence OE bord, beard. Dated after Grimm's law, which creates the voiced fricatives."""
definition = "s → z / _ [-son, +voice]"

[non_high_back_merger]
time = -1000
name = "Merging of non-high back vowels"
description = "Merging of non-high back vowels"
definition = "([+syll, aperture: !high, !fr, advancement: atr] |[+syll, aperture: !high, !fr, advancement: rtr]) → [aperture: low, fr:none, +bk, advancement: rtr, rnd: none, labial: none]"

[final_m_to_n]
time = 0
name = "Word-final */m/ > */n/"
description = "Word-final */m/ > */n/"
definition = "m → n / _#"

# NOT before /s/, though *ħemsus > *ansuz makes it tempting: *ħomsos is the attested *amsaz
# 'shoulder', which KEEPS its /ms/. One and the same cluster cannot both assimilate and not, so
# the /n/ of *ansuz is not a sound change operating on /ms/ — it belongs to its preform, and that
# is a question for PREFORM_FIXES. Adding /s/ here buys *ansuz and loses *amsaz, dead even, and
# leaves a rule the corpus contradicts. The stops only.
[m_to_n_before_t_d]
time = -1500
name = "*/m/ > */n/ before a dental stop, after an UNSTRESSED vowel"
description = """The gold gives a minimal pair, and it settles both the condition and the date:

    *ḱm̥tóm   (oxytone)  > *hundą   — the *m̥ assimilates:  *m > *n
    *gʷḿ̥tis  (barytone) > *kumþiz  — it does NOT:         *m stays

Same syllabic *m̥, same following dental, opposite outcomes. The only thing that differs is the
accent, and the assimilation happens where the *m̥ is UNSTRESSED. (*mundiz, *munþaz and *kunþaz
look like more assimilation but are not: their PIE forms have a syllabic *n̥ to begin with —
*mn̥tís, *mń̥tos, *ǵń̥h₃tos — so the *n is simply inherited and this rule never touches them.)

Dated -1500, which is forced: it must come AFTER `u_epenthesis` (-2000), which turns the syllabic
*m̥ into *um and gives the rule a consonant to work on, and BEFORE `stress_change` (-1000), which
puts the accent on the first syllable of every word and so erases the very contrast the rule
reads. At the old date of 0 both vowels are stressed and the pair is indistinguishable — which is
why the rule fired on *kumþiz and produced **kunþiz.

The dentals are still plain *t and *d here: Grimm has not run yet."""
definition = "m → n / [+syll, stress: none] _ (t | d)"

[final_n_loss]
time = 0
name = "Final /n/ loss"
description = "Word-final */n/ is lost after an unstressed NON-HIGH vowel, nasalising it: *-am > *-ą, *-ōn > *-ǭ. After a high vowel the /n/ stands: the numerals *tehun, *newun, *sebun all keep it, and without the aperture condition they come out **tehũ."
definition = "[+syll, stress: none, aperture: !high] n → [+nas] ∅ / _#"

[lowering_of_nasal_long_e]
time = 0
name = "Lowering of nasal */ẽː/ to */ɑ̃ː/"
description = "Lowering of nasal */ẽː/ to */ɑ̃ː/"
definition = "[+syll, aperture: !high, +fr, length: long, nasal] → [aperture: low, fr: none, +bk, advancement: rtr, rnd: none, labial: none]"

[schwa_elimination]
time = 0
name = "Elimination of */ə/"
description = "Unstressed */ə/ is lost between consonants; */ə/ > */ɑ/ elsewhere"
definition = [
    "[+syll, aperture: none, stress: none] → ∅ / _ [-syll]",
    "[+syll, aperture: none] → ɑ"
]

[assimilation_of_sonorants]
time = 0
name = "Assimilation of sonorants"
description = "Assimilation of sonorants"
definition = [
    "1=n w → @1 @1",     # nw > nn
    "1=l n → @1 @1",     # ln > ll
    "z → @1 / _ 1=m",    # zm > mm
    "n → @1 / _ 1=m",    # nm > mm: *konh₂-méh₂ > *hammō 'ham' (Kroonen s.v. *ham(m)ō-, PDF 247)
    # …and *ðl > *ll — but only after a SHORT vowel. A geminate cannot stand after a heavy
    # nucleus, and the gold says so directly: *sth₂dʰlós has a short *a and gives *stallaz, while
    # *h₂éydʰlom has the diphthong *ai and gives *ailą with a SINGLE *l. Without the length
    # condition the diphthong word comes out **aillą.
    "ð → @1 / [+syll, length: short] _ 1=l",   # ðl > ll, after a SHORT vowel
    # After a heavy nucleus there is no room for the geminate, and the *ð simply goes:
    # *h₂éydʰlom > *ailą, with a single *l and no trace of the *ð.
    "ð → ∅ / [+syll, length: !short] _ l",
    "θ → ∅ / [+syll, length: !short] _ l",   # …and the voiceless one too: *spōþlǭ > *spōlǭ
    # …or after the glide half of a diphthong. Matched as the LETTERS *j and *w: in this feature
    # system a glide is [+cons] (it is a consonant that happens to be non-syllabic), so a
    # `[-syll, +son, -cons]` pattern — the obvious way to write "glide" — matches nothing at all.
    "ð → ∅ / (j | w) _ l",
]

# The velar fricative drops out of a *-ɣm- cluster after a sonorant: *drowgʱmos > *drɑwmɑz
# 'dream', *rewgʱmn̥ > *rɑwmɑz 'ream'. Grimm has already turned *gʱ into ɣ by here, so the rule
# is stated on the fricative, not on the aspirate. The [+son] context is what keeps it out of a
# word-initial cluster, where the ɣ survives and a vowel is epenthesised instead
# (*gʲʱmoː > *ɣumɔːː 'gome', not **mɔː).
[velar_fricative_loss_before_m]
time = 0
name = "*/ɣ/ is lost before */m/"
description = "*-ɣm- > *-m- after a sonorant — *drowgʱmos > *drɑwmɑz 'dream'"
definition = "ɣ → ∅ / [+son] _ m"

# Ringe §5.3.4 (iv), "Loss of word-final *t": PGmc *tehun has lost the final *-d of PIE *déḱm̥d,
# and he dates the loss of word-final CORONAL STOPS after the loss of word-final *-n.
#
# It has to reach the FRICATIVES too, not just the letter *t. By the time this fires, Grimm has
# already turned PIE *t into *þ and Verner may have voiced that to *ð — so *mélit arrives here as
# *milið, and a rule looking for a *t walks straight past it. (The *t of *tehun is a different
# animal: it comes from PIE *d, which Grimm hardens INTO a stop, so that one the rule always saw.)
# Both are the same coronal, and both are lost: PGmc *mili has no final consonant at all.
[final_t_loss]
time = 0
name = "Final coronal obstruent loss"
description = "Ringe §5.3.4(iv) — *déḱm̥d > *tehun, *mélit > *mili"
definition = [
    "[+syll, stress:none][-syll]*t → [+syll, stress:none][-syll]*∅ / _# ",
    "[+syll, stress:none][-syll]*θ → [+syll, stress:none][-syll]*∅ / _# ",
    "[+syll, stress:none][-syll]*ð → [+syll, stress:none][-syll]*∅ / _# ",
]

[gw_to_w]
time = 0
name = "*/gʷ/ > */w/"
description = "*/gʷ/ > */w/"
definition = "gʷ → w"

# The same exit, for the FRICATIVE labiovelar that Grimm's first clause makes out of *gʷʱ. It had
# none, so *snojgʷʱos kept it to the end and came out **snɑjɣʷɑz for the attested *snɑjwɑz.
# PIE *gʷʱ splits by position in Proto-Germanic: after a nasal it is the stop (*luŋgrɑz), and
# everywhere else it is *w. The nasal clause simply delabialises it and lets the voiced-fricative
# hardening below turn the plain *ɣ into the *g the attested form shows.
[gwh_to_w]
time = 0
name = "*/ɣʷ/ > */b/ word-initially, */g/ after a nasal before a consonant, */w/ elsewhere"
description = """*snojgʷʱos > *snɑjwɑz 'snow'; *penkʷros > *fiŋgrɑz 'finger'.

After a nasal the labiovelar keeps its labialization before a vowel. Ringe: "PGmc *gw survived only
after a homorganic nasal" (PDF 122), as in *lingwō. Before a consonant it loses it, as in *fingraz.
Kroonen dates that loss in finger before Verner's law (s.v. *fingra-, PDF 181). The rule states it
here, after Grimm, with the same result. lungs and tongue lose theirs earlier, after *un
(labiovelar_delabialization).

Ringe §5.3.3: "In word-initial position PIE *gʷʰ became PGmc *b, except when it had already been
delabialized by a following *u", and his examples are exactly ours — *gʷʰédʰyeti > *bidiþi,
*gʷʰen-/*gʷʰon- > *banô, *banjō. The path is *gʷʰ > *ɣʷ (Grimm) > *b, so the clause has to come
before the *ɣʷ > *w that follows it.

Wiktionary's *gʷʰórmos > *warmaz looks like a counterexample and is not one: Ringe REJECTS that
etymology outright, in the footnote to this very passage — "I connect PGmc *warmaz 'warm' with
Hitt. warnuzzi, not with Av. garəmō". So *warmaz is a bad etymon in the source, not a bad rule
here, and the source hierarchy (Ringe > Wiktionary) says the rule wins. Its miss is a preform
problem and is recorded as one."""
definition = [
    "ɣʷ → b / # _",
    "ɣʷ → ɣ / [+cons, nasal: 1] _ [-syll]",
    # also after *l: *wl̥kʷíh₂ > *wulgī (Ringe §3.2.4 (iii), PDF 143–144, who calls the point uncertain)
    "ɣʷ → ɣ / l _",
    "ɣʷ → w // [+cons, nasal: 1] _",
]

[long_a_raising]
time = 0
name = "Long /ɑ/ raising"
description = "*/ɑː/ > */ɔː/ "
definition = "[aperture: low, fr:none, +bk, advancement: rtr, !length: short] → [aperture: mid, rnd]"

[early_i_mutation]
time = 0
name = "Early i-mutation"
description = "*/e/ > */i/ before */i j/ in the same or next syllable; also eliminates */ei/ > */iː/"
# Short *e only. Long *ē₁ does not raise here — *dʰeh₁tís gives *dēdiz, not **dīdiz — so the
# target carries [length: short]; without it the laryngeal-lengthened *ē of deed/stead raised.
definition = [
    "[+syll, -cons, +front, aperture: mid, length: short] → [aperture: high] / _ [-syll]* [aperture: high, +front]",   # e > i / _ (C) {i,j}
    "[+syll, aperture: high, +front] [+syll, aperture: high, +front] → [length: long] ∅",            # ii > iː
    # …and *ij > *iː, which is what actually delivers the */ei/ > */iː/ the description promises.
    # Clause 1 raises the *e of *dejwós to *i, but the second half of the old diphthong is the
    # GLIDE *j, and the clause above only contracts two SYLLABIC vowels — so it never fired and
    # *dejwós came out **tijwɑz for the attested *tiːwɑz (likewise *hliːðɔː, *hriːðrɔ̃ː).
    # The `_ ([-syll]|#)` context is what saves *frijaz 'free': there the *j is PREVOCALIC, the
    # onset of the next syllable rather than the tail of a diphthong, and it must survive.
    "[+syll, aperture: high, +front] [aperture: high, +front, -syll] → [length: long] ∅ / _ ([-syll]|#)",
]

[e_to_i_before_syllable_final_nasal]
time = 0
application = "right_to_left"
name = "/e/ to /i/ before a syllable-final nasal"
description = "/e/ to /i/ before a syllable-final nasal"
definition = "e → i / _ [+nas]$"

[intervocalic_j_loss]
time = 0
name = "Loss of intervocalic *j"
description = "*/j/ is lost between vowels except after *i* (and, automatically, after *w*). The two vowels then contract — same quality to a long vowel, otherwise a diphthong."
definition = [
    "j → ∅ / [+syll] _ [+syll] // [+syll, aperture: high, +front] _",   # j-loss (kept after i; w handled by the context)
    "[+syll, aperture: low] [+syll, aperture: low] → [length: long] ∅",          # aa > aː  (same quality, e.g. aja > stānti)
    # after a SHORT vowel only: after a long one the hiatus stays, *wēji- > *wēï- (Ringe §3.2.6 (i), PDF 170)
    "[+syll, aperture: high, stress: none] → [-syll] / [+syll, length: short] _",       # Vi, Vu > diphthong  (offglide)
]

# ═══════════════════════════════════════════════════════════════════════════
# Common Germanic (Proto-Germanic) — final stage
# This project derives Proto-Indo-European to Proto-Germanic and stops here; the
# aː → oː change below is the last Proto-Germanic change (Index Diachronica §17.7).
# ═══════════════════════════════════════════════════════════════════════════

# §17.7  aː → oː: the long low vowel (older *ā/*ǣ) rounds and backs to */oː/ — the
# Proto-Germanic change that gives *mōdēr 'mother' its Germanic /oː/.
[long_a_to_long_o]
time = 160
name = "*/aː/ > */oː/"
description = "*maːder > *moːder 'mother'"
definition = "[+syll, aperture: low, length: long] → [back, rounded, labial, advancement: atr, front: none, aperture: mid]"

# ANALOGY, not a sound law. Verner's Law voices the nominative's *-s only after an unaccented
# vowel, so PIE's mobile accent splits the thematic nouns in two: barytone *wĺ̥kʷos gives
# *-az (the engine derives it correctly), but oxytone *tr̥nós gives *-as. Germanic has *-az
# throughout — the ending was levelled across the paradigm, erasing the accentual split. The
# levelling is stated here because no sound law produces it.
[sporadic_thill_jon_stem]
time = 175
name = "SPORADIC: *þilī joins the feminine jōn-stems as *þiljǭ"
description = """The cited preform *télh₂-ih₂ is a devī-stem and gives *þilī, but Proto-Germanic has *þiljǭ, which
Wiktionary calls a "nominal formation in *-jǭ related to *þelą". Cause: the ī-stem was extended with
*-n- and joined the feminine jōn-stems, as tongue joined the ōn-stems (sporadic_tongue_n_stem). The
*j then geminates the *l in West Germanic: OE þille."""
words = ["thill"]
definition = "iː → j ɔ̃ː / _ #"

[sporadic_tongue_n_stem]
time = 175
name = "SPORADIC: *tungōz joins the feminine ōn-stems as *tungǭ"
description = """Kroonen (s.v. *tungōn-, PDF 566-567) reconstructs the PIE word as an h₂-stem *dn̥ǵʰ-u(e)h₂-,
which the cited nominative *dn̥ǵʰwéh₂s continues as an ā-stem *tungōz. Every Germanic language has
an n-stem instead: Go. tuggo, ON tunga, OE tunge, OHG zunga. Cause: the old h₂-stem was extended
with *-n- and joined the feminine ōn-stems, whose nominative is *-ǭ. Dated 175, after the
ending's vowel has become *ɔː (170)."""
words = ["tongue"]
definition = "[+syll, length: long, +back, +rounded] z → [nasal: 1] ∅ / _ #"

[sporadic_thrinz_z]
time = 150
name = "SPORADIC: the accusative *þrinz has the analogical *-z"
description = """*-z replaced *-s in nominal endings (Ringe §3.2.4 (ii), PDF 136), and 'three' is an ordinary
i-stem with the accusative *þrinz (§4.3.6 (i), PDF 330). Whether monosyllables took part cannot be
recovered (§4.3.4 (i), PDF 317), so the change is word-scoped here."""
words = ["þrinz"]
definition = "s → z / n _ #"

# Geminates shorten after a long vowel late in Proto-Germanic (Kroonen §2.2.6, PDF 37–38): the *tt
# that Kluge's law gives *hwītta- is single in *hwītaz. The early geminate_shortening (-1900) comes
# before Kluge's law and cannot reach it.
[kroonen_late_geminate_shortening]
time = 150
name = "A geminate obstruent shortens after a long vowel"
description = "Kroonen §2.2.6, PDF 37–38 — *hwītta- > *hwītaz"
definition = "1=[-son, -syll] @1 → @1 ∅ / [+syll, length: long] _"

[lvl_nominative_z]
time = 150
name = "The nominative *-az is levelled across the thematic nouns"
description = """ANALOGICAL — Verner leaves oxytones with *-as (*þurnas); Germanic levels the *-az
of the barytone type (*wulfaz) onto them.

The vowel before it must be UNSTRESSED, because what is being levelled is a SUFFIX. Written
`/ [+syll] _ #` the rule reached every word-final *s there is, including the ones that are not a
nominative ending at all: *mū́s 'mouse' is a monosyllabic root noun whose *s belongs to the root,
and *kʷésyo > *hwes, *tósyo > *þas are pronouns. All three came out with a spurious *z. An
unstressed vowel before the *s is what identifies the ending — a thematic nominative never carries
the accent on its own suffix."""
# NOT after a consonant, though *tríns > *þrinz makes it tempting: *sehs, *fōts, *tanþs, *gans,
# *aiks, *wrōts, *nahts and *drōs all keep their *s in exactly that position. The *-z of *þrinz is
# the numeral's PLURAL ending, a different morpheme from the nominative singular this rule levels,
# and one levelling cannot be read off the other, so *þrinz has its own word-scoped rule
# (`sporadic_thrinz_z`).
definition = "s → z / [+syll, stress: none] _ #"

# A nasal is lost before */x/, nasalising the vowel and lengthening it: *wonkos > *wɑ̃ːxɑz.
#
# This is PROTO-GERMANIC and belongs here, before the 200 checkpoint — it is not the West
# Germanic nasal-spirant law (t=300) further down, which does the same thing before *f, *θ and
# *s. The two were one rule, targeting any voiceless fricative, and the gold says they are not:
# the only 200 form with a nasalised vowel before */x/ is *wɑ̃ːxɑz, and NOT ONE has a nasalised
# vowel before *f, *θ or *s — Proto-Germanic still says *ɸimɸ 'five', and only later West
# Germanic makes it *fīf. Same change, two different centuries; *x simply goes first.
# Dated 180: after `long_a_to_long_o` (160), not before it. The long *ɑ̃ː this rule makes is a LOW
# vowel, and run any earlier that rule rounds it to *ɔ̃ː — **wɔ̃ːxɑz for the attested *wɑ̃ːxɑz. The
# rounding cannot simply skip the nasals, because a nasal *ɑ̃ː rounding to *ɔ̃ː is exactly how the
# *-ǭ ending is derived. So the vowel must be lengthened after the rounding has already gone by.
[pgmc_nasal_loss_before_x]
time = 180
name = "A nasal is lost before */x/, nasalising and lengthening the vowel"
description = "*wonkos > *wɑ̃ːxɑz 'wough' — the Proto-Germanic half of the nasal-spirant law"
definition = [
    "[+syll] → [length: long, +nas] / _ [+cons, nasal: 1] x",
    "[+cons, nasal: 1] → ∅ / [+syll, length: long] _ x",
]

# ─────────────────────────────────────────────────────────────────────────────
# Proto-Germanic → Old English. Minkova, A Historical Phonology of English.
# ─────────────────────────────────────────────────────────────────────────────

# The PWGmc *ā from stressed *ē₁ (`wg_e1_to_a`, 250) fronts to *ǣ, or rounds to *ō before a nasal.
# First among the 404 rules: before the nasal-spirant law, whose lengthened *ā must round rather
# than front (*gans > gōs), and before `oe_diphthong_shift`, whose *ā from *ai must stay back
# (*stain > stān). The nasalised *ą̄ of *þanhtō is left for the nasal-spirant rounding.
[oe_long_a_fronting]
time = 404
name = "Stressed *ā fronts to *ǣ, or rounds to *ō before a nasal"
description = """Ringe & Taylor §5.1.2 (PDF 157–158, 164): in northern West Germanic the PWGmc *ā from *ē₁
rounded to *ō before a nasal (glōm, mōna, nōmon, spōn, sōna) and fronted elsewhere, to West Saxon
ǣ and Anglian ē (*sēdiz > sǣd, *dēdiz > dǣd). t = 404, after the Proto-West Germanic checkpoint
(403), whose forms still have *ā (*dādi, *sādi)."""
definition = [
    "[+syll, length: long, aperture: low, +back, stress: primary, rounded: none, nasal: none] → oː / _ [+cons, nasal: 1]",
    "[+syll, length: long, aperture: low, +back, stress: primary, rounded: none, nasal: none] → [+front, back: none, advancement: atr]",
]

# The Ingvaeonic nasal-spirant law: a nasal is lost before a voiceless fricative and the
# vowel lengthens to compensate — Gothic munþs vs OE mūþ 'mouth', Gothic uns vs OE ūs
# (Minkova §3.4, n. 8). Two rules, as in latin_to_french's ns-loss: lengthen, then delete,
# so the deletion can require the length it is compensating for.
[sporadic_ordinal_voiceless_suffix]
time = 404
name = "SPORADIC: the OE ordinals take the voiceless Verner alternant of the suffix"
description = """OE seofoþa, eahtoþa, nigoþa and tēoþa have þ where PGmc *sebundô, *ahtudô, *newundô and
*tehundô have the voiced *d, as OS sivondo and OHG zehanto do. Ringe & Taylor (PDF 181): OE tēoþa
"exhibits a voiceless Verner's Law alternant in the suffix". Cause: Old English generalized the
voiceless alternant *-unþ-, *-uþ- in these ordinals. Dated after the 403 checkpoint, whose West
Germanic forms have *d, and placed before the nasal-spirant law, which then drops the *n."""
words = ["seventh", "eighth", "ninth", "tehundô"]
definition = "d → θ / [+syll, stress: none] [+cons, nasal: 1]? _ [+syll] #"

[wg_nasal_spirant_lengthening]
time = 404
name = "Vowel lengthens before a nasal + voiceless fricative"
description = """Minkova §3.4 n.8 — the first half of the Ingvaeonic nasal-spirant law

t = 404, after the Proto-West Germanic checkpoint (403). The nasal-spirant law is a northern
West Germanic change, after PWGmc (Ringe & Taylor §5.1.1, PDF 155); Wiktionary's PWGmc still has
*gans, *munþ, *fimf. The three rules keep their order: they come first among the 404 rules in
the file.

Only a stressed vowel lengthens. Old English unstressed vowels are short, and the ordinal suffix
*-unþ- gives a short o (seofoþa, nigoþa), where lengthening gave **seofūþa."""
definition = "[+syll, stress: primary] → [length: long] / _ [+cons, nasal: 1] [-son, +cont, -voice]"

[wg_nasal_spirant_loss]
time = 404
name = "Nasal lost before a voiceless fricative"
description = """*gans > gōs, *tanþs > tōþ, *fimf > fīf — the compensating length is already in place

t = 404, after the Proto-West Germanic checkpoint (403). The nasal-spirant law is a northern
West Germanic change, after PWGmc (Ringe & Taylor §5.1.1, PDF 155); Wiktionary's PWGmc still has
*gans, *munþ, *fimf. The three rules keep their order: they come first among the 404 rules in
the file.

After an unstressed vowel the nasal goes too, with no lengthening: *-unþ- > OE -oþ- in the
ordinals, like the -aþ of the present plural < *-anþ."""
definition = [
    "[+cons, nasal: 1] → ∅ / [+syll, length: long] _ [-son, +cont, -voice]",
    "[+cons, nasal: 1] → ∅ / [+syll, stress: none] _ [-son, +cont, -voice]",
]

# West Germanic loses final *-z (PGmc *wulfaz > *wulfa), and the final short vowel then
# apocopates (*wulfa > OE wulf). The apocope needs an earlier vowel in the word, or it would
# eat the vowel of a monosyllable (*kū 'cow').
# The vowel the nasal-spirant law lengthened is also rounded when it is /a/: *gans > gōs,
# *tanþs > tōþ (Minkova §3.4). Only that vowel — the context is the fricative it lengthened
# before, which is still standing — so other long /aː/ is untouched.
[wg_nasal_spirant_rounding]
time = 404
name = "The lengthened a rounds to oː before the fricative"
description = """*gans > gaːs > gōs. The vowel is the BACK *ɑː that nasal loss lengthens; a FRONT
long low vowel (swǣs, from *ē) stands before a voiceless fricative too but must NOT round —
restricting to +back keeps swēsaz off it, which is why no sporadic patch is needed there.
(*fimf > fīf and *uns > ūs keep their vowel, being high already.)

t = 404, after the Proto-West Germanic checkpoint (403). The nasal-spirant law is a northern
West Germanic change, after PWGmc (Ringe & Taylor §5.1.1, PDF 155); Wiktionary's PWGmc still has
*gans, *munþ, *fimf. The three rules keep their order: they come first among the 404 rules in
the file."""
definition = "[+syll, length: long, aperture: low, +back, rounded: none] → oː / _ [-son, +cont, -voice]"

# West Germanic a-umlaut: a short high vowel lowers before a non-high vowel in the next
# syllable — PrG *gulþam > OE gold, *kurną > corn (Minkova §3.4 n.9). It must run before the
# apocope below, which destroys the conditioning vowel.
[wg_w_velarization]
time = 350
name = "West Germanic: *w between high vowels becomes *ɣ"
description = """Kroonen s.v. *ju(w)unþi- (PDF 316): "The West Germanic material points to a form *juwunþi-
with regular velarization of the *w (cf. *sū- 'sow' and *newun '9') between two high vowels (one of
them being rounded)". So PGmc *juwunþiz gives PWGmc *jugunþi (Ringe & Taylor PDF 156). Dated
between the 200 and 403 checkpoints. In this set only youth reaches it: midge needs Dybo's law,
which the cascade does not adopt, and nine stays word-scoped (sporadic_nine_nigun)."""
definition = [
    "w → ɣ / [+syll, aperture: high, +rounded] _ [+syll, aperture: high]",
    "w → ɣ / [+syll, aperture: high] _ [+syll, aperture: high, +rounded]",
]

[sporadic_moth_levelling]
time = 403
name = "SPORADIC: *maþō takes the root of the oblique *mutt- and turns feminine: *moþþā"
description = """Wiktionary's PWGmc *moþþā (> OE moþþe) is "Feminized and leveled from *maþô ~ *muttaz".
Kroonen gives the same paradigm, nom. *maþō, gen. *muttaz < *mót-ōn, *mt-n-ós, and a zero-grade
form for 'moth' beside it (s.v. *maþan-, PDF 398). Hoad calls OE moþþe "obscurely rel." to MLG,
MDu. motte. Word-scoped. Cause: levelling between the nominative and the oblique stem, with a shift
into the feminine n-stems. The root already has the *o that *moþþā shows. Dated 403, after the
West Germanic ending rules at 402."""
words = ["moth"]
definition = ["ɑ → o / _ θ", "θ → θ θ / o _", "ɔː → ɑː / _ #"]

[sporadic_setl_tl]
time = 465
name = "SPORADIC: OE *seþl becomes setl"
description = """PWGmc *seþl 'seat' gives WS setl, North. sedl ~ seðel (Ringe & Taylor PDF 344). Ringe & Taylor
note the usual view that *þl and *þm became tl and tm in West Saxon, but fæþm never shows a t, both
sedl and setl occur in Anglian texts, and "we cannot recover in any detail what happened to these
words" (PDF 356). staþol keeps its þ as well. Word-scoped. Cause: not known. Dated before
oe_parasite_vowel (466). botl 'dwelling' had the same change, but bottle's chain misses earlier."""
words = ["seþlą"]
definition = "θ → t / _ l #"

[oe_tl_metathesis]
time = 1000
name = "A word-final tl becomes ld"
description = """Ringe & Taylor PDF 356: "Metathesis also affected the cluster tl (in word-final position
only?); for instance, botl 'dwelling' > bold, setl 'seat' > seld". Dated after the Old English
checkpoint, which has setl, and before ME seld."""
definition = "t l → l d / _ #"

[sporadic_four_prominence]
time = 990
name = "SPORADIC: OE fēower > ME four, the prominence moves onto the second element"
description = """Minkova PDF 177: "A following /-w/ could also result in shift of the prominence onto the
second element, thus OE fēower > ME four(e) 'four', OE trēowþ > ME trowþe 'troth'". The shift is
lexical: OE cnēow gives ME knee with no shift. The unstressed vowel between the w and the r goes as
the word becomes ME four. Word-scoped. Cause: the prominence shift before w that Minkova
describes. Dated before me_diphthong_smoothing (1000), which would turn the ēo into ē."""
words = ["four"]
definition = ["e oː → ɔː ∅ / _ w", "e → ∅ / w _ r #"]

[sporadic_cow_oblique]
time = 405
name = "SPORADIC: OE cū takes the oblique stem *kū-"
description = """Kroonen s.v. *kō- ~ *kū- (PDF 339): the paradigm was nom. *kōz, obl. *kū-, and OE cū, ON kýr
continue the oblique variant, while OS kō, OHG kuo continue the nominative. Word-scoped. Cause:
the levelling of the oblique stem into the nominative. After the Proto-West Germanic checkpoint,
whose target *kō still has the nominative vowel."""
words = ["cow"]
definition = "oː → uː"

[sporadic_nine_nigun]
time = 350
name = "SPORADIC: northern West Germanic *nigun 'nine'"
description = """Ringe & Taylor §5.3 (PDF 181): most Germanic languages have the expected *ne(w)un (Goth.
niun, OHG niun), "but in northern WGmc we find forms with medial *-g-: northern WGmc *nigun 'nine'
> OE nigon, OF niugen, OS nigun ~ nigon", and "no convincing explanation for the shape of 'nine'
has been advanced". So the change is word-scoped. Finding F9 of the Ringe & Taylor review. The
ordinal has the same *g: OE nigoþa, OS nigudo (Hoad s.v. nine)."""
words = ["nine", "ninth"]
definition = "e w → i ɣ"

[wg_a_umlaut]
time = 350
name = "a-umlaut: short u, i lower before a non-high vowel"
description = "Minkova §3.4 n.9. Held before a lateral — *fullaz > full, *wulfaz > wulf keep their u, while *kurną > corn and *þurnaz > þorn lower across r. (OE gold < *gulþam is a known counterexample to the l-blocking; the change is irregular.)"
# The *u half ONLY. The lowering of *i is the word-scoped `pgmc_i_lowering` (t=300); repeating
# it here, with no restriction on the intervening consonants, lowered the /i/ of words Old English
# keeps it in — OE fisc, cwic, niġon against our **fesc, **cwec, **neġon.
#
# And the *i-lowering is doubtful even in principle. Kroonen reconstructs BOTH *fiska- (< *pisk-o-,
# cf. Lat. piscis) and *nista- 'nest' (< *ni-zd-o-) with an /i/ — his 'nest' is *nista-, not the
# *nestą our Wiktionary gold gives — so there may be no regular a-umlaut of *i in Germanic at all.
# Ringe's bibliography cites Lloyd, "Is there an a-umlaut of i in Germanic?", on exactly this.
# The *u half is not in doubt (*kurną > corn, *þurnaz > þorn), so that is what this rule keeps.
# Held before a NASAL as well — but only one standing IMMEDIATELY after the vowel, and the gold
# draws that line itself:
#
#     *hundą > OE hund, *mundō > mund, *gumô > guma, *sundraz > sundor   — nasal next: HELD
#     *hurną > OE horn, *kurną > corn, *þurnaz > þorn                    — an *r intervenes: LOWERS
#
# Block on a nasal ANYWHERE in the cluster and horn, corn and thorn go with it; block on none at
# all and hund, mund, guma and sundor come out **hond, **mond, **goma, **sondor. The first
# consonant is the one that decides.
# The LATERAL is the delicate one, and the gold splits it cleanly by what FOLLOWS the *l:
#
#     l + dental/velar : *hulþaz > hold, *wulkną > wolcen, *fulką > folc, *muldô > molde   LOWERS
#     l + l (geminate) : *fullaz > full, *wullō > wull                                     HOLDS
#     l + LABIAL       : *wulfaz > wulf                                                    HOLDS
#
# So a blanket "held before a lateral" (what stood here) costs hold, wolcen, folc and molde, while
# no lateral condition at all costs full, wull and wulf. Two clauses, and the second says exactly
# what the data says: an *l lowers unless a lateral or a labial follows it.
#
# STRESSED only (`stress: !none`, so a compound's secondary stress counts too). a-umlaut is a
# stressed-vowel change, and every form the notes above argue from — horn, corn, thorn, hold,
# wolcen, folc, molde, and the held hund, mund, guma, sundor, full, wull, wulf — has the *u in the
# stressed first syllable, so the restriction costs none of them. What it buys is the MEDIAL *u of
# an unstressed syllable, which has its own reduction fate and does not lower here: *widuwō > OE
# widuwe, which was coming out **widowe.
definition = [
    "[+syll, aperture: high, length: short, +back, stress: !none] → [aperture: mid] / _ [-syll, nasal: none, lateral: none] [-syll]* [+syll, aperture: !high]",
    "[+syll, aperture: high, length: short, +back, stress: !none] → [aperture: mid] / _ [-syll, +lateral] [-syll, lateral: none, labial: none] [-syll]* [+syll, aperture: !high]",
]

[sporadic_kind_zero_grade]
time = 395
name = "SPORADIC (levelling): PWGmc *kundi takes the zero grade of the oblique stem"
description = """OE (ġe)cynd and OHG gikunt continue PWGmc *kundi (Wiktionary, English kind), the zero grade of
the oblique stem *ǵn̥h₁tí- (Wiktionary s.v. *kinþiz). Kroonen's *kindi- (ON kind; PDF 328) keeps
the full grade of the nominative. Cause: levelling of the oblique stem in West Germanic. Dated 395,
before palatalisation (410), which then leaves the *k before the back *u alone, and before
i-mutation (420), which makes the *y of cynd."""
words = ["kind"]
definition = "[+syll, aperture: high, +front, length: short, stress: primary] → [+back, front: none, +rounded, +labial]"

[sporadic_dross_h_loss]
time = 401
name = "SPORADIC: West Germanic *drōs- 'dregs' has lost its *h"
description = """PGmc *drōhs (PIE *dʰrā́ks) has an *h that no West Germanic form shows: OE drōs and gen. pl.
drosna, MDu. droes(e), OHG truosana 'dregs' (Hoad s.v. dross). Ringe & Taylor find that *h was lost,
variably, before two consonants (PDF 172–173: nēosan, North. sesta, þīsl), which the *-sn- of
drosna and truosana provides. Cause, probably: that loss, spread to the whole word. Word-scoped,
because *h survives before a single *s (six, fox)."""
words = ["dross"]
definition = "x → ∅ / _ s"

[sporadic_fourth_dental_loss]
time = 300
name = "SPORADIC: West Germanic *feurþō 'fourth' loses its first dental"
description = """PGmc *fedurþô gives PWGmc *feurþō and OE fēorþa (Wiktionary). Kroonen (s.v. *fedwōr, PDF
173): "The first dental may have been dissimilated in the ordinal *fewurþ/dan-", against the *þ of
the suffix, as in 'seventh'. Cause: dissimilation. Kroonen's *fewurþ- has a *w for the dental,
and *ewur- gives the diphthong *eu of PWGmc *feurþō, which the Old English diphthong rules (404)
make ēo. By its date the *ð has hardened to *d (260)."""
words = ["fourth"]
definition = "d u → w ∅ / e _ r"

[sporadic_lithe_ja_stem]
time = 395
name = "SPORADIC: *linþaz 'gentle' becomes the ja-stem PWGmc *linþī"
description = """Ringe & Taylor give PWGmc *linþī 'gentle' (OHG lind(i)) > *lį̄þī > OE līþe (PDF 156), a ja-stem,
where Proto-Germanic has the a-stem *linþaz. Cause: transfer of the adjective to the ja-stems, as
OHG lindi beside lind shows. The *-ī is the secondary long vowel that the shortening of final *-ī
(399) does not reach, and OE līþe has the -e of the ja-stems."""
words = ["lithe"]
definition = "ɑ → iː / _ z #"

[sporadic_thursuz_verner_z]
time = 390
name = "SPORADIC (levelling): West Germanic *þurzī takes the Verner *z"
description = """Ringe & Taylor: "PGmc *þursu- ~ *þurzu- 'dry, dried up' (Goth. þaúrsus, ON þurr) >! PWGmc
*þurzī > OE þyrre, OHG durri" (PDF 98). The paradigm alternated between *s and the Verner *z, and
West Germanic generalized the *z, which rhotacism (405) makes the *rr of þyrre. Cause: levelling of
the Verner alternant. Before the ja-stem transfer (395) and the 403 checkpoint, whose *þurʀī has it."""
words = ["þursuz"]
definition = "s → z / r _"

[sporadic_agitho_on_stem]
time = 395
name = "SPORADIC: *agiþō 'harrow' is the West Germanic ōn-stem *agiþā"
description = """Ringe & Taylor: "PWGmc *agiþā 'rake, harrow' (OHG egida) > *æġiþǣ > OE *eġiþǣ > eġeþe" (PDF 252),
where PGmc has the ō-stem *agiþō. Cause: transfer to the ōn-stems, whose West Germanic nominative
is *-ā (OE -e). Before the ō-stem *-ō becomes *-u (401)."""
words = ["agiþō"]
definition = "ɔː → ɑː / [-syll] _ #"

[sporadic_riff_i]
time = 300
name = "SPORADIC: OE hrif keeps the *i of the variant *hrif"
description = """Ringe & Taylor give "PWGmc *hri/ef 'womb' > OE hrif, OHG ref" (PDF 50), among the words with
*i beside *e for which, they argue, there was no regular lowering of *i (§2.3.1). OE hrif continues
the variant with *i. Cause: the variant, which pgmc_i_lowering does not produce."""
words = ["riff"]
definition = "e → i / r _"

[sporadic_wg_adjective_ja_stem]
time = 395
name = "SPORADIC: i- and u-stem adjectives become ja-stems in West Germanic"
description = """Ringe & Taylor (PDF 36): in all NWGmc languages the strong adjectives are inflected as a-stems,
and "what eventually happened in WGmc is clear": the masculine and neuter "paradigms in *-(i)ja-
were usually backformed to the original feminines of i- and u-stems". So *grōniz, *swōtuz, *þunnuz
take the nominative of *-ijaz, PWGmc *grōnī, *swōtī, *þunnī. That *-ī is the secondary long vowel
which the shortening of final *-ī (399) does not reach (PDF 30–31). The transfer is morphological,
and only "usually" so, so the rule names the adjectives whose OE forms show it: grēne, swēte, þynne
and þyrre have the i-umlaut and the -e of the ja-stems, and so have myrġe 'merry' (*murɣuz) and
Anglian ēþe 'easy' (*auþuz, see sporadic_eath_smoothing). OE ange
'narrow' has no umlaut and þicce an unpalatalised [kk], so anguz and thick are not listed."""
words = ["green", "hrainiz", "sweet", "thin", "þursuz", "merry", "eath"]
definition = "[+syll, aperture: high, length: short, stress: none] → iː / _ z #"

[wg_final_z_loss]
time = 400
name = "Final -z and -s are lost in West Germanic"
description = """PGmc *wulfaz > *wulfa.

The VOICELESS *s goes the same way, and it has to be said separately because `lvl_nominative_z`
never reached it: that rule levels the *-az of the thematic nouns, whose vowel is unstressed, and
a ROOT noun's *s sits straight after a stressed vowel or a consonant — *fōts, *tanþs, *aiks,
*nahts, *wrōts. They keep the *s at Proto-Germanic, exactly as attested, and lose it here:
OE fōt, tōþ, āc, niht, wyrt.

Only after an OBSTRUENT, and that is not arbitrary. Every word that loses the *s has it standing
after one — *fōts, *tanþs, *aiks, *nahts, *wrōts — because there the *s is the nominative ENDING
bolted onto a consonant-final root. *gans has its *s after a NASAL, and there the *s belongs to the
root itself (*ǵʰh₂éns): OE keeps it, gōs. The obstruent is the phonological correlate of the
morphological fact, and without the condition goose comes out **gō.

Dated 400, which also matters: it is BEFORE the apocope, so a word whose *s is not yet final keeps
it. *hūsą still has its ending here, so its *s is medial and survives — OE hūs, not **hū.

The *s stays after a vowel and *h. Inferred from the lexicon (DECISIONS.md, 2026-10-07): in *sehs
'six' and *drōhs 'dross' the *hs is a cluster from PIE *ks, and OE keeps the *s (six, drōs), where
*nahts and *sulhs, with a consonant before the *h, lose it (niht, sulh)."""
definition = [
    "z → ∅ / _ #",
    "s → ∅ / [-son] _ # // [+syll] x _ #",
]

# Rhotacism: the *z left over becomes /r/ (Minkova §3.4.1 — "original /z/, an allophone of /s/
# between vowels, became /r/ … the OE form lār 'lore' corresponds to PrG *laiz- 'to teach'").
# Old English has no /z/ phoneme at all, so every surviving one had to go somewhere, and *bewzą
# was still coming out **beowz against an attested *beoːr.
#
# Ordered AFTER the final *-z loss above, and that is the whole difficulty: run it first and the
# nominative *-az of *anþeraz rhotacises to **-ar instead of dropping, wrecking every a-stem in
# the lexicon. The ending must be gone before the rule is allowed to look.
[wg_rhotacism]
time = 405
name = "Rhotacism: *z > *r"
description = "PrG *laiz- > OE lār; *bewzą > *beoːr 'beer'; *mazgą > *mæɑrx 'marrow'"
definition = "z → r"

# Final *-a and *-i are lost outright (*wulfa > wulf, *wara > wær). Final *-u is not: it
# survives after a light syllable (*sunu > sunu, *medu > medu) and goes only after a heavy one
# — Old English high-vowel deletion. A heavy syllable is one with a long vowel or a closing
# consonant, hence the two contexts.
# The Proto-Germanic feminine ō-stem ending *-ō becomes *-u, and then the light/heavy split the
# language already has takes over: `oe_high_vowel_deletion` (460) keeps it after a light syllable
# and deletes it after a heavy one. The gold shows exactly that — *skɑrɔː > ʃɑru and *snuzɔː >
# snoru (light), against *wullɔː > wull, *mizdɔː > meːd, *θewðɔː > θeoːd (heavy). Nothing else
# was carrying the ending across, so it survived to Old English as a full *-ɔː.
[oe_final_long_o_to_u]
time = 401
name = "The ō-stem ending *-ō becomes *-u"
description = """*skɑrɔː > ʃɑru, *wullɔː > wull — the high-vowel deletion then splits them

t = 401, before the Proto-West Germanic checkpoint (403). Ringe & Taylor §2.1.1 (PDF 30): "word-final
bimoric non-nasalized long *-ō became short *-u in unstressed syllables in PNWGmc", well before
PWGmc. Dated 440, it left the 403 column with *-ō for the *-u of *skalju, *haƀanu, *saɣu."""
definition = "[+syll, aperture: mid, +back, +rounded, length: long, nasal: none] → u / [+syll] []* _ #"

[wg_final_apocope]
time = 450
name = "Final short a, i apocopate in a polysyllable"
description = "*wulfa > wulf, *wara > wær. Rounded -u is spared here and handled next"
# `aperture: !high` — the final short HIGH vowels (*i, *u) are not this rule's business. Ringe &
# Taylor §6.8.1: "short *i and *u were lost word-finally after a HEAVY syllable", which is a
# weight-sensitive change and belongs to `oe_high_vowel_deletion` below. Deleting them here, in any
# polysyllable, took the *-i of *stædi with it — where Ringe has *stædi > OE stedi > stede.
definition = "[+syll, length: short, rounded: none, aperture: !high] → ∅ / [+syll] []* _ #"

# Ringe & Taylor, *The Development of Old English* §3.1.3: "In PWGmc labiovelars were resolved
# into sequences of velar + *w" — Proto-Germanic's single *kʷ and *xʷ become the CLUSTERS the
# gold's Old English column writes (*kʷikʷɑz > cwic ˈkwik, *xʷɑlɑz > hwæl ˈxwæl). PGmc is
# transcribed with the labiovelar and OE with the cluster, so this is a change to derive, not a
# convention to normalise.
#
# The word-final ones DELABIALISE instead, and Ringe is explicit that this comes FIRST:
# "originally word-final labiovelars simply lost their labialization before the resolution of
# labiovelars into velar + *w sequences". Hence two rules, the loss ordered before the split.
#
# Both at 401, before the Proto-West Germanic checkpoint (403) — the resolution is a PWGmc change —
# and before the apocope (402). "Originally" word-final means final before the apocope, so the
# second *kʷ of *kʷikʷɑz is NOT one of them: it resolves to *kw, and with the apocope and the
# vocalisation of final *w it gives Ringe & Taylor's PWGmc *kwiku (PDF 63). The velar then stands
# before a back vowel, where OE palatalisation (410) leaves it alone; OE cwic loses the *-u by
# levelling (`sporadic_final_u_levelling`). These rules used to sit at 470–480, after the apocope,
# which delabialised that second *kʷ as if it were originally final.
[oe_final_labiovelar_delabialisation]
time = 401
name = "A word-final labiovelar loses its labialisation"
description = "Ringe & Taylor §3.1.3 — *kʷikʷ > *kʷik, before the resolution below"
definition = [
    "kʷ → k / _ #",
    "xʷ → x / _ #",
]

[oe_labiovelar_resolution]
time = 401
name = "Labiovelars resolve into velar + w"
description = "Ringe & Taylor §3.1.3 — PWGmc *kʷ, *xʷ > *kw, *xw (cwic, hwæl)"
definition = [
    "kʷ → k w",
    "xʷ → x w",
]

# The n-stem nominative *-ô becomes Old English *-a: *uxsɔːː > oxa, *neɸɔːː > nefa, *ɣumɔːː >
# guma, and every ordinal (*feðurθɔːː > feorþa). By now it is the PWGmc *-ō of `wg_final_long_o`
# (402), raised to oː by `wg_long_mid_raising` (404). The ō-stem *-ō has long since become *-u
# (401), so no other final oː after a consonant is left for this rule to take.
#
# And it must run AFTER the apocope (450), which deletes a final short unrounded vowel in a
# polysyllable and would take this *-a straight back off again. That ordering is why the ending
# arrives as an overlong and leaves as a short *-a rather than being made short any earlier.
[oe_final_overlong_to_a]
time = 455
name = "The n-stem ending *-ô becomes *-a"
description = "*uxsɔːː > oxa, *neɸɔːː > nefa, *feðurθɔːː > feorþa, through PWGmc *-ō"
definition = "[+syll, length: long, +back, +rounded, aperture: mid] → ɑ / [+syll] []* [-syll] _ #"

# The weak (ōn-stem) feminine *-ǭ becomes Old English *-e: *xɔːrɔ̃ː > hōre, *wiðuwɔ̃ː > widuwe,
# *kʷenɔ̃ː > cwene. By now it is the PWGmc *-ā of `wg_final_long_o` (402); Ringe & Taylor give
# PWGmc *tungā, *hertā > OE tunge, heorte (§3.1.4, PDF 74). After the apocope (450), like the *-a
# above, or it would be deleted again.
[oe_final_nasal_o_to_e]
time = 456
name = "The weak ōn-stem ending *-ǭ becomes *-e"
description = "*xɔːrɔ̃ː > hōre, *wiðuwɔ̃ː > widuwe, *kʷenɔ̃ː > cwene, through PWGmc *-ā"
definition = "[+syll, length: long, aperture: low, +back] → e / [+syll] []* [-syll] _ #"

# After palatalisation, *w is lost after a non-initial velar: *ahwō > *eahu, *sehwan > sēon
# (Ringe & Taylor §6.4.2, PDF 229–230).
[oe_w_loss_after_velar]
time = 411
name = "*w is lost after a non-initial velar"
description = "Ringe & Taylor §6.4.2, PDF 229–230 — *ahwō > *eahu, *sehwan > sēon"
definition = "w → ∅ / [+syll] [+cons, +back, -son] _"

[oe_high_vowel_deletion]
time = 460
name = "Final -u is deleted after a heavy syllable, kept after a light one"
description = "*wulfu-type > wulf, but *sunu, *medu keep it — the OE light/heavy split"
# Ringe & Taylor §6.8.1: "short *i AND *u were lost word-finally after a heavy syllable." It was
# written for *u alone (`rounded: 1`), so every final *-i escaped it and fell to the general
# apocope instead, which is weight-blind — *stædi lost its ending outright where OE has stede.
definition = [
    "[+syll, length: short, aperture: high] → ∅ / [+syll, length: long] [-syll]* _ #",
    "[+syll, length: short, aperture: high] → ∅ / [+syll] [-syll] [-syll]+ _ #",
    # A diphthong is heavy only when long: a SHORT broken diphthong (fealu, eahu) is a light syllable
    # and keeps its *-u (Ringe & Taylor §6.8.1, PDF 303).
    "[+syll, length: short, aperture: high] → ∅ / [+syll] [+syll, length: long] [-syll]* _ #",
]

# Anglo-Frisian brightening: Germanic /a/ fronts to /æ/, but not before a nasal, where it
# stays back (Minkova p. 7749: "the fronting of /a/ was prevented by a following nasal").
# Stated on FEATURES, for the same reason as the diphthong shift above: written `ɑ → æ` the rule
# matched the LETTER ɑ, and most of the /ɑ/ in the lexicon is not the letter — it is a feature
# bundle `non_high_back_merger` made out of PIE *o. So the brightening fired on some words and
# passed silently over *bɑraz, *xɑslaz, *kɑldaz, *ɣɑrdaz, which look identical on the page. It
# was the largest single error class left at Old English, and it was never a phonological
# question at all: the rule was simply looking for the wrong kind of thing.
#
# SHORT only. The long ɑː that `oe_diphthong_shift` has just made out of *ai must not be fronted
# — that is Minkova's whole point in ordering the two (stān, not **stæn).
# The thematic *-a (what is left of *-az once `wg_final_z_loss` has taken the *z) goes EARLY —
# before palatalisation — while the *-i of an i-stem must survive to trigger i-mutation at 420 and
# only apocopates later (`wg_final_apocope`, 450). One rule cannot do both, and running them
# together at 450 kept *ainaga's *g company until long after palatalisation had looked at it: the
# *g was intervocalic before a BACK vowel, which correctly blocks, so ǣniġ came out **ǣnag.
# Lose the *-a first and the *g is word-final after a front vowel, which is exactly Ringe &
# Taylor's environment (4) — the clause added to `oe_palatalisation` below.
[wg_final_a_apocope]
time = 402
name = "The thematic final *-a apocopates"
description = "*ɑjnɑɣɑ > *ɑjnɑɣ — early, so the *ɣ is word-final when palatalisation looks"
definition = "[+syll, length: short, +back, rounded: none] → ∅ / [+syll] []* _ #"

# The two word-final long ō-vowels that survive into West Germanic. The ORAL bimoric *-ō has already
# become *-u (401), so the bimoric vowel left at the end of a word is the NASAL *-ǭ of the ōn-stems.
# After a consonant only: the *ēo of cnēo is written e + oː and must not count as an ending.
[wg_final_long_o]
time = 402
name = "Final trimoric *-ô becomes *-ō, final bimoric *-ǭ becomes *-ā"
description = """Ringe & Taylor §3.1.4 (PDF 73–74): word-finally, "surviving bimoric long ō-vowels became
PWGmc *ā, while trimoric long ō̄-vowels became PWGmc *ō", both mergers: *tungǭ > *tungā (OE tunge),
*gebō̄z > *gebō (OE ġiefa), and the n-stem *-ô of *uxsô, *fimftô > *-ō (OE oxa, fīfta).

t = 402, before the Proto-West Germanic checkpoint (403), whose forms have *-ō and *-ā here."""
definition = [
    "[+syll, length: overlong, +rounded] → [length: long] / [+syll] []* [-syll] _ #",
    "[+syll, nasal, length: long] → ɑː / [+syll] []* [-syll] _ #",
]

[sporadic_neuter_nstem_a]
time = 402
name = "SPORADIC: the neuter n-stems take the PWGmc *-ā of the feminines"
description = """Ringe & Taylor: "PGmc *ausōn- ~ *auzōn- 'ear' ... >! PWGmc *auzā > OE ēare" (PDF 98), and "PWGmc
nom. sg. *tungā 'tongue', *augā 'eye' ... > OE tunge, ēage"; the PGmc endings "are not securely
reconstructable because they have been remodelled in every daughter" (PDF 168). So the neuter
n-stems share the feminine *-ā, which OE gives as -e, where wg_final_long_o makes the masculine
*-ō. Cause: remodelling of the neuter ending. Word-scoped because the engine does not know gender;
the list names the neuter nouns (ear, and heart, whose PGmc *hertô is neuter)."""
words = ["ausô", "heart"]
definition = "ɔː → ɑː / [+syll] []* [-syll] _ #"

# A final short *-i that survives the weight test above lowers to *-e — Ringe & Taylor's own
# chain is *stadiz > *stædi > OE stedi > *stede*. This is what puts the final vowel on mere, here,
# stede and the rest of the light-stemmed i-stems.
[oe_final_i_to_e]
time = 470
name = "A surviving final *-i lowers to *-e"
description = "R&T §6.6.2 — *stædi > stedi > stede; *mari > mere"
definition = "[+syll, length: short, aperture: high, +front] → e / [+syll] []* _ #"

[oe_a_fronting]
time = 406
name = "Anglo-Frisian brightening: a > æ, except before a nasal"
description = "Minkova §3.4 — blocked before a nasal (*and stays and, not *ænd)"
definition = "[+syll, -cons, aperture: low, +back, length: short] → [+front, back: none, advancement: atr] / _ [nasal: none]"

[oe_a_restoration]
time = 407
name = "A-restoration: the brightened æ goes back to a before a BACK vowel"
description = """Minkova §3.4. Anglo-Frisian brightening fronts *a to *æ, but it is undone where a
BACK vowel follows in the next syllable — the fronting never survives in front of one:

    *sagu   > OE sagu  (not **sægu)      *talu   > OE talu
    *skadu  > OE sceadu                  *laguz  > OE lagu

EXACTLY ONE consonant may stand between, and that is what keeps restoration and breaking apart —
they are in complementary environments. Breaking wants *r/*l/*h plus ANOTHER consonant; restoration
wants a single one:

    *sagu    æ-g-u     one consonant   -> restored:  OE sagu
    *harduz  æ-r-d-u   a CLUSTER       -> broken:    OE heard

Written `[-syll]*` — any number of consonants — the rule reaches *harduz too and gives **hard,
taking death, cold, dream, arm and a dozen more with it. Dated 407: after `oe_a_fronting` (406),
which makes the *æ, and before `oe_breaking` (408)."""
definition = "[+syll, -cons, aperture: low, +front, length: short] → [+back, front: none, advancement: rtr] / _ [-syll] [+syll, +back]"

[sporadic_kinship_or]
time = 404
name = "SPORADIC: brother, mother, daughter, sister take -or from the genitive"
description = """Ringe & Taylor (PDF 396–397): "PWGmc nom. sg. *-er and acc. sg. *-ar should both have become
-ær > -er in OE"; fæder keeps it. "But in the lexemes with back vowels in their initial syllables
the vowel of the suffixal syllable has generally been replaced by u or its later reflex": early WS
mōdor ~ -ur, brōðor ~ -ur, dohtor, sweostor. They explain it as levelling from the genitive -ur
(< PGmc *-urz). So it is word-scoped. Dated 404, so that the back *o is in place for
oe_a_restoration (407)."""
words = ["brother", "mōdēr", "daughter", "sister"]
definition = "[+syll, aperture: mid, +front, length: short, stress: none] → [aperture: mid, +back, front: none, +rounded, +labial, advancement: atr] / _ r #"

[oe_unstressed_ae_to_e]
time = 410
name = "Unstressed */æ/ > */e/"
description = """The brightened *æ does not survive unstressed. Ringe §5.3.2 (iii), arguing that
Proto-Germanic had *a before *r and not *e, notes in passing exactly what happens to it afterwards:

  "...that is precisely the area in which PGmc *a was fronted (except before nasals) and typically
   appears as e when unstressed."

So *anþaraz > (brightening) *anþæraz > OE ōþer, with the *æ of an unstressed syllable levelled to
*e. Dated immediately after `oe_a_fronting`, which is what creates the *æ for it to lower."""
definition = "[+syll, -cons, aperture: low, +front, length: short, stress: none] → [aperture: mid]"

# West Germanic hardens the Proto-Germanic bilabial fricative to a labiodental: *fōts > fōt,
# *fuhsaz > fox, *fullaz > full (Minkova §4.1 — OE has /f/, not /ɸ/).
[pgmc_unstressed_or_to_ar]
time = 245
name = "Unstressed *-ōr becomes *-ar"
description = """Ringe & Taylor §3.1.4 (PDF 73–75): a bimoric *ō before a final *r became *ā and then
shortened, so *watōr > *watar > OE wæter and *fedwōr > *fewwār > *feuwar > fēower. This is finding F7
of the Ringe & Taylor review. It replaces the word-scoped rule that gave water its OE vowels."""
definition = "[+syll, length: long, +back, +rounded, stress: none] → ɑ / _ r #"

[pwgmc_final_r_shortening]
time = 250
name = "An unstressed long vowel shortens before final *-r"
description = """Ringe & Taylor §3.1.4 (PDF 75): "At some point after the unrounding of bimoric *ō, vowels were
shortened before word-final *-r in unaccented syllables"; the nom. sg. of the r-stem kinship terms
has short vowels in OHG, and PGmc *fadēr > PWGmc *fader > OE fæder. The short vowel is the mid
[e] of PWGmc *fader, not open [ɛ]."""
definition = "[+syll, length: long, stress: none] → [length: short, advancement: atr] / _ r #"

[pgmc_dw_to_ww]
time = 255
name = "*dw becomes *ww"
description = """Ringe & Taylor §3.1.1 (PDF 56): *fedwōr 'four' > *fewwār; the voiced dental fricative
assimilates to a following *w. Finding F7 of the Ringe & Taylor review."""
definition = "[-son, +voice, +cont, +anterior] → w / [+syll] _ w"

[wg_f_hardening]
time = 250
name = "ɸ becomes f"
definition = "ɸ → f"


# I-Mutation (Minkova §6.3): a back vowel fronts when the next syllable holds /i/ or /j/ —
# *mahtiz > miht, *kinþiz > cynd, the change behind FOOT-FEET and FULL-FILL. It has to run
# before the apocope above, which is what destroys the conditioning /i/.
[oe_i_mutation]
time = 420
name = "I-Mutation: a back vowel fronts before i or j in the next syllable"
description = "Minkova §6.3 — FOOT-FEET, FULL-FILL, SELL-SALE"
# The /j/ must be in the NEXT syllable, so the span before it cannot be empty — written
# `[-syll]*` the wildcard matched nothing at all, and the OFFGLIDE of the vowel's own diphthong
# triggered the mutation. *hailaz has no /i/ anywhere in its ending and must not front: it is OE
# hāl, not **hæl. Written `[-syll][-syll]*` a real consonant has to intervene, which is what
# "next syllable" means, and *hagjō (OE hecg) still mutates across its /ɣ/ exactly as before.
# Ringe & Taylor §6.6.2, "Raising of *æ": "In addition to the back vowels treated above, one
# FRONT vowel was affected by i-umlaut: low front *æ was raised to e. There are fifty-odd examples
# of raising by *i, *ī, or *j in the following syllable." Their own example is one of ours —
# PGmc *stadiz > *stædi > OE stedi > stede — and it is what gives mere, heċġ and here their /e/.
# The two clauses above only front a BACK vowel; æ is already front, so nothing reached it.
# The raising is of the SHORT *æ. Ringe & Taylor's fifty-odd examples are all short, and the long
# ǣ does not take part: OE dǣd, sǣd, hǣs (< *dēdiz, *sēdiz, *haisiz) keep it, and an unrestricted
# clause raised all three to **dēd, **sēd, **hēs.
# FRONT IS NOT ENOUGH — the result is ADVANCED as well, exactly as oe_a_fronting already says. The
# front vowels come in pairs on this axis (æ low front atr vs a low front, e mid front atr vs ɛ
# mid front rtr), and a rule that moves only the lingual node lands on the wrong member of each:
# *haisiz came out **hās for hǣs, and *banjō **benn with an ɛ for the e of benn, stede, here, mere.
definition = [
    "[+syll, +back] → [+front, back: none, advancement: atr] / _ [-syll]* [+syll, aperture: high, +front]",
    "[+syll, +back] → [+front, back: none, advancement: atr] / _ [-syll][-syll]* j",
    "[+syll, aperture: low, +front, length: short] → [aperture: mid, advancement: atr] / _ [-syll]* [+syll, aperture: high, +front]",
    "[+syll, aperture: low, +front, length: short] → [aperture: mid, advancement: atr] / _ [-syll][-syll]* j",
]

# West Germanic hardens the voiced velar fricative to a stop: *trugaz > trog, *jungaz > jung.
[wg_g_hardening]
time = 405
name = "ɣ becomes g"
definition = "ɣ → g"

# The velar fricative becomes a stop before /s/: PGmc *fuhsaz > OE fox /foks/.
[oe_x_before_s]
time = 440
name = "x becomes k before s"
definition = "x → k / _ s"

[sporadic_fourth_f]
time = -950
name = "SPORADIC: *fedurþô takes the *f of the cardinal *fedwōr"
description = """The ordinal *kʷet-ur-tHo- has no plain labial to trigger the labial jump (pgmc_labial_jump),
yet PGmc *fedurþô has the *f of the cardinal *fedwōr. Kroonen (s.v. *fedwōr, PDF 173) puts the *f-
of 'four' itself down to the influence of *fimf 'five'. Cause: analogy with the cardinal."""
words = ["fourth"]
definition = "xʷ → ɸ / # _"

# Artikulatorischer Sprung — assimilation at a distance. A labiovelar *kʷ becomes *p when the
# word holds another PLAIN labial, on either side of it:
#   *pénkʷe   > *pémpe  > *fimf   (five)   — trigger *p, before
#   *wúlkʷos  > *wúlpos > *wulfaz (wolf)   — trigger *w, before
#   *kʷetwṓr            > *fedwōr (four)   — trigger *w, AFTER (see the note in `description`)
# Without it these would be **finhw, **wulhwaz — the regular /xʷ/ Grimm's Law gives, which is
# what the engine derived before this rule existed.
#
# The trigger must be a plain labial, not another labiovelar, or *kʷekʷlos (wheel, PGmc
# *hwehwlaz) would be dragged in too. In this feature system w and kʷ share every place feature
# (labial, lingual, back, rounded) and part only on sonorant/continuant, so the trigger is
# written as "labial with no lingual node" (p, b, m, f) or "labial and sonorant" (w, m) — both
# of which exclude the labiovelar obstruents.
#
# Pre-Germanic: it feeds Grimm's Law, which then takes the new *p to *f.
[pgmc_labial_jump]
time = -950
name = "Artikulatorischer Sprung: xʷ > ɸ near another labial"
description = "Assimilation at a distance — five, wolf, four; *kʷekʷlos (wheel) has no plain labial and keeps its labiovelar. Treated as ONE bidirectional rule: Wiktionary instead calls four analogical (the p- of *pénkʷe pulling on the neighbouring numeral *kʷetwṓr, expected **hwedwōr), but a single phonological rule covering all three — with wheel as the control that correctly does not fire — is the stronger account, and the direction of the trigger is the only thing that separates them."
definition = [
    "xʷ → ɸ / [+labial, lingual: none, -syll] []* _",
    "xʷ → ɸ / [+labial, +sonorant, -syll] []* _",
    # The FOLLOWING trigger excludes nasals. Four's trigger is the glide *w; a labial nasal in an
    # ending is not a trigger — with the neuter *kʷekʷlóm the /m/ of *-om would otherwise fire the
    # rule and give **feβlą for wheel, which is the control this rule is supposed to leave alone.
    "xʷ → ɸ / _ []* [+labial, lingual: none, -syll, nasal: none]",
    "xʷ → ɸ / _ []* [+labial, +sonorant, -syll, nasal: none]",
]

# A nasal takes the place of a following labial: *pémpe (the p-form above) has m, not n.
# t = -940, AFTER the labial jump: a nasal assimilates to what the jump LEAVES, not to what it
# started with. *pénkʷe > (Grimm) *fenxʷe > (jump) *fenɸe > *fimf, with the *n going LABIAL; but
# *penkʷrós > (Verner) *fenɣʷros, which the jump does not touch, and the *n goes VELAR: *fingraz.
# Run the assimilation first and five comes out **fiŋf.
[pgmc_nasal_place_assimilation]
time = -940
name = "n assimilates to a following labial"
description = "*penpe > *pempe > *fimf"
definition = "n → m / _ [+labial, -syll, lingual: none]"


# West Germanic hardens the voiced fricatives that Verner's Law and Grimm's Law left behind:
# *ð > d (*fader, *ealdaz > eald), *β > f (*ubilaz > yfel). The velar ɣ > g is already above.
[wg_dh_hardening]
time = 260
name = "ð becomes d"
description = "Minkova §4.1 — the Verner/Grimm voiced fricative hardens in West Germanic"
definition = "ð → d"

[wg_b_hardening]
time = 404
name = "β becomes f"
description = """*ubilaz > OE yfel

t = 404, after the Proto-West Germanic checkpoint (403). In PWGmc */b/ still had its fricative
allophone, "much as [it] had been in PGmc" (Ringe & Taylor §4.1, PDF 121), so the merger of *β
with *f is later. Dated 260, it gave the 403 column f for the β of *haƀan, *seƀun, *uƀil."""
definition = "β → f"

# The three Proto-Germanic diphthongs reach Old English, and NOTHING was carrying them there:
# *ai, *au and *eu were surviving to the 900 checkpoint untouched, so *hailaz came out **hajl for
# the attested hāl, *dauþuz **dɑwθ for dēaþ, *bewzą **beowr for bēor. This was the single largest
# hole in the cascade — the 200→900 rules were breaking 110 words that were already exact at
# Proto-Germanic, and these three account for a good share of them.
#
#   *ai > ā   (Gmc *stain-, *haim-, *aigan- > OE stān, hām, āgan)
#   *au > ēa
#   *eu > ēo
#
# The DATE is Minkova's, and it is the whole point of the rule (§6.5.2): the monophthongisation
# of *ai is "held to have occurred AFTER the fronting of /aː/ to /æː/" — so the long vowel it
# makes must come out the far side of the fronting still BACK. That is why Old English has a low
# back ā at all, and why stān is not **stæn.
#
# Which puts it at 480, BEFORE `oe_a_fronting` (500) rather than after — because that rule is the
# short-a brightening (a > æ), not the long-ā fronting Minkova is ordering against, and letters
# match by identity here, so it cannot touch the long ɑː this rule produces. Dated 520 instead,
# the rule simply never fires: the brightening has already turned the *ɑ of *ɑj into *æ and there
# is no *ɑj left to match. Same relative chronology, read off the right rule.
# It must also stay before `oe_breaking` (550), which would otherwise take the *eu of *bewzą for
# a plain /e/ and break it a second time.
[oe_diphthong_shift]
time = 404
name = "The Proto-Germanic diphthongs: *ai > ā, *au > ēa, *eu > ēo"
description = "Minkova §6.5.2 — Gmc *stain- > OE stān; *dauþuz > dēaþ; *bewzą > bēor"
# Stated on FEATURES, not on the letter ɑ. Letter patterns match by identity here, and the /ɑ/
# these diphthongs carry is not always the letter — *ɑjnɑɣɑz has one the segmenter read straight
# from the input, while *ojtos got its own from `non_high_back_merger`, a feature merge. Written
# `ɑ j` the rule fired on *hailaz and silently passed over *aiþaz, which looks identical on the
# page. The low back vowel is what the change is about, so that is what the rule asks for.
definition = [
    "[+syll, -cons, aperture: low, +back] j → [length: long] ∅",
    "[+syll, -cons, aperture: low, +back, length: short] w → [+front, back: none, advancement: atr] ɑː",
    "[+syll, -cons, aperture: mid, +front] w → [+syll] oː",
]

# Old English breaking: a front vowel diphthongises before /r/ or /l/ + consonant, and before
# /x/ — *arm > earm, *ald > eald, *hert > heorte, *dauþ > dēaþ (Minkova §6, the OE diphthongs).
[oe_anglian_retraction]
time = 408
name = "Anglian retraction: *æ becomes *a before *l + consonant"
description = """Ringe & Taylor §6.2.3 (PDF 199): before *l and a consonant, West Saxon broke *æ to ea, but
the Anglian dialects retracted it to *a: *kaldaz > *kæld > WS ċeald, Angl. cald; *halmaz > WS
healm, Angl. halm; *allai > WS ealle, Angl. alle. Mercian ald, all, fallan, haldan, halm and salt
keep the retracted vowel (PDF 234). Present-Day English continues the Anglian forms (old, cold,
salve), so the West Saxon 900 targets of this cluster are corrected to them (DECISIONS.md,
2026-10-07). Placed before oe_breaking, which then finds no *æ before *lC. The *a is back, so
palatalisation (410) leaves the *k of cald alone."""
definition = "[+syll, -cons, aperture: low, +front, length: short] → [+back, front: none, advancement: rtr] / _ l [+cons]"

[oe_breaking]
time = 408
name = "Breaking: front vowels diphthongise before r/l + C and before x"
description = "æ > æɑ, e > eo — the source of OE's eald, earm, heorte"
# On features again — the æ that `oe_a_fronting` now makes is a merged bundle, not the letter,
# so a letter-matching `æ → æɑ` looked straight past *kæld and *ɣærd. Third rule with the same
# defect; they were all written when most of these vowels still arrived as letters.
# The vowel is matched on FEATURES but the result is written as LETTERS: a one-to-two expansion
# has to take the replacement path, because a bundle merge across unequal counts is ambiguous and
# the rule simply never fires. So the left side asks for a front vowel (however it was made) and
# the right side spells the diphthong out.
# *e AND *æ ARE NOT BROKEN BY THE SAME CLUSTERS, and writing one clause for both cost real words:
#
#   before *r + C, and before *h, BOTH break     — heard, earm, heorte, eolh, feoh
#   before *l + C, only *æ breaks                — eald, healf, weall
#   before *l, *e breaks ONLY in *lh and *lc     — eolh, meolc … but OE helm, self, help, delfan
#                                                  keep a plain *e, and the broad rule gave
#                                                  **heolm, **seolf.
#
# And the *h that breaks is the LABIOVELAR too: *ehwaz is OE eoh, not **eh. Breaking (408) runs
# long before oe_labiovelar_resolution (480), so the *xʷ is still one segment here and a rule
# written for plain *x looks straight past it.
#
# A long vowel breaks to a LONG diphthong: "the results of the breaking of long vowels, not the
# results of the breaking of short vowels, merged with the inherited diphthongs" (Ringe & Taylor
# PDF 190). WS *nǣh > nēah 'near' is the only long *ǣ before *h (PDF 194). Broken short, its
# syllable was light and kept the final *-u, and the *h was then lost between vowels.
definition = [
    "[+syll, -cons, aperture: low, +front] → æ ɑ / _ [+son, -syll, +cons, nasal: none] [+cons]",
    "[+syll, -cons, aperture: mid, +front] → e o / _ [+trill] [+cons]",
    "[+syll, -cons, aperture: mid, +front] → e o / _ [+lat] [-son, +back]",
    "[+syll, -cons, aperture: low, +front, length: long] → æ ɑː / _ x",
    "[+syll, -cons, aperture: low, +front] → æ ɑ / _ x",
    "[+syll, -cons, aperture: mid, +front] → e o / _ x",
    "[+syll, -cons, aperture: low, +front] → æ ɑ / _ xʷ",
    "[+syll, -cons, aperture: mid, +front] → e o / _ xʷ",
]

# PWGmc had "shifted stressed *ē to *ā (which merged with the rare PGmc *ā)" (Ringe & Taylor §4.1,
# PDF 120): *dēdiz, *sēdiz > PWGmc *dādi, *sādi. The *ā then fronts again in Anglo-Frisian
# (`oe_long_a_fronting`, 404). STRESSED only, like the old lowering this replaces: an unstressed *ē
# has its own fate (`oe_unstressed_long_e_to_o`).
# The final diphthong *-ōu merges with the trimoric *-ô: PGmc *ahtōu 'eight' > PWGmc *ahtō > OE
# eahta (Ringe & Taylor §3.1.4, PDF 75–76; §5.1.2, PDF 169). Made overlong here, it then takes
# the n-stem path: `wg_final_long_o` (402) and `oe_final_overlong_to_a` (455).
[wg_final_ou]
time = 240
name = "Final unstressed *-ōu becomes trimoric *-ô"
description = "Ringe & Taylor §3.1.4, PDF 75–76 — *ahtōu > PWGmc *ahtō > OE eahta"
definition = "[+syll, length: long, +back, stress: none] w → [length: overlong] ∅ / _ #"

[wg_e1_to_a]
time = 250
name = "Stressed *ē₁ becomes *ā"
description = "Ringe & Taylor §4.1, PDF 120 — *dēdiz > PWGmc *dādi, *mēkijaz > *mākī"
definition = "[+syll, length: long, aperture: mid, +front, stress: primary] → [aperture: low, +back, front: none, advancement: rtr]"

# The Proto-Germanic long mid vowels raise on the way to Old English: ō [ɔː] > [oː] (*dōmaz >
# dōm, *flōduz > flōd) and ē [ɛː] > [eː]. The gold keeps the two apart — PGmc is transcribed
# with ɔː/ɛː and OE with oː/eː — so this is a change to derive, not a convention to normalise.
[wg_long_mid_raising]
time = 404
name = "Long ɔː raises to oː"
description = """PGmc *ō [ɔː] > OE ō [oː] — that half is a raising, and it stands.

t = 404, after the Proto-West Germanic checkpoint (403), whose forms still have the open *ō
(Wiktionary's PWGmc transcriptions write [ɔː], as in *hrabō /ˈxrɑ.βɔː/). Dated 250, the raising
gave the 403 column oː for the ɔː of *brōþer, *swōtī, *fōt.

The front half goes the OTHER WAY. PGmc *ē₁ [ɛː] does not raise to [eː]; it LOWERS to OE ǣ [æː],
and the gold says so without exception: *sēdiz > OE sǣd, *dēdiz > dǣd, *þrēduz > þrǣd, *mēkijaz
> mǣċe. (Old English *ē has a different source — the i-umlaut of *ō and of *ai — so raising *ē₁
into it merged two vowels the language keeps apart.)

The front half — *ē₁ lowering to *ǣ — is now two changes: PWGmc *ē₁ > *ā (`wg_e1_to_a`, 250) and the
Anglo-Frisian fronting of that *ā (`oe_long_a_fronting`, 404)."""
definition = "[+syll, length: long, aperture: mid, +back, advancement: !atr] → [advancement: atr]"

# Proto-Germanic's long mid vowels are open: *ō is [ɔː] and *ē is [ɛː] (which is why the gold
# transcribes them so). The cascade above merges *ā into a close *oː, so lower both here — and
# `wg_long_mid_raising` then lifts them again on the way to Old English, where ō really is
# [oː]. The two rules together are the ō/ē history, and each checkpoint sees its own value.
[pgmc_long_mid_lowering]
time = 170
name = "The long mid vowels are open in Proto-Germanic: oː > ɔː, eː > ɛː"
description = "PGmc *ō = [ɔː], *ē = [ɛː] — *brōþēr is [brɔːθɛːr]"
definition = "[+syll, length: long, aperture: mid, advancement: atr] → [advancement: rtr]"

# ─────────────────────────────────────────────────────────────────────────────
# Old English → Middle English → Modern. Minkova chs. 5, 7–8.
# ─────────────────────────────────────────────────────────────────────────────

# OE ā rounds to ME open ɔː — the change behind stān > stone, bāt > boat (§7.3).
[me_a_rounding]
time = 1100
name = "OE aː rounds to ɔː"
description = "Minkova §7.3 — hāl > hool, stān > stoon"
# BACK only. OE ǣ (þrǣd, dǣd, slǣpan) is a LOW vowel too, and an unrestricted rule rounds it —
# *þrǣd came out **þrɔːd against an attested ME *þrɛːd. Only the back ā rounds; the front ǣ
# raises, one rule down.
definition = "[+syll, length: long, aperture: low, +back] → ɔː"

# The OE diphthongs smooth out in early ME (§7.4): eo, æɑ monophthongise.
[me_diphthong_smoothing]
time = 1000
name = "The OE diphthongs smooth"
description = """Minkova §7.4 — heorte > herte, earm > arm, bēor > beer, dēor > deer.

t = 1000, BEFORE the homorganic lengthening at 1050, and this is the whole reason the OE
diphthongs were coming out wrong. In *heard, *ċeald, *eald the diphthong's SECOND element sits
in front of a homorganic *rd / *ld — so lengthening ran first and lengthened it, rounding
carried it to *ɔː, and the ēa rule then read the *æ + *ɔː as the long diphthong and smoothed it
to *ɛː: **hɛːrd, **t͡ʃɛːld, **ɛːld for attested *hard, *kɔːld, *ɔːld. Smooth first and the
sequence is a plain short *ɑ, which lengthens and rounds exactly as *ald should. It is left BACK
here on purpose — me_low_vowel_merger fronts it at 1150, after the rounding has had its look."""
definition = ["e oː → eː ∅", "e o → e ∅", "æ ɑ → ɑ ∅"]

# Unstressed vowels reduce to schwa (§7.6), the great levelling of the ME inflections.
[me_unstressed_reduction]
time = 1200
name = "Unstressed vowels reduce to schwa"
description = "Minkova §7.6 — sunu > sone, oþer > other"
definition = "[+syll, stress: none, length: short] → ə"

# The velar fricative is lost with compensatory lengthening: niht > night /naɪt/, miht >
# might (§5.3 — the KNIGHT-NIGHT cluster simplifications).
[lme_e_raising_before_x]
time = 1420
name = "A long *e rises to *i before the palatal fricative (high, nigh)"
description = """Steponavičius §183 (PDF 171–172): "At the close of the 13th c. a [j]-glide developed in front
of the voiceless palatal dorsal fricative", and "[ei] before [x'] was replaced by [ii] in the 14th
c., for example, in MidE hēh > heih, heigh > high". Minkova §7.4 (PDF 206–207): [-eːç] gives
[-ejç] ~ [ej], "later raised, merging with [ij]" (OE nēh > ME neh, neih, nih). The 1400 target of
high (Wiktionary's ME) still has [eː], so the rule is dated just after that checkpoint. The long
[iː] then takes part in the Vowel Shift."""
definition = "eː → iː / _ x"

[me_x_loss]
time = 1450
name = "A vowel lengthens before x"
description = """Minkova §5.3 — niht > nīt, then the Vowel Shift takes it to /naɪt/. Steponavičius §183 (PDF
171): a [j]-glide developed before the palatal fricative at the close of the 13th c., and fused
with the vowel.

t = 1450, AFTER the Middle English checkpoint, for the same reason as me_ng_simplification:
Middle English still HAS the fricative (dohter is /ˈdɔxtər/, wiht /ˈwixt/, liht /ˈlixt/), and a
rule at 1400 takes it away from the column that records it. The fricative itself is lost much
later (eme_x_loss)."""
definition = "[+syll] → [length: long] / _ x"

# Final schwa is lost (§7.6) — the silent -e of ME spelling.
# Dated BEFORE the 1400 checkpoint, not after it. Chaucer still scans a final -e, but the gold's
# Middle English column is Wiktionary's editorial IPA, and not one of its 109 forms ends in a
# schwa — it transcribes the loss as already complete. A rule at 1500 fires after the column is
# scored, which left *hōrǭ deriving ˈhoːroː against an attested ˈhoːr.
[me_final_e_loss]
time = 1350
name = "Final schwa is lost"
definition = "ə → ∅ / _ #"

# The Great Vowel Shift (Minkova ch. 8, which treats it as a series rather than one event):
# the long vowels raise, and the two already-high ones diphthongise.
[emode_vowel_shift]
time = 1560
name = "The Great Vowel Shift"
description = """Minkova ch. 8 — iː > əɪ, uː > əʊ, eː > iː, oː > uː, ɛː > eː, ɔː > oː; ME ā moves later
(emode_vowel_shift_low). Dated 1560: Minkova dates the shift c. 1400–1550 (Fig. 8.6, PDF 257), Hart
(1570) already has [oː] in ghost, and the shortenings dated 1550 (death, red, hot, end) must come
first. The 1400 targets keep the unshifted vowels of the traditional ME reconstruction.

The high vowels become [əɪ] and [əʊ] first. Minkova (Fig. 8.6, PDF 257, and n. 18) gives them as the
intermediate stage, "the closest to … the 'authentic' Elizabethan/Shakespearean pronunciation";
Pyles & Algeo (p. 171, PDF 93) have [əɪ] and [əʊ] becoming [aɪ] and [aʊ] "in the course of the
seventeenth century"; Jones reads Gil (1621) as [ei]- or [əi]-type (PDF 225, 252). The lowering
is eme_price_mouth_lowering."""
# The two new diphthongs are written with the LAX second element the modern column uses — RP's
# PRICE is /aɪ/ and MOUTH /aʊ/, not /aj/ and /aw/. The glide letters are different segments from
# the lax vowels, so writing them as glides misses every long-*i and long-*u word in the lexicon.
definition = [
    "ˈiː → ə ɪ", "ˈuː → ə ʊ",
    # Not before r: Jones (PDF 258) reads Coles (1674) as keeping ME ō before r unraised,
    # [oo] in floor, whore, door, against [uu] in good, food, book.
    "eː → iː", "oː → uː // _ r",
    "ɛː → eː", "ɔː → oː",
]

[emode_vowel_shift_low]
time = 1600
name = "The Great Vowel Shift: ME ā fronts and raises to [ɛː]"
description = """The low vowel moves last. Minkova (Fig. 8.6, PDF 257) dates the shift c. 1400–1550, and
Stenbrenden's data put the high and upper-mid vowels in the 13th–14th centuries (Minkova §8.2.2.1,
PDF 253–254). Hart (1570) still has [aː] in fāðr while his ghost already has [oː], so the step
for ME ā is dated after the rest of the shift (emode_vowel_shift, 1560). Cooper (1687) has [ɛː]
in name."""
definition = "aː → ɛː"

# RP is non-rhotic: /r/ is lost in the coda, leaving a lengthened or centring vowel (§5.2).
# The initial velar fricative weakens to /h/ — OE hām, heorte are [x-] in the engine's
# transcription but [h-] from Middle English on (Minkova §5.1, the h-histories).
[me_x_to_h]
time = 1300
name = "Initial x weakens to h"
description = "Minkova §5.1 — hām, heorte, hāl"
definition = "x → h / # _"

# RP is non-rhotic: /r/ is lost in the CODA, and the vowel before it lengthens to compensate —
# arm /ɑːm/, four /fɔː/ (Minkova §5.2). The generalisation is the syllable position, so it is
# written with the syllable boundary `$` rather than by enumerating the environments it shows
# up in (before a consonant, before a word edge) — the form re-syllabifies before every rule,
# so `$` always reflects current structure. "In the coda" is `_ [-syll]* $`, not `_ $`: in arm
# and corn the /r/ sits inside the coda with a consonant after it, so it is not adjacent to the
# boundary. An onset /r/ (red, arrow) is untouched, the boundary falling before it, not after.
[pde_r_loss]
time = 1750
name = "Coda r is lost with compensatory lengthening (non-rhotic RP)"
description = "Minkova §5.2 — arm /ɑːm/, four /fɔː/"
# The compensatory lengthening is for a STRESSED vowel only. An unstressed *-er gives a plain
# short schwa in RP — other /ˈʌðə/, brother /ˈbɹʌðə/, weather /ˈwɛðə/ — and lengthening it there
# produced **ʌðəː, with a long schwa no English word has.
definition = [
    "[+syll, stress: primary] → [length: long] / _ ɹ [-syll]* $",
    "ɹ → ∅ / _ [-syll]* $",
]

# Germanic raises short *e to *i before a nasal in the CODA — *femf > *fimf, *wenda > *winda
# (Minkova §3.4). Stated with `$`, like the existing e_to_i_before_syllable_final_nasal, which
# says the same thing but fires at t=0 — too late for the *pempe > *fimf path above, where the
# raising has to precede the Germanic consonant changes.
[pgmc_e_raising_before_coda_nasal]
time = -900
name = "e raises to i before a syllable-final nasal"
description = """Minkova §3.4 — *femf > *fimf. Ringe (PDF 184–185): *e "was raised to *i when followed by a
nasal in the syllable coda (though not before a nasal which was in turn followed by a vowel)". So
the condition is a nasal followed by a consonant or the word end, whatever the syllabifier makes of
the cluster: *temr- 'timber' has its m before an r, which the syllabifier would put in the onset."""
definition = "[+syll, aperture: mid, +front, length: short] → [aperture: high] / _ [+cons, nasal: 1] ([-syll] | #)"

# TODO — West Germanic gemination (Minkova §3.4): a consonant doubles before *j (*hagjō >
# heċġ, *satjaną > settan). Tried as a bare "C → CC / _ j" and it LOST an exact match: the
# real change is blocked after a heavy syllable and never applies to /r/ (*niwjaz keeps its
# single w), so it needs those conditions before it earns its place. It is also the honest fix
# for chin (*kinnuz), whose geminate is what makes its nasal syllable-final.

# Proto-Germanic's overlong (trimoric) vowels are gone by Old English — they fall in with the
# ordinary long ones.
#
# Dated 250, not 120: the rule's own comment says "by Old English", but 120 is before the
# PROTO-GERMANIC checkpoint at 200, so it was shortening the vowels a stage before anyone looked.
# The overlong is not an artefact — it is what Proto-Germanic has, and the gold transcribes it:
# *arɔːː, *aŋgɔːː, *ausɔːː, *uxsɔːː, *namɔːː all end in a trimoric vowel. We built it correctly in
# `overlong_vowels` and then threw it away unread, missing the whole n-stem class by one mora.
[oe_overlong_shortening]
time = 465
name = "Overlong vowels become long"
definition = "[+syll, length: overlong] → [length: long]"

# A voiced obstruent devoices before a voiceless one: *nezt > nest.
[wg_obstruent_devoicing]
time = 50
name = "A voiced obstruent devoices before a voiceless one"
definition = "[-son, +voice] → [-voice] / _ [-son, -voice]"

# Homorganic-cluster lengthening (Minkova §6.4): a vowel lengthens before a sonorant + voiced
# homorganic stop — ld, nd, mb, rd, rn — which is why CHILD has a long vowel and CHILDREN, with
# a third consonant, does not. It feeds the a-rounding below (eald > ald > āld > ōld > old).
[oe_homorganic_lengthening]
time = 1050
name = "Vowel lengthens before a homorganic sonorant + voiced stop"
description = "Minkova §6.4 — CHILD-CHILDREN, HOUND; *ald > āld, *kind > kīnd"
# Two restrictions the gold forces, both of them standard:
#   the sonorant is a NASAL or a LATERAL, not *r — ME hard, arm, barm keep their short vowel;
#   the stop is NOT VELAR — ME long and young keep a short vowel before their *ŋg (/lɔŋg/,
#   /juŋg/), which is homorganic phonetically but takes no part in the change.
# And not before *mb. Minkova §6.4 (PDF 167) counts nine -mb words (climb, comb, coomb, dumb,
# December, lamb, timber, tumble, womb), finds lengthening in only four, and concludes: "There is no
# compelling argument for classifying -mb as a lengthening cluster." Jones (PDF 40, 138) names lamb
# as unlengthened or shortened again. comb is lengthened by sporadic_comb_long.
definition = "[+syll, length: short] → [length: long] / _ [+son, -syll, +cons, trill: none] [-son, +voice, -cont, back: none, labial: none] $"

[sporadic_comb_long]
time = 1050
name = "SPORADIC: comb lengthens before *mb"
description = """Minkova §6.4 (PDF 167) lists comb among the four -mb words that show lengthening in PDE, and
Pyles & Algeo (p. 148–149, PDF 82) say the lengthening survived at the end of ME "only in i and o
before mb (clīmben 'to climb,' cǭmb 'comb')". Word-scoped, because -mb is not a regular lengthening
cluster."""
words = ["comb"]
definition = "[+syll, length: short, stress: primary] → [length: long] / _ m b"

# Middle English short o is open [ɔ] — fox /fɔks/, corn /kɔrn/, yoke /jɔk/ (§7.3).
[me_short_o_opening]
time = 1150
name = "Short o opens to ɔ"
description = "Minkova §7.3 — the ME short-vowel qualities"
definition = "[+syll, length: short, aperture: mid, +back, +rounded] → [advancement: rtr]"

# Palatalisation and affrication of the velars (Minkova §4.3): before a front vowel /k/ becomes
# /t͡ʃ/ and /g/ becomes /j/ — ċinn 'chin', ġeard 'yard' — and /sk/ becomes /ʃ/ everywhere
# (fisċ 'fish', sċearu 'share'). It runs after Anglo-Frisian brightening, whose new /æ/ is one
# of the front vowels that triggers it.
#
# It must run BEFORE i-mutation (t=420): the front vowels i-mutation creates do NOT trigger
# palatalisation, which is exactly why OE cynd keeps its /k/ — its /y/ is younger than the
# change. Ordered after i-mutation instead, the rule turns cynd into **t͡ʃynd and loses ground.
[oe_j_loss_after_geminate]
time = 430
name = "*j is lost after a geminate"
description = """Ringe & Taylor (PDF 62) write the West Germanic gemination as *Cj > *CjCj: the *j survives it
(PWGmc *bannju, *skallju, *haggju). Old English has bend, sċiell, heċġ, with no trace of it, so the
*j is lost after the geminate. Dated 430, after i-mutation (420), which the *j triggers."""
definition = "j → ∅ / 1=[-syll] @1 _"

[oe_parasite_vowel]
time = 466
name = "Parasite vowel: an epenthetic *e breaks a final consonant + liquid"
description = """Minkova §4.4 (svarabhakti). Once apocope has stripped the ending, a word can be
left with a consonant + liquid in the coda, and Old English will not have it — an *e is inserted:

    *wedrą  > *wedr  > OE weder        *bebruz  > *befr > OE befer
    *fingraz > *fingr > OE finger      *akraz   > *æcr  > OE æcer

Dated 466, after EVERY rule that can strip a final vowel — not just `wg_final_apocope` (450) but
`oe_high_vowel_deletion` (460) as well. At 450 the u-stems still HAVE their ending: *bebruz is
*befru, its *fr is not yet final, and the rule cannot see it. The a-stems were already bare, so
*wibraz > wifer worked and hid the bug; *bebruz, *swegrō came out **befr, **swejr."""
# THE VOWEL HARMONISES with the one before it, and the gold is unanimous about which is which:
#
#     back  -> *o :  *sundr > sundor,  *ātr > ātor,  *hleoþr > hlēoþor,  *āfr > āfor
#     front -> *e :  *wedr  > weder,   *æcr > æcer,  *hafr   > hafer,    *bebr > befer
#
# So the back clause has to come first; with only an *e the eight back-vowel words all come out
# with a spurious front vowel. It looks back to the NEAREST vowel across however many consonants
# stand between: *sundr is u-n-d-r, and a single-consonant environment cannot reach its *u.
#
# After a dental stop no vowel is inserted before *l: Ringe & Taylor list setl, botl, ādl and
# spātl as words without epenthesis (PDF 344), hence the exception on the two *l clauses.
#
# Before *l the preceding segment must be an OBSTRUENT. Written `[-syll]` it also matches the
# first half of a GEMINATE — *fullaz > *full and *stallaz > *stall are l+l, and the rule split them
# into **fulel and **stalel. A geminate is one long consonant, not a cluster that needs breaking.
definition = [
    "∅ → o / [+syll, +back] [-syll]* [-syll] _ r #",
    "∅ → e / [-syll] _ r #",
    "∅ → o / [+syll, +back] [-syll]* [-son] _ l # // [-son, -cont, +anterior] _",
    "∅ → e / [-son] _ l # // [-son, -cont, +anterior] _",
]

[oe_palatalisation]
time = 410
name = "Velars palatalise before a front vowel; sk becomes ʃ"
description = "Minkova §4.3 — ċinn > chin, heċġ > hedge, fisċ > fish. NOTE: this currently costs one exact match, but the fault is upstream, not here — cost and kind reach it with a front vowel they should not have (OE cost has back /o/; we derive ke.owst), so the rule correctly palatalises a vowel that an earlier rule got wrong. Kept because it is a real change and its damage localises the upstream bug."
# Ringe & Taylor, *The Development of Old English* §4: palatalisation happens in FOUR
# environments, not one. We had only the first — a velar before a front vowel — and were missing
# the one that fires on a PRECEDING front vowel:
#
#   (4) "preconsonantal and word-final *g were palatalized by any preceding front vowel,
#        but word-final *k was palatalized only by a preceding *i or *ī, and it cannot be
#        demonstrated that preconsonantal *k was palatalized at all."
#
# That clause is what gives *ainag > ǣniġ (ˈæːnij), *wagnaz > wæġn (ˈwæjn) and *magraz > mæġer
# (ˈmæjer) their /j/ — a *g with no vowel after it at all, which a "before a front vowel" rule can
# never reach. Note *k gets no preconsonantal clause: Ringe says it cannot be shown to happen.
#
# (`wg_g_hardening` was moved to 405, ahead of this rule, for the same reason: at 430 the PGmc *ɣ
# was still a fricative when palatalisation looked, so no *g existed for it to find.)
#
# *sk palatalises in three positions (Ringe & Taylor PDF 219). Initially it does so before every
# vowel, by extension from the front ones. Medially it does so unless a back vowel follows:
# *flāski > flǣsċ, but *aiskōn > āscian. Finally it does so unless a back vowel precedes: fisċ, but
# frosc, whose variant frox shows the [sk], and ME frosk keeps it.
definition = [
    "s k → ʃ ∅ / # _",
    "s k → ʃ ∅ / _ [+syll, +front]",
    "s k → ʃ ∅ / _ # // [+syll, +back] _",
    "k → t͡ʃ / _ [+syll, +front]",
    # The geminate *gg before *j, from the West Germanic gemination (*hagjō > *haggju), is
    # palatal as a whole: OE heċġ, leċġ. Before the clauses below, which would take only its
    # first half.
    "g g → j j / _ j",
    "g → j / _ [+syll, +front]",
    "g → j / [+syll, +front] _ #",
    "g → j / [+syll, +front] _ [-syll]",
    "k → t͡ʃ / [+syll, aperture: high, +front] _ #",
]

# *ð hardens to *d after a nasal already in Proto-Germanic — *mundiz, not *munðiz. (The general
# West Germanic ð > d is later, at t=260.)
[pgmc_dh_hardening_after_nasal]
time = 100
name = "ð becomes d after a nasal"
description = "*munðiz > *mundiz"
definition = "ð → d / [+cons, nasal: 1] _"

# The boukólos rule: a labiovelar loses its labialisation beside a rounded vowel — *gʷōws >
# *kōz 'cow', where a *kʷ would be left with nothing to round against.
# TODO — the boukólos rule (a labiovelar delabialises next to a rounded vowel): *gʷōws > *kōz
# 'cow'. Written as "next to ANY rounded vowel" it is too broad: it fixes cow but breaks quick
# (*gʷih₃wós > *kʷikʷaz), whose second labiovelar stands next to the rounded *h₃ and wrongly
# delabialises — a net loss of one exact match. The real rule is restricted to *u and *w, so it
# needs that narrower environment (and it must be ordered BEFORE the back-vowel merger, which
# unrounds *ō to *ɑː and leaves nothing to trigger on). Since 2026-10-07 cow takes its *kōz from
# the word-scoped sporadic_cow_nominative, after Kroonen (PDF 339).

# A nasal takes the place of a following velar: *jungaz, not *jungaz with a plain /n/.
[pgmc_nasal_velar_assimilation]
time = -880
name = "n becomes ŋ before a velar"
description = "*junkós > *jungaz — the ŋ of young, long, sing"
definition = "n → ŋ / _ [+cons, -son, +back, front: none]"

# ɣ hardens to g after a nasal already in Proto-Germanic — *jungaz, not *junɣaz. (The general
# West Germanic ɣ > g is later, at t=430.)
[pgmc_g_hardening_after_nasal]
time = 100
name = "ɣ becomes g after a nasal"
description = "*junɣaz > *jungaz, and the labiovelar *liŋɣʷō > *liŋgʷō"
definition = ["ɣ → g / [+cons, nasal: 1] _", "ɣʷ → gʷ / [+cons, nasal: 1] _"]

# The Proto-Germanic voiced fricatives *β ð ɣ (from Grimm's third series and from Verner) are
# realised as the STOPS b, d, g word-initially and after a homorganic nasal — and, for *ð, after
# /l/ too: *kaldaz, *mundiz. Elsewhere they stay fricatives, which is why the attested forms show
# *beβruz, *lɑɣuz, *ɣarðaz. Note *ɣ does NOT harden initially (*ɣans 'goose'), so it is not listed.
[pgmc_voiced_fricative_hardening]
time = 100
name = "β, ð harden to b, d word-initially and after a nasal or l"
description = "*βeβruz > *beβruz; *kalðaz > *kaldaz; *ɣans keeps its initial fricative"
definition = [
    "β → b / # _",
    "ð → d / # _",
    "β → b / [+cons, nasal: 1] _",
    "ð → d / [+cons, nasal: 1] _",
    # *ɣ hardens after a nasal like the other two — *luŋgrɑz, *ɑŋgɔːː. It is only the WORD-INITIAL
    # position it stays out of (*ɣans), which is what the note above is about; the nasal context
    # was left off with it by oversight.
    "ɣ → g / [+cons, nasal: 1] _",
    # …and after *z. The stop allophone of *ð appears after *l, *n AND *z — the attested *mizdō
    # 'reward' (Kroonen: *mizdō(n)- f. <= *misdʰ-eh₂-) has a plain *d, not a *ð, and nothing else
    # in the cascade could have hardened it there.
    "ð → d / z _",
    "ð → d / l _",
]

# Proto-Germanic *a is the back vowel [ɑ] — including the *a that laryngeal colouring made from
# *e (*h₂érmos > *armaz). Without this the root keeps a front [a] while the endings already have
# [ɑ], and every h₂-coloured word misses by one phone.
[pgmc_a_backing]
time = 0
name = "Low a backs to ɑ"
description = "*armaz, *akraz, *anþeraz — PGmc *a is [ɑ]"
definition = "a → ɑ"

# Grimm's Law leaves the aspiration of the voiceless series on the new fricatives: *mógʰtis
# surfaces as *mɑxʰtiz with a stray /ʰ/. The Germanic obstruents are plain, so neutralise it.
[pgmc_deaspiration]
time = 10
name = "The obstruents lose their aspiration"
description = "*mɑxʰtiz > *mɑxtiz"
definition = "[-son, glottal_aperture: spread] → [glottal_aperture: neutral]"

# Two identical short vowels left in hiatus by laryngeal loss collapse into one — *h₂yuHn̥ḱós
# loses its laryngeal between the root /u/ and the /u/ epenthesised into *n̥, and the *uu that
# results is a single /u/ in the attested *jungaz. (The long+short case is `vowel_contraction`.)
[sporadic_youth_hiatus_glide]
time = -1950
name = "SPORADIC: the hiatus of *ju.unþi- takes a *w"
description = """Kroonen s.v. *ju(w)unþi- (PDF 316): "The w probably arose in hiatus position of a proto-form
*juunþi-. Go. junds*, on the other hand, seems simply to have lost the hiatus." young has the same
hiatus and contracts (*junga-, Kroonen PDF 27), so the glide is word-scoped. Cause: a glide inserted
in the hiatus, as Kroonen says. Before pgmc_identical_vowel_hiatus, which would merge the two *u."""
words = ["youth"]
definition = "∅ → w / u _ u"

[pgmc_identical_vowel_hiatus]
time = -1900
name = "Identical short vowels in hiatus merge"
description = "*juuŋkós > *jungaz"
definition = "1=[+syll, -cons, length: short] @1 → ∅ @1"

# A glide is inserted to break the hiatus left by laryngeal loss: *priHós > *frijaz, not
# **friaz. Germanic fills a i_V gap with /j/.
[pgmc_j_epenthesis]
time = -1850
name = "j is inserted between i and a following vowel"
description = "*priHós > *frijaz"
definition = "∅ → j / [+syll, aperture: high, +front] _ [+syll]"

# A post-vocalic glide is the offglide of a diphthong, not a consonant: *Hóytos > *aiþaz is
# [ɑi̯θɑz], and *h₂éyǵs > *aiks is [ɑi̯ks] — written with a non-syllabic vowel, not with /j/.
# Wiktionary spells the second half of a Germanic diphthong both ways — *ainagaz as [ɑjnɑɣɑz]
# but *aiþaz as [ɑi̯θɑz] — and so does the engine, depending on whether the glide came from PIE
# *y or from a vowel left in hiatus. Neither is a phonological difference, so both sides are
# normalised to /j/: the gold by CONVENTIONS, the derivation by this rule.
[pgmc_diphthong_offglide]
time = 150
name = "The offglide of a diphthong is written j or w"
description = """*ɑi̯θɑz and *ɑjnɑɣɑz are the same diphthong, spelt two ways in the source. The same holds for
*u̯: PGmc *ai, *au, *eu are the sequences /aj/, /aw/, /ew/, and the second half of *au is structurally
the semivowel *w (Ringe §4.2, PDF 254–255; §3.2.6 (i), PDF 171): *stauraz, *raumaz."""
definition = ["i̯ → j / [+syll] _", "u̯ → w / [+syll] _"]

# Germanic a-umlaut, the /i/ half only: short *i lowers to *e before a non-high vowel in the
# next syllable — *nisdós > *nestaz. Blocked before /j/, which is why *midjaz keeps its /i/.
#
# Only the /i/ half, and only at this date. The parallel lowering of *u (wg_a_umlaut, t=350) is
# a later and much less regular change: run at Proto-Germanic date it lowers *wulfaz to **wolfaz
# and a dozen others, costing 12 exact matches. The two halves are not one rule.
# RE-DATED out of Proto-Germanic (was 50, now 300 — West Germanic), and renamed with it.
#
# Kroonen's Proto-Germanic 'nest' is *nista-, with an /i/ — not the *nestą our Wiktionary gold
# gives — and his *fiska- (<= *pisk-o-, cf. Lat. piscis) has one too. Ringe's bibliography cites
# Lloyd, "Is there an a-umlaut of i in Germanic?" So the lowering is doubtful AT Proto-Germanic,
# and the 200 gold has been corrected to *nistą accordingly (ATTESTED_FIXES in build_gold.py).
#
# But the change is REAL, just later: Old English has nest with an /e/ while fisc keeps its /i/,
# and those are ATTESTATIONS, not reconstructions — there is no arguing with them. So the rule
# moves rather than goes. At 200 the /i/ now survives (*nistą, *wissaz); by 900 it has lowered
# where Old English says it lowered.
#
# The condition stays as irregular as the facts are. *nistaz lowers and *fiskaz does not, on the
# same shape (i + cluster + a); what separates them here is the aperture of the intervening
# consonants, which is a description of the split rather than an explanation of it. Ringe's
# bibliography suggests the field has not explained it either.
[pgmc_i_lowering]
time = 300
name = "SPORADIC: *i lowers to *e in nest and wer"
description = """Ringe & Taylor §2.3.1(ii) (PDF 49): West Germanic has no regular lowering of *i to *e.
Only wer and nest show e for *i, for reasons the book calls unrecoverable, while fisc, cwic, biter,
hlid and wifer keep their i. So the lowering is word-scoped. Kroonen also reconstructs *fiska- and
*nista- with *i, and Ringe cites Lloyd, "Is there an a-umlaut of i in Germanic?"."""
words = ["nest", "weraz", "nistaz"]
definition = "[+syll, aperture: high, +front, length: short, stress: primary] → [aperture: mid]"


# ─── Modern English realisation ───────────────────────────────────────────────────────────────
# The last block. These are not sound changes in the interesting sense — they are the phonetic
# realisations that make Received Pronunciation what it is — but the modern column is transcribed
# in them, so the cascade has to arrive there.

[eme_rhotic_approximant]
time = 1620
name = "The trill *r becomes the approximant /ɹ/"
description = """Early Modern English realises /r/ as the approximant [ɹ], not the trill the cascade
has carried since PIE. Dated 1620, after the Great Vowel Shift and BEFORE the seventeenth-century
pre-/r/ vowel changes (Jones §4.6) and the later r-loss, which therefore act on the approximant —
those rules are written with ɹ."""
definition = "r → ɹ"

[lme_unstressed_final_i_short]
time = 1569
name = "The unstressed final -y is short [i]"
description = """Minkova §7.6 (PDF 230–231) gives the ME suffix <-y> as [-i]. The 1400 targets write it long
(bely, mirie: [iː]), and so does me_y_suffix after a consonant; the vowel is short and unstressed, so
the Vowel Shift does not touch it, and the laxing below and pde_happy_tensing (1950) give RP [i]."""
definition = "iː^[stress: none] → i / _ #"

[sporadic_merry_south_eastern_e]
time = 1500
name = "SPORADIC: merry takes the South-Eastern [ɛ]"
description = """Minkova (PDF 195–196): "In merry/mirth the adjective has the South-Eastern spelling and
pronunciation, but the noun is East Midlands." The 1400 target mirie has the East Midland [i]; the
standard later took the South-Eastern [ɛ] of OE y. Cause: a dialect form. Dated after the 1400
checkpoint."""
words = ["merry"]
definition = "i → ɛ / # m _"

[lme_ai_diphthong_notation]
time = 1569
name = "The ME diphthong [æi] is written [æɪ]"
description = """This rule changes the notation, not the sound, like the laxing below. The 1400 targets write
the ME diphthong of eighte, wain as [æj]; the Early Modern readings write its second half [ɪ]:
Cooper's eight, "commonly sounded ait" (Jones §4.4.4, PDF 276), is [æɪt]."""
definition = "æ j → æ ɪ"

[lme_short_high_vowels_lax]
time = 1569
name = "The short high vowels are written lax: /i/ > /ɪ/, /u/ > /ʊ/"
description = """This rule changes the notation, not the sound. Minkova reconstructs lax short high and mid
vowels from late Old English on (§6.5.1, PDF 172–173, after Hogg 1992), and Pyles & Algeo's table of
the late ME short vowels has [ɪ] in "in" and [ʊ] in "but" (p. 174, PDF 95). Wiktionary's OE and ME
transcriptions write these vowels [i, u], and so do the rules dated before this one. The Early
Modern readings write [ɪ, ʊ]: Hart's ⟨kuik⟩ [kwɪk] and ⟨sun⟩ [sʊn], Gil's ⟨kin⟩ [kɪn]. So the
change is dated just before the first Early Modern checkpoint (1570). The [i] of [iw] stays, because
eme_iw_to_juu reads it."""
definition = ["i → ɪ // _ w", "u → ʊ"]

[eme_short_o_opens]
time = 1900
name = "Short /ɔ/ opens to /ɒ/"
description = "RP's LOT vowel: fox, ox, otter."
definition = "ɔ → ɒ"

[eme_bath_lengthening]
time = 1680
name = "TRAP lengthens before a voiceless fricative in the coda (BATH)"
description = """Minkova §8.2.1 (PDF 240–242): "the original short open vowel was lengthened when followed
by a tautosyllabic voiceless fricative: /-f/, /-θ/ or /-s/" (after, last, class, bath). The new long
vowel stays apart from the ME ā that the Vowel Shift is raising, and "the lengthening must have
started in the seventeenth century". Cooper (1687) already has a lengthened a in last with no change
of quality (Jones, PDF 232), so the rule is dated before that checkpoint and gives [æː]. The backing
to [ɑː] is pde_bath_backing."""
definition = "æ → æː / _ (f | θ | s) [-syll]* $"

[pde_bath_backing]
time = 1780
name = "The BATH vowel backs to /ɑː/"
description = """Minkova §8.2.1 (PDF 242): the lengthened [æː] "is lengthened and later backed and occurs
as [ɑː] in SSBE". It was still stigmatised in the 18th century, so the backing is dated late in it."""
definition = "æː → ɑː"

[eme_short_a_backs]
time = 1740
name = "Short /a/ backs to /ɑ/ before /ɹ/"
description = """RP's START vowel, in the non-rhotic pattern the modern column is transcribed in:
arm, barm, hard.

t = 1740, BEFORE pde_r_loss (1750) — and that is the whole point. Dated in the 1900 block it looked
for an /ɹ/ that the r-loss had already deleted, and arm, barm, hard came out **aːm, **baːm, **haːd
with the wrong vowel. Every pre-*r vowel rule has to be stated while the *r is still there.

CODA /ɹ/ only, written with the same `_ ɹ [-syll]* $` clause as pde_nurse_vowel and pde_north_vowel.
START backing is a pre-coda-/r/ change: arm, barm, hard have the /ɹ/ closing the syllable, but in
marrow, farrow, sallow the /ɹ/ or /l/ is the ONSET of the next syllable and the vowel stays TRAP —
RP has /ˈmæɹəʊ/, not **/ˈmɑɹəʊ/. Unrestricted, this rule reached across the syllable break and
backed marrow's /æ/."""
definition = "æ → ɑ / _ ɹ [-syll]* $"

# The toe–tow merger feeds eme_goat_diphthongisation below: it puts the ME *-ɔw words into the
# same /oː/ the Vowel Shift leaves for toe, and the GOAT rule then diphthongises both together.
[eme_toe_tow_merger]
time = 1650
name = "The toe–tow merger: /ɔw/ smooths to /oː/"
description = """ME lōw, soul, marwe, talwe end in the diphthong *ɔw; in the seventeenth century it
smooths to *ow and then to the long monophthong *oː, falling together with the *oː of toe (< ME
*ɔː, raised by the Vowel Shift). Hence tow rhymes with toe, soul with sole, and marrow and tallow
end in the GOAT vowel rather than a stray glide.

t = 1650, AFTER the Middle English checkpoint at 1400 — ME still HAS the diphthong and the 1400
column is transcribed with it (marɔw, talɔw, both already exact) — and BEFORE
eme_goat_diphthongisation (1900), which is the point: this rule does not produce the modern vowel
itself, it merely delivers *oː into the GOAT rule, which then gives /əʊ/. It is also ordered before
eme_short_o_opens (1900); left until after it, the *ɔ would already have opened to *ɒ and there
would be no *ɔw left to match."""
definition = "ɔ w → oː"

[eme_goat_diphthongisation]
time = 1900
name = "The GOAT vowel: /oː/ diphthongises to /əʊ/"
description = """After the Great Vowel Shift the long open *ɔː of Middle English has become *oː
(ghost, oath, oak, dole, loath). Received Pronunciation does not have a long monophthong there —
it has the GOAT diphthong [əʊ], which pde_back_closing_diphthongs later closes to CUBE's [əw]."""
definition = "oː → ə ʊ"

[pde_happy_tensing]
time = 1950
name = "Final unstressed /ɪ/ becomes the FLEECE vowel (happY)"
description = """Minkova §8.2.1 (PDF 237), after Wells 1982: "happY-tensing", the second vowel of happy
realised "as a more peripheral vowel, a compromise between [ɪ] and [iː]". CUBE's accent page (happY)
calls it a change of phoneme: "Classic RP allowed the KIT vowel finally and before vowels ... In
current SSB, the FLEECE vowel is used instead." So the rule gives FLEECE [iː], and
pde_front_closing_diphthongs (1980) makes it [ɪj] with every other FLEECE: any /ˈɛnɪj/, merry
/ˈmɛɹɪj/. Neither source gives a date, and Wells describes it in recent RP. It undoes the laxing of
1569 at the word end."""
definition = "ɪ → iː / [-syll] _ #"

# The CUBE block. CUBE's accent page lists how current Standard Southern British (SSB) differs from
# classic RP, and the modern targets are CUBE's (DECISIONS.md, 2026-10-07). The page gives no dates.
# It sets classic RP, the speech of "the period before the tumultuous social changes of the 1960s",
# against the SSB of the 21st century. So each rule in the block is dated 1980, and the file order
# decides the order among them. eme_short_e_opens has the same date.
[pde_front_closing_diphthongs]
time = 1980
name = "FACE, PRICE, FLEECE end in /j/, and PRICE starts at /ɑ/"
description = """CUBE's accent page (FACE, PRICE, CHOICE): classic RP ended these diphthongs in a
less-than-high [ɪ], and current SSB ends them "in [i] or [j]". The start of PRICE "is backer, nearer
to [ɑ]". FLEECE, "often a very close monophthong" [iː] in classic RP, is now [ɪj] and "belongs to
the set of front-closing diphthongs". eight /ˈɛjt/, five /ˈfɑjv/, three /ˈθɹɪj/.

The rule comes before pde_centring_smoothing in the file. fire and wire must have their [j] before
NEAR loses its schwa. No word in the set has CHOICE."""
definition = [
    "ɪ → j / [+syll] _",
    "a → ɑ / _ j",
    "iː → ɪ j",
]

[pde_back_closing_diphthongs]
time = 1980
name = "GOAT, MOUTH, GOOSE end in /w/"
description = """CUBE's accent page (MOUTH, GOAT and GOOSE): classic RP ended GOAT and MOUTH in a
less-than-high [ʊ], and current SSB ends them "in [u] or [w]". GOOSE, "often a very close
monophthong" [uː] in classic RP, is now [ʉw] and joins "the set of back-closing diphthongs". oak
/ˈəwk/, loud /ˈlawd/, tooth /ˈtʉwθ/.

widow already ends in the consonant [w]. Its vowel became a schwa at 1200, before the GOAT rules
could see it, and CUBE's GOAT /əw/ now matches it as it stands.

The rule comes before pde_foot_fronting in the file. The [ʊ] of GOAT and MOUTH must be [w] before
FOOT's [ʊ] moves."""
definition = [
    "ʊ → w / [+syll] _",
    "uː → ʉ w",
]

[pde_centring_smoothing]
time = 1980
name = "SQUARE and NEAR lose the schwa: /ɛə/ > /ɛː/, /ɪə/ > /ɪː/"
description = """CUBE's accent page (SQUARE, NEAR): classic RP had the centring diphthongs [ɛə] and [ɪə].
In current SSB, SQUARE "is a long open-mid monophthong, [ɛː]", and NEAR "is becoming a long
near-close monophthong, [ɪː]". share /ˈʃɛː/, beer /ˈbɪː/. CURE moves to THOUGHT, but no word in
the set has CURE."""
definition = [
    "ɛ ə → ɛː ∅",
    "ɪ ə → ɪː ∅",
]

[pde_trap_lowering]
time = 1980
name = "TRAP lowers to /a/"
description = """CUBE's accent page (TRAP): classic RP had "a relatively nonlow vowel" [æ], and current
SSB has "an opener vowel, nearer to [a]". lamb /ˈlam/, marrow /ˈmaɹəw/."""
definition = "æ → a"

[pde_lot_raising]
time = 1980
name = "LOT rises to /ɔ/"
description = """CUBE's accent page (LOT): classic RP had "a relatively low vowel" [ɒ], and current SSB
has "a higher vowel, nearer to [ɔ]". fox /ˈfɔks/. The vowel returns to the quality that
eme_short_o_opens took from it."""
definition = "ɒ → ɔ"

[pde_thought_raising]
time = 1980
name = "THOUGHT rises to /oː/"
description = """CUBE's accent page (THOUGHT): classic RP had "a relatively low mid vowel" [ɔː], and
current SSB has "a higher vowel, nearer to [oː]". saw /ˈsoː/, horn /ˈhoːn/. The start of CHOICE
rises with it, but no word in the set has CHOICE."""
definition = "ɔː → oː"

[pde_foot_fronting]
time = 1980
name = "FOOT fronts to /ɵ/"
description = """CUBE's accent page (FOOT): classic RP had "a relatively back vowel" [ʊ], and current SSB
has "a fronter vowel, nearer to [ɵ]". foot /ˈfɵt/, wolf /ˈwɵlf/."""
definition = "ʊ → ɵ"

[pde_yod_coalescence]
time = 1980
name = "/dj/ before a stressed vowel becomes /d͡ʒ/"
description = """CUBE's accent page calls the change of [tj] and [dj] to [tʃ] and [dʒ] "perhaps the
main consonantal difference between classic RP and current SSB". Its section on accents says the
default SSB has the affricates "before stressed vowels, eg tune and dune", and the entries agree:
dew /ʤʉ́w/, tune /ʧʉ́wn/, Tuesday /ʧʉ́wzdɛj/ (accessed 2026-10-07). Section 2 of the same page still
says that Tuesday keeps [tj]. dew is the only word in the set with either cluster, so the rule
states only [dj]."""
definition = "d j → d͡ʒ ∅ / _ [+syll, stress: primary]"

[me_h_cluster_loss]
time = 1250
name = "Initial /h/ is lost before a liquid or nasal"
description = """OE hlūd, hnutu, hring, hlāf lose their *h in Middle English: loud, nut, ring, loaf.
The cluster *hC- is not tolerated, and the *h simply goes.

NOT BEFORE *w. Middle English still has hw- — hwal, hwīt, hwete are written and said with it, and
the reduction to /w/ is a later and still incomplete change. An unrestricted rule gave **wal for
the attested ME hwal.

t = 1250, BEFORE `me_x_to_h` (1300). That rule turns the initial *x into an *h, and at the same
date it wins on file order and leaves this one nothing to match."""
definition = "x → ∅ / # _ [+son, -syll, +cons, back: none]"

# The other half of the initial *h-cluster story, which me_h_cluster_loss deliberately leaves for
# later: the *hw- it protects does eventually reduce, and RP is on the reducing side.
[pde_wine_whine_merger]
time = 1800
name = "The wine–whine merger: initial /hw/ reduces to /w/"
description = """ME hwal, hwēl, hwīt keep the cluster, but in the great majority of English — RP
included — initial /hw/ ([ʍ]) falls together with plain /w/, so whine rhymes with wine and whale
is /weɪl/. The contrast survives only in Scottish, Irish, Southern American and New England
speech, none of which is the target here.

t = 1800, AFTER the Middle English checkpoint at 1400, which is the whole point: ME still has the
cluster and the 1400 column is transcribed with it (hweːl, hwiːt). Dating this any earlier takes
the *h away from the very column that records it. 1800 puts it in the post-split band where
Wikipedia's chronology places the merger's spread through standard English.

No exclusion is needed for the who/whom/whose/how set, which lost the *w instead (/hw/ > /h/
before a rounded vowel, already in OE and ME): those words are not in this lexicon, and whole —
which is here — never had *hw at all (OE hāl), so it reaches this rule as /h/ and is untouched."""
definition = "h → ∅ / # _ w"

[me_degemination]
time = 1250
name = "Geminates simplify"
description = """Middle English has no long consonants: OE full, sċiell, stall, wull, þynne, cynn
give full, shell, stall, wool, thin, kin with a SINGLE consonant."""
definition = "1=[-syll] @1 → @1"

[me_ng_simplification]
time = 1450
name = "Final /ŋg/ loses its stop"
description = """OE lang, ġeong, mearg > long, young, marrow — the velar nasal stands alone.

t = 1450, AFTER the Middle English checkpoint: ME still HAS the stop (long is /lɔŋg/ there), and
dating this at 1400 takes it away before the column that records it."""
definition = "g → ∅ / ŋ _ #"

[eme_short_e_opens]
time = 1980
name = "Short /e/ opens to /ɛ/"
description = """The DRESS vowel: bed, nest, elk, helm. CUBE's accent page (DRESS): classic RP had "a
relatively close mid vowel" [e], and current SSB has "an opener vowel, nearer to [ɛ]". "The same
change applies to the start-point of the FACE diphthong", so the rule has no context: bane
/ˈbɛjn/. It is dated with the CUBE block (see the comment above pde_front_closing_diphthongs)."""
definition = "e → ɛ"

[eme_foot_strut_split]
time = 1640
name = "The FOOT–STRUT split: short /ʊ/ stays after a labial before /l/, else becomes /ʌ/"
description = """Short *ʊ stays FOOT where a LABIAL precedes and an *l follows, and unrounds to STRUT
everywhere else:

    FOOT : *full > full,  *wulf > wolf,  *wull > wool
    STRUT: *sunu > son,   *guma > gome

Pyles & Algeo (pp. 173–174, PDF 94–95): ME short u unrounded, "though the older value survives in a
good many words in which the vowel was preceded by a labial consonant, especially if it was followed
by l". Minkova §8.2.1 (PDF 245–246) dates it: the unrounding started around 1600, was still going on
in the first half of the 17th century, and has its first solid evidence in the 1640s (Lass 1999).
Gil (1621) still writes the ⟨u⟩ of ⟨but⟩ in ⟨fludz⟩, and Cooper (1687) separates the vowels of full
and up (Jones, PDF 233). Hence 1640.

The [ʊ] must follow a consonant or the word edge. The second half of the [aʊ] that the Vowel Shift
makes is also [ʊ], and it does not unround."""
definition = [
    "ʊ → ʌ / [-syll] _ // [+labial, -syll] _ l",
    "ʊ → ʌ / # _",
]

[eme_th_voicing]
time = 1200
name = "The dental fricative voices between vowels"
description = """other /ˈʌðə/, brother /ˈbɹʌðə/, weather /ˈwɛðə/ — the Old English /θ/ is voiced here.

t = 1200, before the Middle English checkpoint: ME already HAS the voiced fricative (other is
/ˈuðər/ there), so dating it in the modern block misses the column that records it.

The dental *þ [θ] is the segment Grimm makes (grimm_dentalisation), so this is written on it."""
definition = "θ → ð / [+syll] _ [+syll]"


# ─── Middle English ───────────────────────────────────────────────────────────────────────────
# Old English *g was a fricative [ɣ] after a back vowel (Minkova §4.2.1, PDF 83–84), and Middle
# English vocalises it to *w there: lagu > lawe, sagu > sawe, boga > bowe (§5.1.2, PDF 103; Jones
# §3.4.2, Table 3.18, PDF 163–165). The cascade writes the fricative g (`wg_g_hardening`, 405), so
# the rule reads g. A single *g between a back vowel and a vowel is never the stop, which stands
# only initially, after a nasal and in a geminate. Before the æ/ɑ merger (1150), which turns OE ɑ
# into a front a, and before open-syllable lengthening (1200), which the new closed syllable blocks.
[me_g_vocalisation]
time = 1140
name = "A *g after a back vowel vocalises to *w before a vowel"
description = "Minkova §4.2.1, §5.1.2; Jones Table 3.18 — sagu > sawe, lagu > lawe, boga > bowe"
definition = "g → w / [+syll, +back] _ [+syll]"

# A high front vowel and a following *j in the same syllable merge as *iː: OE drȳġe > drie > dry,
# tigol > tile (Minkova §7.4, PDF 205; §8.2.2.2, PDF 257–258; Jones §2.3.6, PDF 68–70;
# Steponavičius §183, PDF 170–171). Beside the glide shortening (1360): both reshape a vowel + glide.
[me_ij_merger]
time = 1360
name = "*ij in one syllable becomes *iː"
description = "Minkova §7.4, §8.2.2.2; Jones §2.3.6; Steponavičius §183 — ryġe > rye, drȳġe > dry"
definition = "i j → iː ∅ / _ [-syll]* $"

# In a vowel + glide diphthong the vowel's length is neutralised (Minkova §6.5.3, PDF 177–178;
# §7.4, PDF 208): OE dēaw gives ME [dɛw], and the 1400 column writes every ME diphthong as a short
# vowel + glide (niw, saw, fɔwr, ɛj). After the loss of final -e (1350), which leaves the glide in
# the coda. Minkova's statement covers both glides: "whether the input was a short vowel, as in dæġ
# 'day', ... or a long vowel, as in grēġ 'grey', the result is a falling diphthong of the same type".
# The *j clause was added on 2026-10-07 for OE eġe 'awe' > ME ey [ɛj].
[me_glide_length_neutralisation]
time = 1360
name = "A long vowel shortens before a coda *w or *j"
description = "Minkova §6.5.3, §7.4 — dēaw > ME dɛw, eġe > ME ey [ɛj]"
definition = "[+syll, length: long] → [length: short] / _ (w | j) [-syll]* $"

# Late ME *a before a final *l develops a *w glide and joins *au: hall > haul, ball > bawl
# (Jones §3.4.4, Table 3.24, PDF 172–173; Salesbury 1547, PDF 253; Minkova §8.2.2.3, PDF 268–269).
[lme_al_glide]
time = 1450
name = "A back glide develops between *a or *ɔ and a coda *l"
description = """Late ME [aw] from a + l: all, hall, call, false, salt (Minkova PDF 269, and §5.2.5,
PDF 130–131: the dark [ɫ] of the coda is vocalised, keeping its backness). Jones Table 3.24 has
hall > haul in the 15th century. Before l and a consonant the short ɔ takes the glide too: Bullokar
writes mould with his half-vowel l, which Jones reads [mould] (Table 4.12, PDF 264), and Minkova
cites ME fok(e) 'folk'. The l itself goes later before a labial or velar (eme_l_loss)."""
definition = ["∅ → w / a _ l #", "∅ → w / a _ l [-syll]", "∅ → w / ɔ _ l [-syll]"]

[eme_l_loss]
time = 1550
name = "Coda *l is lost after the glide before a labial or a velar"
description = """Minkova §5.2.5 (PDF 130–131): coda /l/ "flanked by a back vowel in the peak and a velar or
a labial in the second coda slot" is lost (hafpenny, fok(k)(e) 'folk'); the change is "fully covered
in documents from and after the fifteenth century", and its spread south "was still under way at
the end of the sixteenth century". Mulcaster (1582) says salues is said sawues (Jones PDF 253),
Gil (1621) calls the l-less fók the commoner form, and Cooper (1687) says L is silent in salve,
calf, half, chalk and walk (Jones PDF 254). Before a dental the l stays: salt, bald, mould."""
definition = ["l → ∅ / w _ [+labial, -syll]", "l → ∅ / w _ [+back, -syll]"]

# Late Middle English [ɛw] and [ew] merge with [iw] (Minkova §8.2.2.3, Fig. 8.7, PDF 268;
# Steponavičius §183, PDF 172). After the 1400 checkpoint, which still writes dɛw.
[lme_ew_raising]
time = 1450
name = "*ɛw and *ew merge with *iw"
description = "Minkova §8.2.2.3; Steponavičius §183 — dew, new, few fall together in [iw]"
definition = [
    "ɛ w → i w / _ [-syll]* $",
    "e w → i w / _ [-syll]* $",
]

[eme_x_loss]
time = 1640
name = "The velar and palatal fricative is lost"
description = """Jones §4.3(1) (PDF 251–252): Gil (1621) "almost everywhere suggests … that the post-vowel
fricative is still produced" (njħt, rjħt, brjħtnes), while Wallis (1653) says the sound of gh in
light, night, right, daughter "is almost always omitted"; by the latter part of the 17th century
the loss was complete in Southern dialects. The Early Modern targets are Jones's readings of these
orthoepists, so the loss is dated between Gil and Wallis. Minkova (§5.1.4), Pyles & Algeo (p. 176)
and Steponavičius (§202) date the loss from the 15th century; see DECISIONS.md, 2026-10-07."""
definition = "x → ∅"

# The falling [iw] becomes the rising [juː] (Minkova §8.2.2.3, PDF 268: from c. 1600; McMahon
# §3.3.3.2, PDF 129–130; Steponavičius §197, PDF 191: late 16th century; Jones §3.4.3, PDF 171).
# t = 1640, after the Vowel Shift (1560), which would otherwise diphthongise the new *uː.
[eme_iw_to_juu]
time = 1640
name = "*iw becomes *juː"
description = "Minkova §8.2.2.3; McMahon §3.3.3.2; Steponavičius §197 — new, dew, few"
definition = "i w → j uː / _ [-syll]* $"

# Early Modern *au becomes *ɔː: claw, draw, law, all (Jones §4.4.2, PDF 270–273; Minkova
# §8.2.2.3, PDF 268–269). Dated between Gil (1621), who still writes the diphthong (dauħter, Jones
# PDF 274), and Cooper (1687), whose "o guttural" in awl is [ɔː] (PDF 271).
[eme_aw_monophthongisation]
time = 1650
name = "*au becomes *ɔː"
description = """Jones §4.4.2; Minkova §8.2.2.3 — law, draw, all. Not before a labial, where the [aw]
left by eme_l_loss (half, calf, salve) goes to [æː] instead (eme_aw_before_labial)."""
definition = "a w → ɔː // _ [+labial, -syll]"

[eme_aw_before_labial]
time = 1700
name = "*au before a labial becomes *æː (calf, half, salve)"
description = """Minkova PDF 269: the l-less forms before a labial (calf, calm, half) went with talk and
chalk "until the seventeenth century", and "the pronunciation with [æː] in calf and half is
recorded from the early eighteenth century in British English". The [æː] then backs with BATH
(pde_bath_backing) to the [ɑː] of RP salve, half, calf."""
definition = "a w → æː / _ [+labial, -syll]"


[me_ea_monophthongisation]
time = 1100
name = "The Old English diphthong ēa smooths to /ɛː/"
description = """OE dēaþ, drēam, ġeard, strēam > ME deeth, dreem, yerd, streem. The long diphthong
loses its second element and lands on a long open *ɛː."""
definition = "æ ɔː → ɛː"

[me_low_vowel_merger]
time = 1150
name = "OE æ and ɑ merge on ME /a/"
description = """Old English keeps a front *æ (hwæl, fæder, stæf) apart from a back *ɑ (scaru,
talu, nama). Middle English does not: both come out as a single low front *a — whal, fader, staf
beside share, tale, name."""
definition = [
    "æ → a",
    "ɑ → a",
]

[me_short_vowel_opening]
time = 1150
name = "Short /e/ and /o/ open to /ɛ/ and /ɔ/"
description = "OE bedd, nest, eolh, weorc > ME bed, nest, elk, werk — with the open mid vowels."
definition = [
    "e → ɛ",
    "o → ɔ",
]

[me_open_syllable_lengthening]
time = 1200
name = "A short vowel lengthens in an OPEN syllable"
description = """Minkova §7.5. The great Middle English quantity change: a short vowel that ENDS
its syllable lengthens — OE talu, nama, scaru, medu > ME tāle, nāme, shāre, mēde.

Written with the syllable boundary `$`, which is what "open syllable" means; the form
re-syllabifies before every rule, so `$` always reflects the current structure. It has to run
BEFORE the apocope that strips the second syllable, or there is no open syllable left to see.

Three conditions, and the gold forces every one of them:

  STRESSED  — the unstressed vowel of the second syllable is in an open syllable too, and
              lengthening it gives *tālē, *sōnē: a long schwa no English word has.
  NON-HIGH  — *sunu > ME sun, not **sūn. The high vowels do not take part; this is the classic
              restriction and the gold agrees with it.
  ONE CONSONANT AFTER — *oxa is ox-a and its *o is closed. Our syllabifier, working on sonority
              alone, makes an onset of the *ks and leaves the *o open, so the rule fires and gives
              **ōx. Requiring a single consonant after the boundary reproduces the real
              syllabification without needing an onset table.

The second syllable must be a coda-less final schwa, the tale, name, nose type. Minkova §7.5.2.1
(PDF 223) counts the outcomes: words of that type lengthen in 95.8 per cent of cases, while 84.8 per
cent of the disyllables whose second syllable stays (acorn, over) resist the lengthening, 97.6 per
cent of those whose second syllable is closed by an obstruent (gannet, haddock) keep the short
vowel, and about a quarter of those with a sonorant peak (acre, navel, besom, open) lengthen. So
ME fader, water, weder and eni stay short by rule, and the minority that does lengthen before a
sonorant is word-scoped (sporadic_osl_sonorant_coda)."""
definition = "[+syll, length: short, stress: primary, aperture: !high] → [length: long] / _ $ [-syll] ə #"

[sporadic_atter_short]
time = 1210
name = "SPORADIC: atter continues the geminated variant *aittra-"
description = """Ringe & Taylor (PDF 69): *t geminated sporadically before *r in West Germanic, leaving doublets,
and they cite PNWGmc *aitrą > PWGmc *aitr, *aittra- > OE ātor (OS ēttar). OE also shortened a long
vowel before a geminate (PDF 296). The 900 target records ātor; ME atter, with short a, continues
the geminated āttor > attor. Word-scoped, because the gemination is sporadic."""
words = ["atter"]
definition = "[+syll, length: long] → [length: short]"

[sporadic_osl_sonorant_coda]
time = 1200
name = "SPORADIC: acre, haven, beaver, navel lengthen before a sonorant-peak syllable"
description = """Minkova §7.5.2.1 (PDF 223): second syllables with a sonorant peak, "rB ~ ər (acre), lB ~ əl
(navel), mB ~ əm (besom) and nB ~ ən (open)", lengthen the stressed vowel in nearly a quarter of
the eligible words. Acre and navel are her examples; haven and beaver have long vowels in their ME
targets (hāven, bēver). Word-scoped, because three quarters of the class keep the short vowel."""
words = ["acre", "haven", "beaver", "navel"]
definition = "[+syll, length: short, stress: primary, aperture: !high] → [length: long]"

[eme_trap_vowel]
time = 1575
name = "ME /a/ becomes Early Modern /æ/"
description = """The TRAP vowel: slack, black, gnat. Pyles & Algeo's table (p. 174, PDF 95) has late ME
[a] become Early Modern [æ]. Minkova §8.2.1 (PDF 239) gives the range of dates in the literature,
from the 15th century (Kökeritz, Wyld) to the 18th (Jespersen), with Lass placing the stabilisation
of [æ] in the 1650s. Jones reads the short a of Bullokar (1580: harm, warm) and Gil (1621: hart)
as [æ] (PDF 260, 264), and those readings are the 1580 and 1621 targets. So the rule is dated just
before 1580.

The rule needs a consonant after the vowel, as before. It leaves the [a] of [aw] (hall > haul, law),
which eme_aw_monophthongisation reads. The Vowel Shift writes [əɪ] and [əʊ] (1560) and lowers
them to [aɪ], [aʊ] only at 1690, so they are not fronted."""
definition = "a → æ / _ [-syll] // _ w"


[me_ae_raising]
time = 1100
name = "OE ǣ raises to ME /ɛː/"
description = """The long front low vowel of þrǣd, dǣd, slǣpan does not round with its back
counterpart (see me_a_rounding) — it raises, and Middle English has *þrɛːd, *dɛːd, *slɛːpen."""
definition = "æː → ɛː"

[me_y_unrounding]
time = 1150
name = "OE y unrounds to i"
description = """The rounded front vowel of cynn, dyne, fyllan is not kept in the East Midland
dialect Middle English is written in: kin, din, fillen. Long and short alike (mȳs > mice)."""
definition = [
    "y → i",
    "yː → iː",
]

[me_syllabic_schwa]
time = 1260
name = "A syllabic sonorant takes a schwa"
description = """Middle English has no syllabic consonants: OE swefn, wolcn, tācn give sweven,
welken, token — with a vowel written before the final sonorant.

t = 1260, and after an OBSTRUENT, and both are forced:

  AFTER DEGEMINATION (1250) — *kynn ends in a sonorant preceded by a consonant, so an earlier
  rule reads its geminate as a cluster and gives **kinen. Requiring an obstruent before the
  sonorant says the same thing a second way, and is the real generalisation.

  AFTER OPEN-SYLLABLE LENGTHENING (1200) — the schwa opens the syllable before it. *swefn is
  closed by its *fn cluster and does NOT lengthen; insert the vowel first and it does, giving
  **swɛːvən."""
definition = "∅ → ə / [-syll, -son] _ [+son, +cons, -syll] #"

[me_f_voicing]
time = 1200
name = "The fricative *f voices between voiced sounds"
description = """OE nefa, swefn, hēafod are pronounced with a [v] — Old English writes one letter
for the pair and the fricative is voiced between voiced sounds. Middle English writes the two
apart (neve, sweven, heved), and the ME column is transcribed with the /v/.

Ordered AFTER me_syllabic_schwa (1150), which gives swefn its second vowel: the *f is then
plainly intervocalic and no separate clause is needed for the sonorant environment."""
definition = "f → v / [+voice] _ [+voice]"

# OE /s/ has a voiced allophone [z] between voiced sounds, like /f/ and /θ/ (Minkova §4.4, PDF
# 89–91; Pyles & Algeo p. 105: lēosan, hūsl), and Middle English writes hasel for [haːzəl]
# (Minkova §7.3.1, PDF 199). After a vowel only: a wider [+voice] _ context turned the *rs of
# *hersô into **rz (tested by the source review).
[me_s_voicing]
time = 1200
name = "The fricative *s voices between a vowel and a voiced sound"
description = "Minkova §4.4, §7.3.1; Pyles & Algeo p. 105 — OE hæsel > ME hāzel"
definition = "s → z / [+syll] _ [+voice]"

[me_mb_simplification]
time = 1350
name = "Final /mb/ loses its stop"
description = "OE camb, lamb, climban > ME coom, lomb, climben — the silent b of comb and climb."
definition = "b → ∅ / m _ #"


[oe_back_mutation]
time = 470
name = "Back mutation: e diphthongises before a back vowel across a liquid"
description = """Minkova §3.4 (u-umlaut). A short *e becomes *eo when a BACK vowel stands in the
next syllable and a single liquid separates them: *heruz > heoru, *gelu > ġeolu, *seofon.

The liquid is the condition — *bebruz keeps its plain *e (OE befer, not **beofor) because the
consonant between is an *f. And so is the SINGLE: written with `[-syll]*`, to reach across the
*lw of *gelwaz, it reaches across *helma, *hagjō and *swegrō too and gives **heolma, **heoġġ,
**sweoġer.

Dated 470, and *gelwaz is why: its back vowel arrives only when oe_final_w_vocalisation (468)
turns the *w into one. The sequence is *gelwaz > *gelu > ġeolu, and at that point the *u is
adjacent and no widened environment is needed. It is also after i-mutation, with which it is in
complementary distribution — a FRONT vowel in the next syllable fronts, a BACK one breaks.

The second clause: Ringe & Taylor §6.9.4 (PDF 339) have West Saxon back umlaut of e before u with
a labial between as well (seofon, eowu, eofor); *bebruz still keeps its e, because apocope came
first. Jones (PDF 93) notes that the change is lexically diffused (heofon, eofor beside hefon,
efor). Finding F4 of the Ringe & Taylor review (its first half)."""
definition = [
    "[+syll, -cons, aperture: mid, +front, length: short] → e o / _ [+son, -syll, +cons, nasal: none] [+syll, +back]",
    "[+syll, -cons, aperture: mid, +front, length: short] → e o / _ [-syll, +labial] [+syll, +back, aperture: high]",
]

[oe_final_w_vocalisation]
time = 402
name = "A final *w after a consonant becomes *u"
description = """Once apocope has stripped the ending, *falwaz, *salwaz, *gelwaz are left ending in
a consonant + *w, and Old English writes the *w as a vowel: fealu, salu, ġeolu, mearu.

Dated 468, beside oe_parasite_vowel (466) — both repair a final cluster the apocope has just
created, and both need every ending already gone."""
definition = "w → u / [+cons] _ # // [+son, +cont, lateral: none] _"

[wg_final_j_vocalisation]
time = 402
name = "A final *j after a consonant becomes *i, and final *ij becomes *ī"
description = "Ringe & Taylor §3.1.2, PDF 61–62 — *harjaz > *hari, *andijaz > *andī, *arbiją > *arbī"
definition = [
    "i j → iː ∅ / _ #",
    "j → i / [+cons] _ # // j _",
]


[wg_gemination]
time = 402
name = "West Germanic gemination: a consonant doubles before *j"
description = """Minkova §4.2; Ringe & Taylor §3.1.2 (PDF 61–62). A single consonant after a SHORT vowel is
doubled before *j: *Cj > *CjCj. The *j stays (PWGmc *bannju, *skallju, *haggju) and is lost in
Old English after i-mutation (oe_j_loss_after_geminate):

    *banjō  > *bannju > OE benn     *skaljō > *skallju > OE sċiell     *hagjō > *haggju > OE heċġ

*r is the exception and does not geminate (*harjaz > OE here, not **herre). Nor do the glides: a
*jj or *ww from Holtzmann's law was "reanalyzed as *īj, *ūw" in West Germanic (PDF 81), not doubled
again, so the rule names obstruents, nasals and *l. Written for any consonant, it tripled the *jj
of ajją and twajjaz. The geminates of *ɣ
and *β are the stops *gg and *bb: PGmc *sibjō > PWGmc *[sibjbju] > OE sibb, *habjan > hebban
(Ringe & Taylor, PDF 66). Ringe & Taylor show that the change follows the loss of final *-a and *-ą
and the vocalisation of a stranded *-j, so it is dated 402, after those rules, and before the 403
checkpoint."""
definition = [
    "1=[-son, -syll] j → @1 @1 j / [+syll, length: short] _",
    "1=[+son, -syll, nasal: 1] j → @1 @1 j / [+syll, length: short] _",
    "1=[+son, -syll, +lat] j → @1 @1 j / [+syll, length: short] _",
    "ɣ ɣ → g g",
    "β β → b b",
]
[sporadic_final_u_levelling]
time = 461
name = "SPORADIC (levelling): the *-u from a final *w is lost — cwic, eoh"
description = """Ringe & Taylor: *kwikwaz > PWGmc *kwiku > OE *cwicu >! cwic, the *-u "lost by levelling on
the oblique forms" (PDF 63, 338); *ehwaz > PWGmc *ehu, *ehw- >! OE eoh (PDF 193). The "!" marks a
step that is not a sound change. After the vocalisation of the final *w (402), which makes the
*-u, and before the loss of intervocalic *h (oe_h_loss, 462), which would otherwise contract it:
eoh keeps its *h because the *-u was already gone."""
words = ["quick", "ehwaz"]
definition = "u → ∅ / _ #"


[oe_unstressed_u_lowering]
time = 485
name = "Unstressed *u is OE o before a consonant"
description = """Ringe & Taylor §6.9.6 (PDF 350): unstressed a and u "remained distinct in early OE (the latter
often written o)", and by about 900 the two were merging in closed final syllables. So *nigun,
*sebun give OE nigon, seofon. Finding F4 of the Ringe & Taylor review (its second half).

In West Saxon the contrast was breaking down "in all positions, except word-finally" (PDF 350), and
the ordinals have a medial o: seofoþa, eahtoþa, nigoþa. So the rule applies before any consonant.
Not before *w: widuwe keeps its u, as WS wuduwe ~ widuwe does (PDF 337). The exception is inferred
from the lexicon (DECISIONS.md, 2026-10-07)."""
definition = "[+syll, aperture: high, +back, stress: none, length: short] → [aperture: mid] / _ [-syll] // _ w"

[oe_unstressed_i_to_e]
time = 472
name = "An unstressed short *i lowers to *e"
description = """OE yfel, hafen, æcer: the second syllable of *ubilaz, *habanō, *akraz has a lax
*e, not the *i Proto-Germanic left there. `oe_final_i_to_e` (470) already says this for a WORD-FINAL
*i; the vowel does it wherever it is unstressed, and *ubilaz > **yfil showed the restriction was
an accident of the words that first exercised the rule."""
definition = "[+syll, -cons, aperture: high, +front, length: short, stress: none] → e"


[oe_i_mutation_unrounding]
time = 421
name = "The i-mutated mid back vowels UNROUND"
description = """Old English i-mutation fronts *o and *ō and unrounds them — *bōniz > OE bēn,
*oli > ele — while the HIGH ones front and stay round: *fullijaną > fyllan, *mūsiz > mȳs.

The engine's i-mutation fronts on the lingual node and leaves the labial one alone, which is right
for *u > *y and wrong for *ō > *ē: it gave **bøːn. Rather than complicate that rule with a
rounding clause it cannot state on the same node, the two-step is written out — front first,
unround the mid vowels after."""
definition = [
    "øː → eː",
    "ø → e",
]


# After the apocope, *h is lost between voiced sounds. Before a liquid it lengthens the vowel;
# between vowels the two contract (Ringe & Taylor §6.9.1, PDF 320–323, and §6.9.3, PDF 329–331;
# Steponavičius §171, PDF 157; Jones §2.2, Tables 2.5–2.6, PDF 30–31): *hweohul > hwēol,
# *swehur > swēor, *eahu > ēa. After the high-vowel deletion (460), which has decided the *-u of
# *eahu, and before the parasite vowel (466), which would otherwise split *hweohl.
[oe_h_loss]
time = 462
name = "*h is lost between voiced sounds, with lengthening or contraction"
description = """Ringe & Taylor §6.9.1, §6.9.3; Steponavičius §171; Jones §2.2 — hwēol, swēor, ēa. A nasal after the
*h counts as a voiced sound too: Ringe & Taylor (PDF 320) give PNWGmc *leuhmō̄ > *lēohmā > OE lēoma."""
definition = [
    "[+syll] → [length: long] / _ x [+son, +cons, -syll]",
    "x → ∅ / [+syll, length: long] _ [+son, +cons, -syll]",
    "[+syll] x [+syll, stress: none] → [length: long] ∅ ∅",
]

# A final *-iju contracts: the *j is lost between the high vowels and *iu becomes the diphthong
# *īo, which later merges with *ēo: *þrijō > *þriu > þrīo, *frijōnd- > frīond (Ringe & Taylor
# §6.1.2, PDF 189–190; īo and ēo merge, §6.10.1, PDF 353). The cascade writes the merged *ēo.
[oe_iju_contraction]
time = 441
name = "A final *-iju contracts to the diphthong *ēo"
description = "Ringe & Taylor §6.1.2, §6.10.1 — *frijō > *friu > frēo, *þrijō > þrīo"
definition = "[+syll, aperture: high, +front, stress: primary] j [+syll, aperture: high, +back, stress: none] → e oː ∅ ∅ / _ #"

[sporadic_excrescent_t]
time = 1300
name = "SPORADIC: ME quiste, heste take an excrescent final *t"
description = """Hoad calls the t of ME quiste 'bequest' parasitic and that of heste 'behest' added on the model
of abstract nouns in -te (s.v. bequest, hest); Jones §3.5 (PDF 190) records syllable-final t epenthesis
in the 13th–14th centuries (fesant, plought). Word-scoped. The vowel before the new cluster then
shortens, as the 1400 target hɛst has it; shortening before st is lexical (Minkova §7.5.1.1, PDF
212–213)."""
words = ["bequest", "haisiz"]
definition = ["∅ → t / s _ #", "[+syll, length: long] → [length: short] / _ s t #"]

[sporadic_sister_suster]
time = 950
name = "SPORADIC: OE sweostor > ME suster through the variant swuster"
description = """ME suster, soster continue OE sweostor beside swuster (Hoad s.v. sister; Klein, PDF 714:
OE sweostor, swustor). After the 900 checkpoint, which records sweostor. Modern sister is the Old
Norse systir instead, not this word's reflex (Hoad)."""
words = ["sister"]
definition = "w e o → u / s _"

[sporadic_fire_fuir]
time = 300
name = "SPORADIC (levelling): PGmc *fōr becomes PWGmc *fuïr"
description = """The PWGmc nominative of 'fire' was disyllabic *fuïr, "an unusual sequence that can only have
arisen by levelling of nom.-acc. *-r into the oblique stem *fuïn-" (Ringe & Taylor §4.2, PDF 134).
Before the Proto-West Germanic checkpoint (403)."""
words = ["fire"]
definition = "ɔː → u i / _ r #"

[sporadic_fire_yr]
time = 419
name = "SPORADIC: PWGmc *fuïr becomes OE fȳr"
description = """"In one inherited word it appears that a disyllabic sequence *ui has become ȳ": *fuïr >
*fyïr > fȳr (Ringe & Taylor §6.6.3, PDF 240). Just before i-mutation (420), which would otherwise front
the *u first."""
words = ["fire"]
definition = "u i → yː ∅ / _ r #"

[sporadic_zstem_istem]
time = 399
name = "SPORADIC: eġe and siġe re-form their s-stem as an i-stem"
description = """OE eġe 'fear' and siġe 'victory' continue s-stems (*agaz-, *segaz-) that levelled the *-iz
of their oblique forms into the nominative and became masculine i-stems (Ringe & Taylor §7.2.3,
PDF 400; *agaz >! *agi > eġe, PDF 252). A morphological change, so word-scoped. Before the West
Germanic loss of final *-z (400). hete 'hatred' is the third of Ringe & Taylor's examples: PGmc
*hataz, *hatiz- >! PWGmc *hati > OE hete (PDF 252, 400)."""
words = ["ey", "segaz", "hate"]
definition = ["ɑ → i / _ z #", "e → i / _ ɣ"]

[sporadic_zstem_r]
time = 399
name = "SPORADIC: ēar 'ear of grain' keeps its s-stem *-z as *r"
description = """OE ēar continues the s-stem *ahaz-, *ahuz-, which kept its stem consonant and became a
neuter a-stem: ēar < *eaher (Ringe & Taylor §7.2.3, PDF 400; PDF 192; Hoad s.v. ear²). Word-scoped;
the *z is turned into the *r that rhotacism would give it, before the West Germanic loss of final
*-z (400) can take it."""
words = ["ear"]
definition = "z → r / _ #"

[oe_final_long_high_shortening]
time = 399
name = "A final long high vowel shortens"
description = """*wulbī, *albī end in a long *ī, and Old English has wylf, ælf — the ending is gone
altogether. It gets there in two steps, and only the first is stated here: the long vowel shortens
word-finally, and `oe_high_vowel_deletion` (460) then deletes it as the short *-i it now is, under
the same heavy-syllable condition as every other final high vowel. Stated as one rule it would say
the weight condition twice."""
definition = "[+syll, length: long, aperture: high, stress: none] → [length: short] / _ #"

[oe_mr_epenthesis]
time = 450
name = "A *b is epenthesised between *m and a liquid in Old English"
description = """Minkova §5.2.5 (PDF 129–130): the transition from a nasal to a liquid "is facilitated by an
intervening consonant", as in OE bræmlas > bræmblas 'brambles', and she compares "the epenthesis
in, for example, Goth. timrjan > OE timbrian". So *timr > timbr. Dated before the parasite vowel
(466), which would otherwise separate the m from the r (**timer)."""
definition = "∅ → b / m _ (r | l)"

[oe_degemination_next_to_consonant]
time = 600
name = "A geminate simplifies next to another consonant"
description = """Ringe & Taylor (PDF 296): in Old English "geminate consonants were also degeminated next to
another consonant" (cyste, þrycte). Rhotacism leaves such a geminate in *burzd > *borrd, because
*z "did merge with *r … in the intervocalic cluster *rz in all the daughters" (PDF 98), and Kroonen
(s.v. *burzda-) says the *z "was assimilated by the preceding r": OE bord. Dated after rhotacism
(405)."""
definition = ["1=[-syll] @1 → @1 / _ [-syll]", "1=[-syll] @1 → @1 / [-syll] _"]

[sporadic_ja_stem_gemination]
time = 459
name = "SPORADIC (levelling): a ja-stem nominative takes the geminate of its oblique forms"
description = """The PWGmc nominative of a short ja-stem ends in *-i: the *j became *i when the ending was lost,
before the West Germanic gemination (Ringe & Taylor §3.1.2, PDF 61–62; relic OHG beti 'bed' < PWGmc
*badi). Old English bedd, cynn, midd, ribb, wedd, fenn take the geminate of the oblique forms, where *Cj
"survived to undergo gemination" (PDF 62). After i-mutation (420), which the *-i triggers, and before
the high-vowel deletion (460)."""
words = ["bed", "kin", "kunją", "mid", "rib", "wadją", "fen"]
definition = "1=[+cons] i → @1 @1 / [+syll] _ #"

[oe_final_new_long_i_shortening]
time = 465
name = "The PWGmc final *-ī from *-ij- shortens"
description = """*andijaz > PWGmc *andī > OE ende, *arbiją > *arbī > ierfe (Ringe & Taylor §3.1.2, PDF 61–62).
This *-ī arose in PWGmc (`wg_final_j_vocalisation`, 402), after the older final *-ī had shortened
(`oe_final_long_high_shortening`, 399), so it was still long when `oe_high_vowel_deletion` (460)
took the short ones. It shortens after that, and `oe_final_i_to_e` (470) lowers it to *-e."""
definition = "[+syll, length: long, aperture: high, +front, stress: none] → [length: short] / _ #"

[oe_internal_long_shortening]
time = 465
name = "An unstressed long vowel before a consonant shortens"
description = """Ringe & Taylor §6.8.3 (PDF 313): "After the general syncope of short vowels had run its
course, unstressed long vowels in internal syllables were shortened". PWGmc *guldīn > OE gylden
(PDF 171), *latōst > latost (PDF 206). The rule asks for a consonant on each side. The one after
leaves a word-final long vowel to oe_final_new_long_i_shortening. The one before keeps the second
half of the long diphthongs ēa and ēo, which the cascade writes as two vowels: without it, dēop and
strēam lost their length. The rule comes before oe_unstressed_i_to_e (472), which lowers the new
short *i to e."""
definition = "[+syll, length: long, stress: none] → [length: short] / [-syll] _ [-syll]"


[me_gg_affrication]
time = 1000
name = "The geminate palatal *ġġ affricates to /d͡ʒ/"
description = """OE heċġ, seċġ, bryċġ are /jj/ in the engine's transcription — the West Germanic
gemination of a palatalised *g. Middle English has the affricate: hegge, segge, brigge."""
definition = "j j → d͡ʒ"

[me_lh_to_lk]
time = 1000
name = "The fricative in *lh hardens to /k/"
description = "OE eolh, seolh > ME elk, selk — the velar fricative becomes a stop after *l."
definition = "x → k / l _"

[me_w_rounding]
time = 1150
name = "A vowel rounds to /u/ between *w and *r"
description = """OE word, worold > ME wurd, wurld — the *w rounds the vowel after it and the *r keeps it
back. The vowel is already ROUNDED: ME werk, wer, kwern keep their unrounded *e in the same
environment, and a rule written for any short vowel gave **wurk, **wur. OE y never reaches this
rule, because me_y_unrounding has the same date and comes first; wyrm > wurm is lexical
(`sporadic_worm_u`)."""
definition = "[+syll, length: short, +rounded] → u / w _ r"

# OE [ʏ] was retracted to [ʊ] in a lexical subset of words, the ones the standard keeps with u:
# church, much (Minkova §7.3.1, PDF 194–197), and wyrm > ME wurm, worm (Klein p. 858).
[sporadic_worm_u]
time = 1145
name = "SPORADIC: OE wyrm > ME wurm retracts its *y to *u"
description = "Minkova §7.3.1 (PDF 194–197): the retraction of OE y to u is lexical (church, much)"
words = ["wurmiz"]
definition = "y → u"


# ─── The pre-/r/ vowels, all of them dated BEFORE pde_r_loss (1750) ───────────────────────────
# Non-rhotic RP does not simply drop the /r/ — the vowel in front of it went its own way first,
# and each of these has to be stated while the /r/ that conditions it is still on the page.
#
# AND WHILE IT IS STILL AN /r/. eme_rhotic_approximant turns the trill into RP's approximant /ɹ/
# at 1900, long after every one of these has fired; written with the ɹ they name a segment that
# does not exist yet and not one of them matched. The same trap as eme_th_voicing's dental.

[pde_nurse_vowel]
time = 1740
name = "NURSE: a stressed short vowel before coda /r/ becomes /əː/"
description = """ME wurd, herd, first, bird > /wəːd/, /həːd/, /fəːst/, /bəːd/.

CUBE's accent page (NURSE) writes the vowel [əː], "a long schwa", and says that it "is essentially
unchanged" since classic RP. Gimson wrote it [ɜː] only so that no short and long vowel shared a
symbol. So the rule gives [əː].

STRESSED, and the gold is blunt about it. The unstressed *-er of acre, beaver, finger, brother,
daughter is the very same short-vowel-before-coda-/r/, and RP has a plain schwa there: an
unrestricted rule gave **eɪkɜː, **biːvɜː, **fɪŋgɜː. It also reached into the OFFGLIDE of sour's
/aʊ/ and gave **saɜː — an unstressed vowel again, and the same restriction rules it out.

It is not the NORTH vowel either: ME corn, horn, thorn, stork have RP /ɔː/, not /ɜː/. They are kept
out by DATE rather than by a clause — pde_north_vowel (1735) has already lengthened their /ɔ/, and
this rule asks for a SHORT vowel."""
definition = "[+syll, length: short, stress: primary, aperture: !low] → əː / _ ɹ [-syll]* $"

[pde_centring_diphthongs]
time = 1745
name = "NEAR, SQUARE, CURE: a long vowel before /ɹ/ takes a schwa offglide"
description = """RP's centring diphthongs. The Great Vowel Shift has already raised the vowel; the
/ɹ/ then breaks into a schwa as it goes — beer /bɪə/, deer /dɪə/, share /ʃɛə/, sour /saʊə/. This is
Jones §4.6, "Seventeenth-century pre-[r] Breaking" (hear [iːr] > [iər], bear [eːr] > [ɛər]).

Dated 1745: after the shift (1560, 1600), which decides WHICH vowel is there, and before pde_r_loss."""
definition = [
    "iː → ɪ ə / _ ɹ",
    "ɛː → ɛ ə / _ ɹ",
    "uː → ʊ ə / _ ɹ",
]

[eme_ai_monophthongisation]
time = 1700
name = "The ME diphthong [æɪ] monophthongises and merges with ME ā"
description = """Jones (PDF 277): the monophthongal realization of the earlier [æi] diphthong "was conflated with,
merged with" the vowel that the Vowel Shift made of ME ā, which is [ɛː] in this cascade at this
date (Cooper's name, the 1687 target). Cooper (1687) still has the diphthong in eight ([æɪt]), and
John Jones (1701) gives both pronunciations for pair, pain, maid (PDF 317), so the merger is dated
1700. pde_face_vowel (1750) then gives RP [eɪ]."""
definition = "æ ɪ → ɛː ∅"

[pde_force_vowel]
time = 1700
name = "FORCE: a long back vowel before /r/ lowers to /ɔː/"
description = """ME flōr, hōr end at RP floor /flɔː/, whore /hɔː/ — the /r/ lowers the vowel instead of
letting it raise. The Vowel Shift leaves ME ō unraised before r (Jones, PDF 258: Coles 1674 has
[oo] in floor, whore, door), so this rule lowers that [oː]. Dated after the 1687 checkpoint,
where the targets still have [oː]. The /uː/ of sour is an /aʊ/ by now and is not touched."""
definition = "oː → ɔː / _ ɹ"

[pde_meat_merger]
time = 1680
name = "The MEAT vowel joins MEET: /eː/ raises to /iː/"
description = """The last step of the Great Vowel Shift, and it is a SEPARATE step — ME ɛː reaches
/eː/ in the shift itself (1560) and only then goes on to /iː/. Dated before Cooper (1687), whose
"e long" (bean, dream, eat) and "ee" (ear, fear, near) Jones reads as [iː] (Table 4.8, PDF 259);
see DECISIONS.md, 2026-10-07. Written
inside emode_vowel_shift the two clauses fire in the same pass and *drɛːm stops at **dreːm: the
rule list applies once, so a chain of raisings needs one date per link.

    ME drēm, strēm, mēd, bēver  >  RP dream, stream, mead, beaver — all /iː/."""
definition = "eː → iː"

[pde_face_vowel]
time = 1750
name = "FACE: /ɛː/ diphthongises to /eɪ/"
description = """ME nāme, bāne, ācre, hāven reach /ɛː/ in the Great Vowel Shift and RP has the FACE
diphthong: /neɪm/, /beɪn/, /eɪkə/, /heɪvən/.

Dated 1750, AFTER pde_meat_merger (1700) — otherwise its /eː/ output is raised straight on to /iː/
and bane comes out **biːn."""
definition = "ɛː → e ɪ"


# Close ME [oː] before [x] breaks to [ou] and rises to [uː] in the 15th century: plughe, enughe
# (Jones §3.4.1, Tables 3.14–3.15, PDF 158–160; Steponavičius §183, PDF 172; Minkova §7.4 n. 14,
# PDF 207). Open [ɔː] does not rise (dāh > dough). Before me_x_loss (1450).
[lme_ox_raising]
time = 1440
name = "Close *oː rises to *uː before *x"
description = "Jones §3.4.1; Steponavičius §183; Minkova §7.4 n. 14 — bōh > bough, plōh > plough"
definition = "oː → uː / _ x"

[sporadic_fifth_th]
time = 1450
name = "SPORADIC: ME fifte takes the -th of the other ordinals"
description = """RP fifth continues ME fifthe beside fifte, fift (Wiktionary, English fifth), a form "remodeled"
on the ordinal suffix -the (Wiktionary, ME fifte). Cause: analogy with the ordinals in -th (fourth,
seventh). Dated after the 1400 checkpoint, whose target is fift."""
words = ["fifth"]
definition = "t → θ / f _ #"

[sporadic_me_breaking_eight]
time = 1250
name = "SPORADIC: Middle English Breaking gives eighte its [æi] before the palatal fricative"
description = """Jones §3.4.1 (PDF 155–156): ME spellings (eighte), (eyȝte) show the stressed vowel of 'eight'
diphthongized before the palatal fricative, "Middle English Breaking", a process "by and large
confined to dialects south of the Humber" and "relatively sporadic" even there. The 1400 targets of
eight and eighth have it (eighte, eightethe). Cause: ME Breaking, which is lexically sporadic.
After the æ/ɑ merger (1150), which would otherwise take the glide's vowel."""
words = ["eight", "eighth"]
definition = "a → æ j / _ x"

[sporadic_thirst_i]
time = 1160
name = "SPORADIC: ME thirst takes the i of the verb"
description = """OE þurst gives ME thirst (the 1400 target) with i. Hoad (s.v. thirst) gives the noun OE þurst
beside the verb OE þyrstan, whose y unrounds to ME i. Cause, probably: analogy with the verb; no
source at hand says so outright."""
words = ["thirst"]
definition = "u → i / θ _ r"

[sporadic_trough_x_to_f]
time = 1440
name = "SPORADIC: trough keeps its *x as *f"
description = """From the 14th century a coda *x after a back vowel is either lost or becomes *f, and each word
keeps one outcome: though and through lose it, enough, rough and trough have [f] (Minkova §5.1.4,
table (5), PDF 113–114; Jones, Steponavičius §202, Pyles & Algeo p. 176). t = 1440, before
me_x_loss (1450)."""
words = ["trough"]
definition = "x → f / [+syll, +back] _"

[eme_final_fricative_voicing]
time = 1500
name = "SPORADIC: five and wise take the voiced fricative of their inflected forms"
description = """ME fīf, fīve > RP five. Final fricatives were voiceless in Old English, and Middle English
voices them only where an inflection followed (Minkova §4.4, PDF 89–91; Jones §3.5, Table 3.32, PDF
189, and §3.5.1, PDF 199: fif/fiues). So the [v] of five is the allophone of its inflected forms,
not a sound law: reef, staff, sheaf keep [f]. Word-scoped; it used to be stated for every final *f.

Minkova (PDF 93–94) gives the same origin for "<wise> with [-z]": the singleton fricative of wīse
was voiced before the final schwa, and the schwa loss left the [z] at the word end. All final [ð]
in PDE goes back to that schwa loss; lithe reaches it regularly from OE līþe (sporadic_lithe_ja_stem).
The 1400 targets of five and wise still have the voiceless fricative."""
words = ["five", "wīsaz"]
definition = ["f → v / [+syll] _ #", "s → z / [+syll] _ #"]



[pde_north_vowel]
time = 1735
name = "NORTH: a short /ɔ/ before coda /r/ lengthens"
description = """ME corn, horn, thorn, stork, ford > RP /kɔːn/, /hɔːn/, /θɔːn/, /stɔːk/, /fɔːd/.

Dated 1735, just before pde_nurse_vowel (1740), and that ordering is what keeps the two apart: this
one leaves a LONG vowel, and NURSE asks for a short one, so the NORTH words are out of its reach
without a clause naming them."""
definition = "ɔ → ɔː / _ ɹ [-syll]* $"



[pde_mother_shortening]
time = 1750
name = "A long /uː/ shortens to /ʌ/ before /ð/"
description = """The Great Vowel Shift takes ME ōther, brōther, mōther to /uː/, and RP has the STRUT
vowel: /ˈʌðə/, /ˈbɹʌðə/, /ˈmʌðə/. Dated 1750, before the FOOT–STRUT split would have to see it."""
definition = "uː → ʌ / _ ð"

[wg_th_hardening_after_l]
time = 404
name = "*þ hardens to *d after *l"
description = """*hulþaz > OE hold, *gulþīnaz > golden, *felþuz > feld. The dental fricative becomes
a stop after an *l — and only after an *l:

  after *r it does NOT — *murþą is OE morþ, *werþaz is weorþ;
  after a NASAL there is no *þ left to harden — the nasal-spirant loss (310) has just taken *tanþs,
  *munþaz, *kunþaz, *anþeraz to *tōþ, *mūþ, *cūþ, *ōþer, lengthening the vowel and keeping the
  fricative. Written for any sonorant AND dated before that rule, this hardened the *þ while the
  nasal was still in front of it and gave **tand, **mund, **kund, **ander for five of Old English's
  most ordinary words.

t = 315, immediately after the nasal-spirant loss, for exactly that reason.

t = 404, after the Proto-West Germanic checkpoint (403). Ringe & Taylor list *lþ > *ld among
the northern West Germanic changes (§5.1.3, PDF 171), and Wiktionary's PWGmc keeps *golþ. It
still runs after the nasal-spirant rules, which come earlier in the file at the same date."""
definition = "θ → d / [+lat] _"

[oe_final_j_loss]
time = 471
name = "A word-final *j after a vowel is lost"
description = """The *-ijaz nouns end in a stranded *j once the ending is gone — *andijaz > *andij,
*mēkijaz > *mēkij — and Old English has ende, mēċe. The *j simply goes, and the *i before it is the
*-e of the citation form (oe_unstressed_i_to_e, 472).

AFTER A VOWEL. Written unrestricted it also takes the second half of the GEMINATE *jj that West
Germanic gemination has just made, and *hagjō > heċġ came out **heċ."""
definition = "j → ∅ / [+syll] _ #"



[ts_simplification]
time = -950
name = "The double-dental cluster *ts simplifies to *s before a vowel"
description = """Ringe §5.2.1 (i): *ts "simplified to *s when a long vowel, a diphthong, or a
consonant immediately preceded". *weydsós > *wīsaz, *swḗdʰh₁sos > *swēsaz.

THE ENVIRONMENT IS COMPLETED BY WHAT FOLLOWS, and that is what an earlier pass missed. Written as
Ringe states it — on what precedes alone — the rule cannot be had: *pṓds > *fōts and *wrōds >
*wrōts have the same long vowel and the same *ts and they KEEP it (OE fōt, wyrt). But they are not
indistinguishable at all. In *fōts and *wrōts the cluster is WORD-FINAL; in *wīsaz and *swēsaz a
vowel follows it. Say "before a vowel" and both sides come out right, and Ringe's footnote 9 — the
doubt about whether *wīsaz ever had the cluster — is not needed to explain the exception.

t = -950, AFTER Grimm (-1000). The *ts does not exist before then: it is Grimm devoicing the *d of
PIE *weyd-s-, and a rule dated earlier has nothing to match. Which is also why the DIPHTHONG clause
is not redundant with the long-vowel one — at this date *wīsaz is still *wejtsos, with the glide."""
definition = [
    "t → ∅ / [+syll, length: long] _ s [+syll]",
    "t → ∅ / [-syll] _ s [+syll]",
]

[oe_anglian_smoothing]
time = 412
name = "Anglian smoothing before /x/ + consonant"
description = """Anglian (Ringe & Taylor §7.3) undoes breaking before a velar: the diphthong that
oe_breaking made in front of an *h collapses back to a monophthong. Present-Day English descends
from the Anglian dialects, not West Saxon, and the modern words are the Anglian outcome — niht >
night, riht > right, miht > might. Restricted to *h + CONSONANT (the *ht cluster): word-final and
pre-vocalic *h keep their West Saxon diphthong in the gold (feax, eoh), so the smoothing there
would trade one dialect's words for the other's. The *eo clause runs before *ht, *hs and *hþ, the
clusters of palatal umlaut (Ringe & Taylor §6.9.7, PDF 351–352), which on Campbell's account began
with this monophthongization; it gives six. The *ea clause stays pinned to *ht: *fax keeps its
West Saxon *feax in the gold, and palatal umlaut does not include ea."""
definition = ["e o → e ∅ / _ x (t | s | θ)", "æ ɑ → æ ∅ / _ x t"]

