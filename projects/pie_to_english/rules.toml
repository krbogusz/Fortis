description = "*ribją gives OE ribb. The nominative *ribi had no *j left to geminate, so its single *β becomes *f (404). Cause: levelling. ribb takes the stop *bb of its oblique forms, where West Germanic gemination of *b before *j gave *bb (Ringe & Taylor, PDF 66; wg_gemination). This rule restores the stop, and sporadic_ja_stem_gemination (459) then doubles it."
words = ["rib"]
definition = "f → b"

[sporadic_ebb_ending]
time = 457
name = "SPORADIC: *abjǭ > OE ebba ends in -a"
description = "*abjǭ is the masculine weak noun ebba in Old English, ending -a, not the -e the weak ōn-stem rule gives. Word-scoped, after that rule."
words = ["ebb"]
definition = "e → ɑ / _ #"


[sporadic_ow_vocalisation]
time = 1260
name = "SPORADIC: the *ɣ-derived final velar vocalises to *w — marrow, tallow, saw, yellow"
description = """Middle English marow, talow, saw, yelow, farow: a word-final velar fricative (not a
true stop) vocalises to *w — with a svarabhakti *ɔ after a consonant. Word-scoped, because by
Middle English these have merged with the true stops (buck, oak) that do NOT vocalise.

farrow joins the list on the strength of its OBLIQUE stem: OE fearh 'pig' inflects fearges, and it
is that *ɣ — not the nominative's final *h — that the Middle English farow generalises, exactly as
marrow generalises the *ɣ of mearges. The nominative-only *h of a word with no such oblique does
not vocalise, which is why this stays a word list rather than a general rule about final velars.

sullow (OE sulh, pl. sylh, Kroonen PDF 531) has ME sulow without any oblique *ɣ: its *h after *l
had two Middle English outcomes, the vocalisation here and the hardening to k of elk (1000). The
choice between them is lexical, so sullow is named here."""
words = ["marrow", "tallow", "gelwaz", "farrow", "sallow", "sullow"]
definition = [
    "[+back, aperture: high, -son, nasal: none] → ɔ w / [+cons, +son] _ #",
    "[+back, aperture: high, -son, nasal: none] → w / [+syll] _ #",
    # The svarabhakti half on its own, for the w-stems (sallow, yellow): they already HAVE their
    # final *w — sporadic_w_stem_ow_restoration put it back at 1180 — and only need the *ɔ that
    # makes it syllabic. Same output as clause 1, reached from a *w instead of a velar.
    "∅ → ɔ / [+cons, +son] _ w #",
]

# The same Middle English *-ow, reached from the other direction: not from a velar but from the
# *-u that oe_final_w_to_u made out of a *w in the first place.
[sporadic_w_stem_ow_restoration]
time = 1180
name = "SPORADIC: the w-stem adjectives restore their *w in Middle English — sallow, yellow"
description = """OE salu and geolu are the nominative singular of w-STEM adjectives, and the *w
they end in survives all through the paradigm: the oblique cases are salwes, geolwes. Middle
English levels the stem with the *w restored and a svarabhakti *ɔ before it — salow, yelow — and
that is the form the modern sallow and yellow continue.

This exactly undoes oe_final_w_to_u (468), which turned the *w of *salw, *gelw into the *u of the
attested OE salu, geolu. The nominative is what Old English records and what the 900 column is
transcribed in, so the *u has to be made; Middle English then generalises the oblique stem instead,
and the *w comes back.

t = 1180: AFTER eme_short_e_opens (1150), which gives yellow its *ɛ, and BEFORE
me_unstressed_reduction (1200). That window is narrow but forced — left any later, the final *u
has already reduced to schwa and then been deleted, and sallow came out **seɪl and yellow **jiːl,
with no trace of the *w at all.

The *w comes back BARE here, with no vowel before it: *salw, *gelw. The svarabhakti *ɔ that makes
the syllabic *-ɔw is added later, by the third clause of sporadic_ow_vocalisation (1260), and the
split is what makes the timing work. A *w restored bare CLOSES the syllable, so neither of the two
rules at 1200 can touch it — me_unstressed_reduction finds no unstressed vowel to reduce, and the
open-syllable lengthening finds no open syllable. Restore the whole *-ɔw here in one step and both
of them fire: the *ɔ reduces to schwa and the stem vowel lengthens, giving **saːləw for the
attested ME salow. marrow and tallow escape the same trap by accident of dating — their velar does
not vocalise until 1260 — and this rule pair just gives sallow and yellow the same shelter.

Word-scoped: OE has plenty of other final *-u (sunu, giefu, ġiest) that is NOT a w-stem and simply
reduces away. Only the words whose modern reflex still shows the *-ow belong here."""
words = ["sallow", "gelwaz"]
definition = "u → w / [+cons] _ #"

[sporadic_anglian_close_e]
time = 1100
name = "SPORADIC: OE ǣ continues as the Anglian close ē in Middle English — seed, high"
description = """Present-Day English descends from Anglian, where OE ǣ (from *ē₁ or i-mutation) is a
close ē: seed, queen, high, match give ME sēd, kwēn, hēh, mēche with /eː/, not the West Saxon open
/ɛː/ our cascade carries. Word-scoped to those whose modern reflex (seed /iː/, etc.) confirms the
close vowel. nigh is Anglian nēh, monophthongised before *h, against WS nēah (Ringe & Taylor PDF
194)."""
words = ["seed", "hauhaz", "mēkijaz", "nigh"]
definition = "ɛː → eː"

[sporadic_three_lowering]
time = 1100
name = "SPORADIC: *þrīz > ME þrē lowers the long vowel"
description = "*þrīz gives ME þrē /θreː/ — the long *ī lowers to *ē. Word-scoped. Cause: ME þrē continues the OE neuter and feminine form, *þrijō > OE þrīo (Ringe & Taylor, PDF 190), later þrēo, not the masculine þrī of the 900 target."
words = ["three"]
definition = "iː → eː"

[sporadic_me_open_e]
time = 1100
name = "SPORADIC: OE ǣ from *ai continues as the OPEN ME ē (bōniz, eath)"
description = """*bōniz, *auþuz reach OE ǣ from a different source (*ai) than seed/queen, and it is
the OPEN ME ē: bēn, ēþe give /bɛːn/, /ɛːðe/. Word-scoped to distinguish them from the close-ē set."""
words = ["bōniz", "eath"]
definition = "eː → ɛː"

[sporadic_gome_full_osl]
time = 1200
name = "SPORADIC: *gumô lowers and lengthens — ME gome"
description = """ME gome (/goːm/) lowers the high *u to *oː and lengthens it — a variant
of open-syllable lengthening that our rule skips because it excludes high vowels. Word-scoped."""
words = ["gome"]
definition = "[+syll, aperture: high, +back, length: short] → [aperture: mid, length: long]"

[sporadic_lime_m]
time = 1650
name = "SPORADIC: line 'linden' becomes lime"
description = """Hoad s.v. lime³: "linden, xvii. unexpl. alt. of line, var. of lind". The 1400 target
is still ME līn, so the change is dated in the 17th century. Word-scoped: Hoad calls it
unexplained, and no other word changes final n to m."""
words = ["lindō"]
definition = "n → m / _ #"

[eme_price_mouth_lowering]
time = 1690
name = "The first half of [əɪ] and [əʊ] lowers to [a]"
description = """Pyles & Algeo (p. 171, PDF 93): ME ī "went on in most types of English to become in the course
of the seventeenth century [aɪ]", and [əʊ] "became [aʊ] at about the same time". Jones still writes
Cooper's (1687) reflex as [ei]/[əi] (PDF 252–253), so the lowering is dated after that checkpoint.
GOAT's [əʊ] arises only at 1900, so it is not affected."""
definition = ["ə ɪ → a ɪ", "ə ʊ → a ʊ"]

[sporadic_wind_short]
time = 1700
name = "SPORADIC: wind (noun) is reshortened"
description = """Pyles & Algeo (p. 149, PDF 82): after homorganic lengthening, "reshortening has subsequently
occurred, however, in some words — for instance, wind (noun), held, send, friend; compare wind
(verb) … in which the lengthening survives". Minkova §6.4 (PDF 169): the noun and the verb were
"actually homophonous into the late seventeenth century", probably split by homophony avoidance.
So the noun shortens after the 1687 checkpoint. Word-scoped."""
words = ["wind"]
definition = "a ɪ → ɪ"

[sporadic_foot_late_shortening]
time = 1700
name = "SPORADIC: foot shortens to FOOT after the unrounding"
description = """Good, stood, food and foot are recorded with [uː] in the 16th and 17th centuries, and the
shortened [ʊ] gained ground through the 17th; the shortening reached coda -d first, then -v, then
-t, -θ, -k (Minkova §8.3.1, PDF 272, after Dobson §§35–39 and Ogura 1987). Coles (1674) still groups
foot with food ([uː]; Jones, PDF 258). So foot shortens after the 1687 checkpoint, too late for
eme_foot_strut_split (1640), and keeps [ʊ]. The shortening is lexical (food keeps [uː]), so the rule
is word-scoped."""
words = ["foot"]
definition = "uː → ʊ"

[sporadic_gome_strut]
time = 1650
name = "SPORADIC: GOME shortens to the STRUT vowel"
description = "ME gome /goːm/ > RP /gʌm/: the *uː shortens and unrounds to STRUT. Word-scoped. Cause: the lexical early shortening of [uː] that flood and blood also show (sporadic_flood_strut)."
words = ["gome"]
definition = "uː → ʌ"

[sporadic_oe_homorganic_length]
time = 1090
name = "SPORADIC: long, ond and bord lengthen before *ŋg, *nd, *rd in late Old English"
description = """OE lang, ened > lāng, ānd before the rounding of OE ā (me_a_rounding, 1100), which gives the
ME lǭng, ǭnd of the 1400 targets. Jones (§2.2.5–6) dates homorganic lengthening to late OE and early
ME and calls it "patchy". The regular oe_homorganic_lengthening (1050) excludes *ŋg, so the two words
are named here. The ME o of long comes from this long ā, not from a rounding of short a before a
nasal, which Minkova (PDF 156, 238) assigns to the North and West Midlands. OE bord > ME bōrd
lengthens before rd, a cluster Minkova §6.4 (PDF 168–169) lists; a regular rule for the r-clusters
was tested and lost hard, word and yard at 1400 and final, so board is named here."""
words = ["anadô", "long", "board"]
definition = "[+syll, length: short, stress: primary] → [length: long]"

[sporadic_me_homorganic_length]
time = 1210
name = "SPORADIC: ME lengthens the vowel before a homorganic cluster — gernaz, gulþīnaz"
description = """ME yērn lengthens the vowel before *rn — late-OE/early-ME
homorganic lengthening before a voiced homorganic cluster (Jones, *A History of English Phonology*
§2.2.5-6). Jones stresses that the process is "patchy" and "exception-ful": some words lengthen,
some do not, and some lengthen then shorten again (his crumb, hirde). So it is word-scoped to the
words that attest the long vowel, with sporadic_me_shorten for those that keep or revert to a short
one — not a regular rule that would have to pick one behaviour for the whole cluster class.

ME gīlden 'golden' (gulþīnaz) lengthens before *ld in a disyllable, as the Ormulum's kinde, findenn,
climben do (Jones §2.2.5, Table 2.13, PDF 41–42)."""
words = ["gernaz", "gulþīnaz"]
definition = "[+syll, length: short, stress: primary] → [length: long]"

[sporadic_me_shorten]
time = 1210
name = "SPORADIC: dust, hund keep a short vowel in ME"
description = """ME dust, hund keep a short vowel where OE dūst and homorganic lengthening (on
hundą) would give a long one — the "patchy" underside of the same change (Jones §2.2.5-6, who notes
that [nd] clusters are "particularly open to exceptional behaviour"). Word-scoped shortening."""
words = ["dust", "hundą"]
definition = "[+syll, length: long] → [length: short]"

[sporadic_long_short]
time = 1620
name = "SPORADIC: LONG shortens again before the GOAT diphthongisation"
description = "ME lōng /lɔːŋg/ > RP long /lɒŋ/: the vowel lengthened in ME shortens again before it could diphthongise to GOAT. Word-scoped. Cause: homorganic lengthening was patchy, and some words lengthened and then shortened again (Jones §2.2.5–6, cited under sporadic_me_homorganic_length)."
words = ["long"]
definition = "oː → ɒ"

[sporadic_end_long]
time = 1105
name = "SPORADIC: *andiz > ME ēnd lengthens and closes"
description = "*andiz gives ME ēnd /eːnd/ — homorganic lengthening plus the close ē. Word-scoped."
words = ["end"]
definition = "[+syll, length: short, stress: primary] → eː"

[sporadic_pre_r_ae]
time = 1160
name = "SPORADIC: yard, sharp-type keep a front vowel before *r in ME"
description = "ME yerd, þerf front the vowel before *r where our cascade backs or keeps it. Word-scoped to the attested ME forms. Cause: a Southern form. ME e for OE ea before r is the West and Central Southern reflex (Jones Table 2.34, PDF 78, cited for yerd)."
words = ["þarbō"]
definition = "a → ɛ"

[sporadic_dross_short]
time = 1200
name = "SPORADIC: ME drosse has a short vowel"
description = """OE drōs gives ME drosse, whose double s marks a short vowel (the 1400 target), and RP /drɒs/.
Word-scoped. The cause is not known."""
words = ["dross"]
definition = "oː → ɔ"

[sporadic_inflected_osl]
time = 1440
name = "SPORADIC: whale and ware take the long vowel of their inflected forms"
description = """Open-syllable lengthening needs a disyllable, and an inflected form can supply it: OE hwæl,
hwæle(s) (Minkova §7.5.2.1, PDF 222–223); staff beside staves (Jones §3.2, PDF 118–119). The long
vowel then spreads to the uninflected form, but word by word. t = 1440, after the 1400 checkpoint,
which records the short nominative (hwal), and before the glide of lme_al_glide (1450)."""
words = ["whale", "ware"]
definition = "[+syll, length: short, stress: primary] → [length: long]"

[sporadic_bare_long]
time = 1205
name = "SPORADIC: bare, hazel, late, theal lengthen in the open syllable"
description = "*bazaz gives ME bāre /baːr/; open-syllable lengthening should reach it. Word-scoped lengthening. ME hāzel too: only about a quarter of words with a sonorant-final second syllable lengthen, so it is lexical (Minkova §7.5.2.1, PDF 223). For bare the cause is the inflected, disyllabic forms, as for whale (sporadic_inflected_osl), and so it is for ME lāte (OE læt, inflected late) and þēle (OE þel, pl. þelu), whose 1400 targets have the long vowel."
words = ["bare", "hazel", "lataz", "theal"]
definition = "[+syll, length: short, stress: primary] → [length: long]"

[sporadic_dere_e]
time = 1250
name = "SPORADIC: *darjaz > ME dēre has a close ē"
description = "*darjaz gives ME dēre /deːr/; our cascade carries a long *aː. Word-scoped fronting/raising to close ē. The cause is not known."
words = ["dere"]
definition = "aː → eː"

[sporadic_any_short]
time = 1000
name = "SPORADIC: any continues the short OE variant ęniġ"
description = """Minkova §8.2.1 (PDF 238) lists OE æniġ, ęniġ, aniġ, ani, eniġ for any, one of the high-frequency
words with [æn] ~ [ɛn] variation. RP /ˈɛni/ continues a short e variant, not the long ǣniġ of the
900 target, which would give **/ˈiːni/. Word-scoped, dated before OE ǣ is raised (1100)."""
words = ["any"]
definition = "æː → e"

[me_y_suffix]
time = 1210
name = "The unstressed suffix -iġ is ME -i"
description = """Minkova §7.6 (PDF 230–231): "With the exception of [-i] in the affix <-y> (> OE -iġ), all
uncovered vowels in final unstressed syllables in native words were dropped." The reduction of
unstressed vowels (1200) leaves -iġ as [əj]; the suffix is [i] instead, and final schwa loss
(1350) does not touch it."""
definition = ["ə j → i / _ #", "j ə → iː ∅ / [-syll] _ #", "j → iː / [-syll] _ #"]

[sporadic_r_metathesis]
time = 1200
name = "SPORADIC: r metathesis in bright and wright"
description = """Minkova §5.2.2 (PDF 119): metathesis of /r/ and a short vowel is common in OE (worhte ~ wrohte
'wrought', þirdda ~ þridda 'third'), and "bright, burn, burst, cress, crud, dirt … are survivals of
metathesised forms". It is sporadic, so the rule is word-scoped. The ME vowel of bright is i, as
14th-century <brit> shows (Minkova §7.4, PDF 206); the 1400 targets are briht and wriht."""
words = ["berhtaz", "wurhtiz"]
definition = ["ɛ r → r i / _ x t", "i r → r i / _ x t"]

[sporadic_fifth_short]
time = 1100
name = "SPORADIC: fifth shortens its vowel before the suffix"
description = """Minkova §7.5.1.1 (PDF 214–215): a long stem vowel shortened before the derivational -th ~ -t
in late Old and early Middle English (five-fifth, deep-depth, foul-filth), and "-th with ordinal
numerals causes shortening in fifth, tenth but not in ninth". OE fīfta is long (the 900 target) and
ME fifte short (the 1400 target), so the rule sits between them. Word-scoped, because ninth keeps
its long vowel."""
words = ["fifth"]
definition = "iː → i"

[sporadic_ten_short]
time = 1300
name = "SPORADIC: ten shortens before 1400"
description = """Minkova §8.3.1, note 32 (PDF 271): ten < OE Angl. tēn(e) is one of the monosyllables
shortened before the Vowel Shift; fifteen keeps the long vowel, and the shift raised it.
Wiktionary's ME ten is already short [tɛn], so this shortening is dated before the 1400
checkpoint. The short vowel is the DRESS [ɛ] of ME. Word-scoped, like end below."""
words = ["ten"]
definition = "eː → ɛ"

[sporadic_end_short]
time = 1550
name = "SPORADIC: END shortens to DRESS before the Vowel Shift"
description = "ME ēnd shortens to /ɛnd/ before the shift can raise it, like death/stead. Word-scoped."
words = ["end"]
definition = "eː → ɛ"

[sporadic_salve_v]
time = 1300
name = "SPORADIC: *salbō > ME salve voices its *f to *v"
description = "*salbō gives ME salve /salv/; the word-final *f voices to *v (the -ve of the spelling). Word-scoped. Cause: the [v] of the inflected forms, as in five (eme_final_fricative_voicing)."
words = ["salve"]
definition = "f → v / _ #"

[sporadic_salve_l]
time = 1980
name = "SPORADIC: salve takes back its /l/ with the TRAP vowel: /sɑːv/ > /salv/"
description = """CUBE has only /sálv/. The rules give the older /sɑːv/: Mulcaster (1582) and Cooper (1687)
have no l (see eme_l_loss), and Minkova §8.2.1 (PDF 241) still prints [sɑːv]. Walker (1791, quoted by
Jones, PDF 310) has the l "mute in the noun salve" but "heard in the verb to salve, and in salver".
Word-scoped. Cause: not known. Walker's verb kept the [l], but no source here says that the noun took
it from the verb. The date is not known either, so the rule shares the date of the CUBE block."""
words = ["salve"]
definition = "ɑː → a l / _ v"

[sporadic_light_raising]
time = 1105
name = "SPORADIC: *leuhtą > ME liht raises to *i before *ht"
description = "*leuhtą gives ME liht /lixt/; the long *eː before *ht raises to *i, as in the night/right class. Word-scoped."
words = ["light"]
definition = "eː → i / _ x"

[sporadic_knee_no_w]
time = 1150
name = "SPORADIC: *knewą > ME knē drops the final *w"
description = "OE cnēow gives ME knē /kneː/ — the final *w is lost. Word-scoped. Cause: ME knē continues the OE variant cnēo, without the levelled *w (Ringe & Taylor, PDF 189)."
words = ["knee"]
definition = "w → ∅ / _ #"

[eme_bullokar_epenthesis]
time = 1578
name = "Bullokar's epenthesis: a vowel splits a stressed liquid + sonorant cluster"
description = """Jones §4.3, Table 4.13 (PDF 264–265), from Bullokar's Booke at Large (1580): his half-vowel
symbols suggest that "stressed vowel peak + syllable termination in bi-continuant cluster
combinations were heard as bi-syllabic, the highly vowelly double sonorant cluster being 'split' by
an epenthetic vowel peak". His [rn], [rm], [rl] and [lm] examples include corn, thorn, warm, worm,
harm, helm and elm. Dated just before the 1580 checkpoint, where the targets write the vowel."""
definition = [
    "∅ → ə / [+syll, stress: primary] r _ (m | n | l)",
    "∅ → ə / [+syll, stress: primary] l _ m",
]

[eme_bullokar_epenthesis_lost]
time = 1585
name = "The epenthetic vowel of Bullokar's clusters is gone again"
description = """Inferred from the lexicon: none of warm, harm, corn, thorn, helm, worm or elm has the vowel in
its modern form, and no later checkpoint in the set records it. Jones presents the split as
Bullokar's (PDF 264–265). Dated right after the 1580 checkpoint, before eme_w_rounding_a (1590).
The rule cannot tell an inserted vowel from an old one: it also takes the old schwa of azaniz
(*ærən > *ærn), which has no target after 403."""
definition = [
    "ə → ∅ / [+syll, stress: primary] r _ (m | n | l)",
    "ə → ∅ / [+syll, stress: primary] l _ m",
]

[eme_w_rounding_a]
time = 1590
name = "Short *a rounds to *ɒ after *w (Early Modern English)"
description = """After /w/ (including /kw/), Early Modern English rounds short *a to *ɒ: was, what,
wash, want, swan, wander, and before *r the long START vowel to *ɔː — war, warm, ward, swarm, quart,
dwarf (Jones ch. 4; the WATH/WASP rounding). NOT before a velar, where it stays (wag, wax, twang,
swank; Minkova §8.2.1, PDF 239–240). Before the START backing (eme_short_a_backs, 1740) so the
*w-rounded words never reach START.

t = 1590. It reads only [æ], so the Vowel Shift's [əɪ] (1560) is out of its reach; when the
shift wrote [aɪ] directly, a rounding dated after it rounded the new [aɪ] of white, wise, wight. Minkova dates the rounding from the 15th century
(PDF 239), and Bullokar's unrounded warm of 1580 (Jones PDF 264) is still before it."""
definition = ["æ → ɔ / w _ r", "æ → ɒ / w _ // _ [-syll, +back]"]


[sporadic_buttaz_istem]
time = 476
name = "SPORADIC: *buttaz > OE bytt — i-stem i-mutation of *u to *y"
description = "OE bytt is an i-stem (Ringe & Taylor), so its *u i-mutates to *y where the a-stem *buttaz would keep it. Word-scoped."
words = ["buttaz-end"]
definition = "u → y"

[sporadic_sister_backmutation]
time = 470
name = "SPORADIC: *swestr- > OE sweostor — back mutation of *e to *eo across the cluster"
description = "OE sweostor has the *eo of back mutation (u-umlaut); oe_back_mutation reaches it only across a single liquid, not the *str cluster. Word-scoped."
words = ["sister"]
definition = "e → e o"

[sporadic_buttaz_u]
time = 1145
name = "SPORADIC: *bytt keeps a rounded *u in ME — butt, not **bitt"
description = "OE bytt gives ME but(t) /but/ (> butt /bʌt/) with the rounded reflex of *y, not the East-Midland unrounding to *i. Word-scoped, before me_y_unrounding."
words = ["buttaz-end"]
definition = "y → u"

[wg_zd_simplification]
time = 404
name = "*zd simplifies to *d, lengthening the vowel — *mizdō > mēd"
description = """The cluster *zd loses its *z with compensatory lengthening of the vowel before the
rhotacism of *z can reach it: *mizdō > OE mēd 'reward'. Ringe & Taylor §3.3.1 (PDF 99): this happens
only after *i, and only occasionally (mēd beside meord), while hord and heordan keep their r. The
*i comes out as long mid ē. Dated 404, before wg_rhotacism (405), which would otherwise give
**merd."""
definition = "[+syll, aperture: high, +front, length: short] z → [aperture: mid, length: long] ∅ / _ d"


[sporadic_welkin_e]
time = 1150
name = "SPORADIC: *wolcen > ME welken has a front *ɛ"
description = "OE wolcen gives ME welken /wɛlkən/ — the *o fronts to *ɛ (the West-Saxon weor- reflex). Word-scoped."
words = ["welkin"]
definition = "ɔ → ɛ"

[sporadic_yard_front_r]
time = 1160
name = "SPORADIC: *geard > ME yerd has a front *ɛː before *r"
description = "OE ġeard gives ME yerd /jɛːrd/, with the front reflex of *ea before *r, where our cascade merges it to back *a. Word-scoped. Cause: yerd is the West and Central Southern reflex (Jones Table 2.34, PDF 78)."
words = ["yard"]
definition = "a → ɛː / _ r"

[sporadic_yard_back_modern]
time = 1450
name = "SPORADIC: yard's modern reflex is the BACK (START) vowel, not the ME front one"
description = """ME yerd is front, but the surviving modern yard /jɑːd/ continues the back-vowel doublet (ġeard beside ġerd). Word-scoped: the ME front *ɛː backs to *ɑ before *r so START applies.

Jones Table 2.34 (PDF 78): yerd is the West and Central Southern reflex. Late ME *ɛr > *ar (Jones
§4.3, Tables 4.9–4.10, PDF 259–260; Minkova §8.3.2, PDF 275–276) gives the same back vowel.

t = 1450, after the 1400 checkpoint, which records yerd, and before emode_vowel_shift. Dated 1600,
the rule came after the Vowel Shift in file order. The shift had already raised the *ɛː, so the
rule never fired."""
words = ["yard"]
definition = "ɛː → ɑ / _ r"

[sporadic_atter_a]
time = 1210
name = "SPORADIC: *attraz > ME ater keeps a short *a"
description = "OE ātor/attor gives ME ater /atər/ with a short unrounded *a, not the *ɔ our ā-rounding + OSL give. Word-scoped. Cause: ME ater continues the short a of the geminated variant attor (sporadic_atter_short)."
words = ["atter"]
definition = "ɔ → a"

[sporadic_lindo_nd]
time = 1250
name = "SPORADIC: *lindō > ME line loses the *d of *nd"
description = "OE lind 'linden' gives ME line /liːn/ — the *d of the *nd cluster is lost. Word-scoped. The cause is not known. Hoad calls line a variant of lind (s.v. lime³)."
words = ["lindō"]
definition = "d → ∅ / n _ #"

[eme_kn_simplification]
time = 1680
name = "Initial /kn-/ and /gn-/ lose their stop"
description = """Initial <kn->, <gn-> were still /kn-/, /gn-/ in the 14th century; the simplified forms spread
through the 15th and 16th, and by the latter half of the 17th century they prevailed (Minkova
§5.3.1, PDF 132–133): knee, knight, gnat."""
definition = ["k → ∅ / # _ n", "g → ∅ / # _ n"]

[pde_price_r_centring]
time = 1610
name = "PRICE before /r/ takes a schwa: fire, wire"
description = """The PRICE diphthong develops a schwa before /r/: Hart (1569) already writes fire as [feiər]
(McMahon §6.3.1, PDF 246–247), and Gil (1621) has fjer beside fjr, hjer 'hire', attier (Jones §4.3,
Table 4.6, PDF 255), which Jones reads as [əiər]. So the rule is dated after the Vowel Shift (1560)
and before the 1621 checkpoint, on the shift's [əɪ] and before the trill becomes [ɹ] (1620). The
later lowering to [aɪ] keeps the schwa."""
definition = "ə ɪ → ə ɪ ə / _ r"

[pde_mouth_r_centring]
time = 1745
name = "MOUTH before *r takes a schwa offglide — sour, hour, flower"
description = """The MOUTH diphthong the Vowel Shift made from *uː takes a centring schwa before
*r: sour /saʊə/, hour, flower, power. The parallel of pde_centring_diphthongs, but for the diphthong
rather than the long monophthong. Dated 1755, after the shift and before r-loss."""
definition = "a ʊ → a ʊ ə / _ ɹ"

[sporadic_weather_dental]
time = 1550
name = "SPORADIC: *weder > weather — intervocalic *d becomes *ð"
description = """OE weder, fæder, mōdor give weather, father, mother with /ð/. Before syllabic /r/, etymological
<-der> began to be spelled <-ther> in the 15th century, and the two forms varied from the 16th to the
18th (Minkova §5.2.3, PDF 124–125; Hoad s.v. father: "cf. mother, gather, hither, together, whether").
The change is lexical: ladder, adder and fodder keep /d/. Word-scoped."""
words = ["weather", "mōdēr", "fadēr"]
definition = "d → ð / [+syll] _ [+syll]"

[sporadic_evil_long]
time = 1500
name = "SPORADIC: evil keeps a long *iː"
description = "OE yfel > ME evel lengthens in the open syllable to /eːvəl/ (whence modern /ˈiːvəl/ via the Vowel Shift); our cascade carries a short high vowel, so it is set to the long mid *eː the shift then raises. Word-scoped. Cause: ME e for OE y is the South-Eastern reflex, as in merry and bury (Minkova, PDF 195–196), and the lengthening is the lexical one of words with a sonorant peak (Minkova §7.5.2.1, PDF 223)."
words = ["evil"]
definition = "i → eː"

[sporadic_yoke_goat]
time = 1650
name = "SPORADIC: yoke has a long *oː > GOAT, not the short LOT vowel"
description = """OE ġeoc > ME yoke has a long *oː (open-syllable) that the GOAT diphthongisation takes to /jəʊk/; our cascade keeps it short. Word-scoped lengthening, after the Vowel Shift and before GOAT.

The long vowel comes from the inflected, disyllabic forms (Jones §3.2, PDF 118–119; Minkova
§7.5.2.1, PDF 222–223). The rule matches *ɔ: me_short_o_opening opens the vowel at 1150, so a
pattern on *o never fired."""
words = ["yoke"]
definition = "ɔ → oː"

[sporadic_ell_no_n]
time = 1500
name = "SPORADIC: *eln > modern ell drops the final *n"
description = "OE eln > ME elne > modern ell /ɛl/ — the final *n is lost. Word-scoped. Cause: assimilation of final n to the preceding l, as in OE mylen 'mill' > ME melle (Minkova, PDF 196)."
words = ["ell"]
definition = "n → ∅ / _ #"

[sporadic_erf_no_voice]
time = 1900
name = "SPORADIC: erf keeps a voiceless *f"
description = "RP erf /ɜːf/ has a voiceless final *f where ME erve had [v] (the 1400 target ɛrv, voiced between vowels before the schwa was lost). Word-scoped re-devoicing. Cause: devoicing of a final [v], which ME spellings such as luf 'love' and gif 'give' show (Jones Table 3.32, PDF 189). Wiktionary tags the word Northern England and Scotland, rare."
words = ["erf"]
definition = "v → f / _ #"

[sporadic_wagnaz_ae]
time = 1150
name = "SPORADIC: *wagnaz > ME wain has a front *æ"
description = "OE wægn > ME wain /wæjn/ keeps the front *æ before the *j, where our æ/ɑ merger backs it. Word-scoped. No cause in the word: the æ is the first half of the diphthong that OE æ formed with a palatal g, spelled dæi beside dæġ (Minkova, PDF 83), which the æ/ɑ merger does not reach. Only this word is scored on it at 1400."
words = ["wagnaz"]
definition = "a → æ / _ j"

[sporadic_wapso_metathesis]
time = 1250
name = "SPORADIC: *wapsō > ME wasp — *ps metathesises to *sp"
description = "OE wæps/wæsp gives ME wasp with the metathesised *sp (the standard modern form). Word-scoped."
words = ["wapsō"]
definition = "1=p 2=s → @2 @1"

[sporadic_ferhuz_xloss]
time = 1390
name = "SPORADIC: *ferhuz > ME fer loses its *x after *r, lengthening the vowel"
description = """OE feorh > ME fer(e) /fɛːr/ — the *x of the *rx coda is lost with compensatory lengthening, which me_x_loss (a vowel + x) does not reach. Word-scoped, before it.

Coda *h varies with zero from the 13th and 14th centuries (Minkova §5.1.4, PDF 113–115).
t = 1390, before the 1400 checkpoint, which records fer. Dated 1440, the rule came after that
checkpoint and never reached it."""
words = ["ferhuz"]
definition = ["[+syll] → [length: long] / _ r x", "x → ∅ / r _"]

[sporadic_haven]
time = 460
name = "SPORADIC: *habanō > OE hæfen keeps the brightened *æ (a-restoration not applied)"
description = """OE hæfen 'haven' keeps the Anglo-Frisian *æ where a-restoration would back it before
the following *a — the same lexical patchiness Jones §3.2 notes for these changes. Word-scoped:
re-front the stressed vowel, and the *-anō ending reduces to *-en (the *a to *e, the *u lost)."""
words = ["haven"]
definition = ["[+syll, stress: primary, +back, aperture: low] → [+front, back: none, advancement: atr]", "ɑ → e", "u → ∅ / n _ #"]

[sporadic_south_syncope]
time = -940
name = "SPORADIC: *sunþraz syncopates the *-teros suffix vowel before *r"
description = "The attested PGmc *sunþraz 'south' has the syncopated *-þr-, where *anþeraz 'other' keeps the vowel — the *-tero- suffix's vowel is lost lexically. Word-scoped. The cause is not known. Ringe & Taylor give PNWGmc *sunþraz (PDF 156), but Kroonen reconstructs *sunþera- with the vowel (PDF 433)."
words = ["south"]
definition = "ɑ → ∅ / θ _ r"

[sporadic_bumblebee_no_raising]
time = -900
name = "SPORADIC: *humelaz keeps *e — no unstressed *e > *i raising"
description = "OE humela keeps the *e that unstressed_e_to_i raises to *i (the raising is doubtful — Kroonen/Lloyd; cf. the *nista-/*fiska- discussion). Word-scoped restoration of the *e."
words = ["bumblebee"]
definition = "i → e / m _ l"

[sporadic_riutidi_suffix]
time = 0
name = "SPORADIC: *riutidi keeps the suffix *i (no syncope)"
description = "The 3sg *riutidi keeps its *-i-, which our syncope wrongly drops (giving **riwtði). Word-scoped restoration. No cause in the word: the rule undoes a syncope that the regular rules apply here wrongly."
words = ["riutidi"]
definition = "∅ → i / [-syll] _ ð"


[sporadic_stojo_j]
time = 0
name = "SPORADIC: *stōjō keeps its intervocalic *j"
description = "The attested *stōjō keeps the *j our cascade drops between the two long vowels. Word-scoped restoration. No cause in the word: the rule restores a *j that the regular rules drop wrongly."
words = ["stōjō"]
definition = "∅ → j / [+syll] _ [+syll]"

[sporadic_seven_t_loss]
time = 10
name = "SPORADIC: *septm̥ > *seƀun loses the *t of *ft"
description = """The cluster *ft (< *pt) loses its *t: *septm̥ > *seƀun (OE seofon), keeping the Verner-voiced *ƀ. Our cascade instead devoices the *ƀ before the surviving *t. Word-scoped t-loss, before that devoicing.

Kroonen names the cause: in the ordinal *septm̥-tHó- the first *t was dissimilated against the suffix
*t, and the cardinal took the *t-less root from it (s.v. *sebun-, *sebunþ/dan-, PDF 469). *ēbanþ-
'evening' has the same dissimilation (*h₁éh₁pt-ont-, PDF 153)."""
words = ["seven", "seventh", "even"]
definition = "t → ∅ / β _"

[sporadic_anadz_cluster_voice]
time = 10
name = "SPORADIC: the *þs cluster of *anadz voices together to *ðz (Verner on the cluster)"
description = "*anadz 'duck' has BOTH consonants voiced (Kroonen *anad-): Verner voices the whole *þs cluster to *ðz after the unaccented vowel, not just the *þ. Our cascade voices only the *þ, then devoices it before the surviving *s. Word-scoped voicing of the *s, before that devoicing."
words = ["anadz"]
definition = "s → z / ð _"
