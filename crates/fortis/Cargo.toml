[package]
name = "fortis"
version = "0.1.0"
edition = "2024"

[dependencies]
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
indexmap = "2.14.2"
rayon = "1.12.0"
toml = { version = "1.1.7", features = ["preserve_order"] }
unicode-general-category = "1.1.0"

[[bin]]
name = "fortis"
path = "src/main.rs"

[[bin]]
name = "fortis-induce"
path = "src/bin/fortis-induce.rs"

[[bin]]
name = "fortis-scoreboard"
path = "src/bin/fortis-scoreboard.rs"
